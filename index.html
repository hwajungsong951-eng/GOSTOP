          capture: ['필요한 패는 반드시 내가 먹어.', '계산대로군. 계속 가지.', '한 장 한 장이 다 의미가 있어.'],
          ppeok: ['계산 하나가 어긋났군. 크게 볼 것 없어.', '뻑은 판의 흐름일 뿐이야.', '다음 수로 만회하면 돼.'],
          go: ['배수 싸움이야. 고.', '확률이 내 편이야. 고.', '여기서 멈추면 손해야. 고.'],
          stop: ['이 판은 이걸로 끝. 스톱.', '위험 대비 수익이 맞아. 스톱.', '계산대로 걷고 접는다. 스톱.'],
          win: ['예상한 결과야.', '판을 읽으면 이기는 건 당연해.', '다음 판도 같은 계산이야.'],
          lose: ['변수 하나를 놓쳤군.', '이 정도 걸림은 계산 안이었다.', '다음 판은 수치가 달라.'],
          pibak: ['피를 다 뺏기다니, 나를 얕봤군.', '이 손실은 기록해 둬야겠어.', '계산에서 피가 빠졌군. 다음엔 없어.']
        })
      })
    ]);

    const DIFFICULTY_DEFAULTS = Object.freeze({
      easy: 'gwangryeol',
      normal: 'jjakkwi',
      hard: 'pyeonggyeongjang'
    });

    // 이전 캐릭터 id → 새 id (저장된 전적/설정 호환)
    const LEGACY_IDS = Object.freeze({
      cheolsu: 'gwangryeol',
      younghee: 'jungmadam',
      doryeong: 'jjakkwi',
      gildong: 'agwi',
      okran: 'pyeonggyeongjang'
    });

    function getCharacter(idOrDiff) {
      if (!idOrDiff) return CHARACTERS[4];
      const resolved = LEGACY_IDS[idOrDiff] || idOrDiff;
      const byId = CHARACTERS.find(c => c.id === resolved);
      if (byId) return byId;
      const mapped = DIFFICULTY_DEFAULTS[idOrDiff];
      if (mapped) return CHARACTERS.find(c => c.id === mapped);
      return CHARACTERS[4];
    }

    function getLinesFor(ch, situation) {
      try {
        const custom = Store.getCustomLines();
        const bySit = custom && custom[ch.id];
        const arr = bySit && bySit[situation];
        if (Array.isArray(arr) && arr.length > 0) return arr;
      } catch (_) {}
      return (ch.lines && ch.lines[situation]) || ['...'];
    }

    function getDialogue(characterId, situation, rngState) {
      const ch = getCharacter(characterId);
      const pool = getLinesFor(ch, situation);
      const r = Engine.nextRand(rngState != null ? rngState : 1);
      const idx = Math.floor(r.value * pool.length);
      return { text: pool[idx], rngState: r.rngState, character: ch };
    }

    // --- Public Observation Builder (Strictly NO opponent hand cards, NO deck array) ---
    function buildObservation(state, playerId) {
      const me = state.players[playerId];
      const seenIds = Object.create(null);
      const inMyHandByMonth = Object.create(null);
      const onFloorByMonth = Object.create(null);

      for (const c of me.hand) {
        if (c.isEmptyBomb) continue;
        seenIds[c.id] = true;
        if (c.month >= 1) inMyHandByMonth[c.month] = (inMyHandByMonth[c.month] || 0) + 1;
      }
      for (const c of state.floor) {
        seenIds[c.id] = true;
        if (c.month >= 1) onFloorByMonth[c.month] = (onFloorByMonth[c.month] || 0) + 1;
      }

      const opponents = [];
      let totalOppHand = 0;
      for (const p of state.players) {
        const cap = p.captured;
        for (const c of cap.bright) seenIds[c.id] = true;
        for (const c of cap.animal) seenIds[c.id] = true;
        for (const c of cap.ribbon) seenIds[c.id] = true;
        for (const c of cap.junk) seenIds[c.id] = true;

        if (p.id !== playerId) {
          totalOppHand += p.hand.length;
          opponents.push({
            id: p.id,
            name: p.name,
            handCount: p.hand.length,
            captured: p.captured,
            goCount: p.goCount,
            lastGoScore: p.lastGoScore,
            shakeMonths: p.shakeMonths,
            bombMonths: p.bombMonths,
            ppeokCount: p.ppeokCount
          });
        }
      }

      const unseenByMonth = Object.create(null);
      let totalUnseenNonBonus = 0;
      for (let m = 1; m <= 12; m++) unseenByMonth[m] = [];
      for (const c of Engine.CARDS_48) {
        if (!seenIds[c.id]) {
          unseenByMonth[c.month].push(c);
          totalUnseenNonBonus++;
        }
      }

      const oppHoldProbByMonth = Object.create(null);
      const deckFlipProbByMonth = Object.create(null);
      for (let m = 1; m <= 12; m++) {
        const u = unseenByMonth[m].length;
        if (u === 0 || totalUnseenNonBonus === 0) {
          oppHoldProbByMonth[m] = 0;
          deckFlipProbByMonth[m] = 0;
        } else {
          deckFlipProbByMonth[m] = u / totalUnseenNonBonus;
          let probNoneInOpp = 1;
          for (let k = 0; k < u; k++) {
            const denom = totalUnseenNonBonus - k;
            const numer = Math.max(0, denom - totalOppHand);
            probNoneInOpp *= denom > 0 ? numer / denom : 1;
          }
          oppHoldProbByMonth[m] = 1 - probNoneInOpp;
        }
      }

      return {
        playerId,
        config: state.config,
        phase: state.phase,
        turn: state.turn,
        firstPlayer: state.firstPlayer,
        nagariStack: state.nagariStack,
        pendingAction: state.pendingAction,
        myHand: me.hand,
        myCaptured: me.captured,
        myGoCount: me.goCount,
        myLastGoScore: me.lastGoScore,
        myShakeMonths: me.shakeMonths,
        myBombMonths: me.bombMonths,
        myPpeokCount: me.ppeokCount,
        opponents,
        totalOppHand,
        floor: state.floor,
        ppeokMonths: state.ppeokMonths,
        deckCount: state.deck.length,
        inMyHandByMonth,
        onFloorByMonth,
        unseenByMonth,
        totalUnseenNonBonus,
        oppHoldProbByMonth,
        deckFlipProbByMonth
      };
    }

    function summarizeCaptured(cap) {
      let godori = 0, hong = 0, cho = 0, cheong = 0, pi = 0;
      for (const c of cap.animal) if (c.subType === 'godori') godori++;
      for (const c of cap.ribbon) {
        if (c.subType === 'hong') hong++;
        else if (c.subType === 'cho') cho++;
        else if (c.subType === 'cheong') cheong++;
      }
      for (const c of cap.junk) pi += c.piValue;
      return {
        bright: cap.bright.length,
        animal: cap.animal.length,
        ribbon: cap.ribbon.length,
        godori,
        hong,
        cho,
        cheong,
        pi,
        hasGukjin: cap.animal.some(c => c.isGukjin)
      };
    }

    function estimateOpponentScore(oppCap, config) {
      const s = summarizeCaptured(oppCap);
      let pts = 0;
      if (s.bright === 5) pts += 15;
      else if (s.bright === 4) pts += 4;
      else if (s.bright === 3) pts += oppCap.bright.some(c => c.subType === 'bi') ? 2 : 3;
      if (s.godori === 3) pts += 5;
      if (s.animal >= 5) pts += s.animal - 4;
      if (s.hong === 3) pts += 3;
      if (s.cho === 3) pts += 3;
      if (s.cheong === 3) pts += 3;
      if (s.ribbon >= 5) pts += s.ribbon - 4;
      const piEffective = s.hasGukjin && config.gukjinRule !== 'always_animal' ? s.pi + 2 : s.pi;
      if (piEffective >= 10) pts += piEffective - 9;
      return { pts, summary: s, piEffective };
    }

    function cardValueForPlayer(obs, card, profile) {
      if (!card || card.isEmptyBomb) return 0;
      const mySum = summarizeCaptured(obs.myCaptured);
      const pibakThreshold = obs.config.playerCount === 2 ? obs.config.pibakThreshold2P : obs.config.pibakThreshold3P;

      let maxOppBright = 0, maxOppPi = 0, maxOppGodori = 0, maxOppHong = 0, maxOppCho = 0, maxOppCheong = 0;
      let minOppPi = Infinity;
      for (const opp of obs.opponents) {
        const os = summarizeCaptured(opp.captured);
        if (os.bright > maxOppBright) maxOppBright = os.bright;
        if (os.pi > maxOppPi) maxOppPi = os.pi;
        if (os.pi < minOppPi) minOppPi = os.pi;
        if (os.godori > maxOppGodori) maxOppGodori = os.godori;
        if (os.hong > maxOppHong) maxOppHong = os.hong;
        if (os.cho > maxOppCho) maxOppCho = os.cho;
        if (os.cheong > maxOppCheong) maxOppCheong = os.cheong;
      }

      const cw = profile.comboWeight;
      const pf = profile.piFocus;
      const dw = profile.dangerWeight;
      const myEffectivePi = mySum.hasGukjin ? mySum.pi + 2 : mySum.pi;

      if (card.category === 'bright') {
        let v = 13;
        if (mySum.bright >= 2) v += 12 * cw;
        if (mySum.bright === 0 && maxOppBright >= 2) v += 11 * dw; // avoid 광박
        if (maxOppBright >= 2) v += 9 * dw; // deny opponent 3/4/5광
        if (card.subType === 'bi') v -= 1.5;
        return v;
      }

      if (card.isBonus || (card.category === 'junk' && card.piValue >= 2)) {
        let v = 10.5 * pf;
        if (myEffectivePi >= 7 && myEffectivePi <= 11) v += 6 * cw;
        if (myEffectivePi <= pibakThreshold && maxOppPi >= 6) v += 10 * dw; // avoid 피박
        if (myEffectivePi >= 8 && minOppPi <= pibakThreshold) v += 4 * cw;
        return v;
      }

      if (card.isGukjin) {
        let v = 10.5 * Math.max(1, pf * 0.9);
        if (mySum.animal >= 4 || myEffectivePi >= 7) v += 5 * cw;
        if (myEffectivePi <= pibakThreshold && maxOppPi >= 6) v += 8 * dw;
        return v;
      }

      if (card.category === 'animal') {
        let v = 5;
        if (card.subType === 'godori') {
          v += 2;
          if (mySum.godori === 2) v += 18 * cw;
          else if (mySum.godori === 1) v += 5 * cw;
          if (maxOppGodori === 2) v += 14 * dw; // deny 고도리
        }
        if (mySum.animal >= 4) v += 5.5 * cw;
        if (mySum.animal === 6 && obs.config.meongttaEnabled === true) v += 8 * cw;
        return v;
      }

      if (card.category === 'ribbon') {
        let v = 3.8;
        if (card.subType === 'hong') {
          if (mySum.hong === 2) v += 13 * cw;
          else if (mySum.hong === 1) v += 3.5 * cw;
          if (maxOppHong === 2) v += 10 * dw;
        } else if (card.subType === 'cho') {
          if (mySum.cho === 2) v += 13 * cw;
          else if (mySum.cho === 1) v += 3.5 * cw;
          if (maxOppCho === 2) v += 10 * dw;
        } else if (card.subType === 'cheong') {
          if (mySum.cheong === 2) v += 13 * cw;
          else if (mySum.cheong === 1) v += 3.5 * cw;
          if (maxOppCheong === 2) v += 10 * dw;
        }
        if (mySum.ribbon >= 4) v += 4.5 * cw;
        return v;
      }

      // 1-pi junk
      let v = 3.2 * pf;
      if (myEffectivePi >= 9) v += 3.2 * cw;
      if (myEffectivePi <= pibakThreshold && maxOppPi >= 6) v += 7 * dw;
      if (myEffectivePi >= 9 && minOppPi <= pibakThreshold) v += 2.5 * cw;
      return v;
    }

    function calcImmediateCaptureBonus(state, obs, addedCards) {
      const pid = obs.playerId;
      const before = Engine.scoreOf(state, pid);
      const target = obs.config.playerCount === 2 ? obs.config.winScoreTarget2P : obs.config.winScoreTarget3P;
      const p = state.players[pid];
      // Fast lightweight simulated score on cloned captured arrays
      const simCap = {
        bright: p.captured.bright.slice(),
        animal: p.captured.animal.slice(),
        ribbon: p.captured.ribbon.slice(),
        junk: p.captured.junk.slice()
      };
      for (const c of addedCards) {
        if (c.category === 'bright') simCap.bright.push(c);
        else if (c.category === 'animal') simCap.animal.push(c);
        else if (c.category === 'ribbon') simCap.ribbon.push(c);
        else simCap.junk.push(c);
      }
      const fakePlayer = { captured: simCap, goCount: p.goCount, bonusPoints: p.bonusPoints, gukjinAsDoublePi: p.gukjinAsDoublePi };
      const fakeState = { players: [fakePlayer], config: obs.config };
      const after = Engine.scoreOf(fakeState, 0);
      const delta = after.totalScore - before.totalScore;
      let bonus = delta * 7.5;
      if (before.totalScore < target && after.totalScore >= target && (p.goCount === 0 || after.totalScore > p.lastGoScore)) {
        bonus += 32; // Closing out the game immediately!
      }
      return bonus;
    }

    function evaluatePlayMove(state, obs, move, profile) {
      if (move.type === 'PLAY_BONUS') return 1000;

      if (move.type === 'PLAY_PASS') {
        return 0;
      }

      const mySum = summarizeCaptured(obs.myCaptured);
      const oppCount = obs.opponents.length;
      const isLastTurn = obs.myHand.length <= 1;
      const cw = profile.countingWeight;
      const dw = profile.dangerWeight;
      const isHard = profile.difficulty === 'hard';

      if (move.type === 'PLAY_BOMB') {
        const m = move.month;
        const floorCard = obs.floor.find(c => c.month === m);
        const handCards = obs.myHand.filter(c => c.month === m);
        const allCards = handCards.concat(floorCard);
        let gain = cardValueForPlayer(obs, floorCard, profile);
        for (const c of handCards) gain += cardValueForPlayer(obs, c, profile);
        if (isHard) gain += calcImmediateCaptureBonus(state, obs, allCards);
        if (!isLastTurn) {
          gain += 6.5 * oppCount * profile.piFocus;
          if (obs.floor.length === 1) gain += 7;
        }
        gain += 8 * profile.shakeBias;
        return gain;
      }

      // PLAY_CARD
      const card = obs.myHand.find(c => c.id === move.cardId);
      const m = card.month;
      const floorMatches = obs.floor.filter(c => c.month === m);
      const handMonthCount = obs.inMyHandByMonth[m] || 0;
      const unseenList = obs.unseenByMonth[m] || [];
      const unseenCount = unseenList.length;
      const pFlip = obs.deckFlipProbByMonth[m] || 0;
      const pOppHold = obs.oppHoldProbByMonth[m] || 0;

      let score = 0;

      if (floorMatches.length === 3) {
        const allCards = floorMatches.concat(card);
        score = 20 + cardValueForPlayer(obs, card, profile);
        for (const fc of floorMatches) score += cardValueForPlayer(obs, fc, profile);
        if (isHard) score += calcImmediateCaptureBonus(state, obs, allCards);
        if (!isLastTurn) {
          const isJaPpeok = obs.ppeokMonths[m] === obs.playerId;
          const steal = isJaPpeok ? obs.config.jaPpeokSteal : 1;
          score += steal * 6 * oppCount * profile.piFocus;
          if (obs.floor.length === 3) score += 6;
        }
        return score;
      }

      if (floorMatches.length === 2) {
        const v0 = cardValueForPlayer(obs, floorMatches[0], profile);
        const v1 = cardValueForPlayer(obs, floorMatches[1], profile);
        const bestFloorCard = v0 >= v1 ? floorMatches[0] : floorMatches[1];
        const bestFloorVal = Math.max(v0, v1);
        score = 18 + cardValueForPlayer(obs, card, profile) + bestFloorVal;
        if (isHard) score += calcImmediateCaptureBonus(state, obs, [card, bestFloorCard]);
        if (unseenCount === 1 && !isLastTurn) {
          const fourthVal = cardValueForPlayer(obs, unseenList[0], profile);
          score += pFlip * cw * (Math.min(v0, v1) + fourthVal + 5 * oppCount);
        }
        return score;
      }

      if (floorMatches.length === 1) {
        const cardVal = cardValueForPlayer(obs, card, profile);
        const floorVal = cardValueForPlayer(obs, floorMatches[0], profile);
        const immediate = cardVal + floorVal;
        score = 16 + immediate;
        if (isHard) score += calcImmediateCaptureBonus(state, obs, [card, floorMatches[0]]);
        if (unseenCount >= 1 && !isLastTurn) {
          const ppeokPenalty = pFlip * cw * dw * (immediate * 0.45 + 3.5);
          if (handMonthCount >= 2 && unseenCount === 1) {
            score -= ppeokPenalty * 0.2;
            // If holding multiple of same month with ppeok risk, prefer playing lower-value card first
            if (isHard) score -= cardVal * 0.25;
          } else {
            score -= ppeokPenalty;
          }
        }
        if (obs.floor.length === 1 && !isLastTurn) {
          score += (1 - pFlip * cw) * 6;
        }
        return score;
      }

      // floorMatches.length === 0 (discarding onto empty floor: always <= 0 so captures are strictly preferred)
      const myCardVal = cardValueForPlayer(obs, card, profile);
      if (unseenCount === 0) {
        // Dead card: completely safe discard!
        score = -0.5 - myCardVal * 0.1 + (handMonthCount >= 2 ? 0.3 : 0);
      } else {
        let bestUnseenVal = 0;
        for (const uc of unseenList) {
          const uv = cardValueForPlayer(obs, uc, profile);
          if (uv > bestUnseenVal) bestUnseenVal = uv;
        }
        const danger = pOppHold * dw * (myCardVal * 0.95 + bestUnseenVal * 0.6);
        score = -2.0 - danger;

        if (!isLastTurn) {
          score += pFlip * (myCardVal + bestUnseenVal + 4 * oppCount) * 0.35;
        }
        if (handMonthCount === 2 && unseenCount === 1) {
          score += (1 - pOppHold) * 2.0 * cw;
        }
      }

      if (move.shake) {
        if (profile.difficulty === 'easy') {
          score += 2 * profile.shakeBias;
        } else {
          score += 6.5 * profile.shakeBias;
        }
      } else if (handMonthCount === 3 && obs.myShakeMonths.indexOf(m) === -1 && isHard) {
        score -= 2.0 * profile.shakeBias;
      }

      if (mySum.bright === 0 && card.category === 'bright' && unseenCount > 0) {
        score -= 4.5 * dw;
      }

      return score;
    }

    function decideGoOrStop(state, obs, profile, rngState) {
      const pid = obs.playerId;
      const myScore = Engine.scoreOf(state, pid);
      const target = obs.config.playerCount === 2 ? obs.config.winScoreTarget2P : obs.config.winScoreTarget3P;
      const pibakThreshold = obs.config.playerCount === 2 ? obs.config.pibakThreshold2P : obs.config.pibakThreshold3P;

      if (profile.difficulty === 'easy') {
        // Go-addict: calls Go ~72% of the time unless hand is almost empty
        const r = Engine.nextRand(rngState);
        const goThreshold = obs.myHand.length <= 2 ? 0.35 : profile.goBias;
        return { isGo: r.value < goThreshold, rngState: r.rngState };
      }

      // Check opponent state
      let oppHasGo = false;
      let maxOppScore = 0;
      let maxOppThreat = 0;
      let minOppHand = 99;
      for (const opp of obs.opponents) {
        if (opp.goCount >= 1) oppHasGo = true;
        if (opp.handCount < minOppHand) minOppHand = opp.handCount;
        const est = estimateOpponentScore(opp.captured, obs.config);
        if (est.pts > maxOppScore) maxOppScore = est.pts;

        // Threat: how close is opponent to reaching target?
        let threat = est.pts / Math.max(1, target);
        if (est.summary.bright >= 2) threat += 0.25;
        if (est.summary.godori >= 2) threat += 0.25;
        if (est.summary.hong === 2 || est.summary.cho === 2 || est.summary.cheong === 2) threat += 0.2;
        if (est.piEffective >= 8) threat += 0.25;
        if (threat > maxOppThreat) maxOppThreat = threat;
      }

      // If any opponent already declared Go -> stopping triggers 고박! Almost always STOP!
      if (oppHasGo) {
        return { isGo: false, rngState };
      }

      // If almost no turns left, don't risk Go unless guaranteed
      if (obs.myHand.length <= 1) return { isGo: false, rngState };

      // Count guaranteed immediate matches in hand (floor has match for card in hand)
      let sureScoreUpside = 0;
      let matchingHandCards = 0;
      for (const c of obs.myHand) {
        if (c.isBonus) { sureScoreUpside += 1; matchingHandCards++; continue; }
        if (c.isEmptyBomb) continue;
        if ((obs.onFloorByMonth[c.month] || 0) >= 1) {
          matchingHandCards++;
          if (c.category === 'bright') sureScoreUpside += 1.2;
          else if (c.category === 'junk' || c.isGukjin) sureScoreUpside += 0.8;
          else sureScoreUpside += 0.6;
        }
      }

      // Calculate my defensive vulnerability (am I at risk of 피박/광박 if opp stops?)
      const mySum = summarizeCaptured(obs.myCaptured);
      const myPi = mySum.hasGukjin ? mySum.pi + 2 : mySum.pi;
      const myDanger = (myPi <= pibakThreshold ? 0.3 : 0) + (mySum.bright === 0 ? 0.15 : 0);

      if (profile.difficulty === 'normal') {
        // Intermediate: checks basic opponent score & Go status, moderate Go rate without full threat modeling
        const safeToGo =
          maxOppScore < target - 1 &&
          obs.myGoCount < 2 &&
          obs.myHand.length >= 3 &&
          matchingHandCards >= 1;
        const r = Engine.nextRand(rngState);
        if (safeToGo && r.value < (0.52 + profile.goBias)) {
          return { isGo: true, rngState: r.rngState };
        }
        return { isGo: false, rngState: r.rngState };
      }

      // Hard difficulty: EV comparison (prioritize locking wins, Go with clear edge)
      const goMult = obs.myGoCount >= 3 ? Math.pow(2, obs.myGoCount - 2) : 1;
      const shakeMult = Math.pow(2, obs.myShakeMonths.length + obs.myBombMonths.length);
      if (myScore.totalScore * goMult * shakeMult >= 14 && maxOppThreat >= 0.45) {
        return { isGo: false, rngState };
      }
      if (maxOppScore >= target - 2 || maxOppThreat >= 0.65 || minOppHand <= 2) {
        return { isGo: false, rngState };
      }
      if (obs.myHand.length <= 2) {
        return { isGo: false, rngState };
      }

      // Pushing 2고 -> 3고 doubles entire payout (x2)
      const push3GoBonus = obs.myGoCount === 2 ? 0.5 : 0;
      const evScore =
        (matchingHandCards * 0.38) +
        (sureScoreUpside * 0.35) +
        push3GoBonus +
        profile.goBias -
        (maxOppThreat * 1.15) -
        (myDanger * 0.55) -
        (obs.myGoCount * 0.28);

      return { isGo: evScore > 0.48, rngState };
    }

    function chooseMove(state, rngState, options) {
      const pid = state.pendingAction ? state.pendingAction.playerId : state.turn;
      const moves = Engine.legalMoves(state, pid);
      if (moves.length === 0) throw new Error('No legal moves available');

      const opts = options || {};
      const rIn = rngState != null ? rngState : 1;

      // Resolve character/difficulty profile (backward compatible: default = 'normal' or explicit)
      let profile;
      if (opts.characterId) {
        profile = getCharacter(opts.characterId).profile;
      } else if (opts.difficulty) {
        profile = getCharacter(opts.difficulty).profile;
      } else {
        // Default fast random/normal when no options passed (preserves P2 playRandomGame)
        profile = getCharacter('normal').profile;
      }

      // Always play bonus card immediately in PLAY_HAND
      const bonusMove = moves.find(m => m.type === 'PLAY_BONUS');
      if (bonusMove) return { move: bonusMove, rngState: rIn };

      const obs = buildObservation(state, pid);

      if (state.phase === 'CHONGTONG_CHOICE') {
        if (profile.difficulty === 'easy') {
          const r = Engine.nextRand(rIn);
          if (r.value < 0.3) {
            return { move: moves.find(m => m.type === 'DECLINE_CHONGTONG') || moves[0], rngState: r.rngState };
          }
          return { move: moves.find(m => m.type === 'DECLARE_CHONGTONG') || moves[0], rngState: r.rngState };
        }
        return { move: moves.find(m => m.type === 'DECLARE_CHONGTONG') || moves[0], rngState: rIn };
      }

      if (state.phase === 'GO_STOP_DECISION') {
        const dec = decideGoOrStop(state, obs, profile, rIn);
        const targetType = dec.isGo ? 'DECLARE_GO' : 'DECLARE_STOP';
        return { move: moves.find(m => m.type === targetType) || moves[0], rngState: dec.rngState };
      }

      if (state.phase === 'CHOOSE_FLOOR') {
        let bestMove = moves[0];
        let bestScore = -Infinity;
        let rState = rIn;
        for (const mv of moves) {
          const card = obs.pendingAction.options.find(c => c.id === mv.cardId);
          let val = cardValueForPlayer(obs, card, profile);
          if (profile.noise > 0) {
            const nr = Engine.nextRand(rState);
            rState = nr.rngState;
            val += (nr.value - 0.5) * profile.noise;
          }
          if (val > bestScore) {
            bestScore = val;
            bestMove = mv;
          }
        }
        return { move: bestMove, rngState: rState };
      }

      // PLAY_HAND: score every legal move
      let bestMove = moves[0];
      let bestScore = -Infinity;
      let rState = rIn;
      for (const mv of moves) {
        let val = evaluatePlayMove(state, obs, mv, profile);
        if (profile.noise > 0) {
          const nr = Engine.nextRand(rState);
          rState = nr.rngState;
          val += (nr.value - 0.5) * profile.noise;
        }
        if (val > bestScore) {
          bestScore = val;
          bestMove = mv;
        }
      }
      return { move: bestMove, rngState: rState };
    }

    function playAIMatch(config, seed, playerProfiles) {
      let state = Engine.newGame(config, seed);
      let rState = Engine.hashSeed(String(seed) + '_ai');
      let moveCount = 0;
      const maxMoves = 220;
      while (state.phase !== 'GAME_OVER') {
        if (++moveCount > maxMoves) {
          throw new Error('Game exceeded maxMoves (' + maxMoves + ')');
        }
        const pid = state.pendingAction ? state.pendingAction.playerId : state.turn;
        const pOpt = playerProfiles && playerProfiles[pid] ? playerProfiles[pid] : null;
        const choice = chooseMove(state, rState, pOpt);
        rState = choice.rngState;
        const res = Engine.applyMove(state, choice.move);
        state = res.state;
      }
      return { state, moveCount };
    }

    function playRandomGame(config, seed) {
      return playAIMatch(config, seed, null);
    }

    // --- Tournament Benchmark (1,000 games across difficulties) ---
    function runTournament(gamesPerMatchup) {
      const n = gamesPerMatchup || 250; // 4 matchups * 250 = 1,000 games total!
      const t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
      let maxMoveMs = 0;

      function runSeries2P(diffA, diffB, count, seedOffset) {
        let winsA = 0, winsB = 0, nagari = 0, totalCoinsA = 0;
        const pairs = Math.floor(count / 2);
        for (let i = 0; i < pairs; i++) {
          for (let swap = 0; swap < 2; swap++) {
            const dealSeed = seedOffset + i;
            let state = Engine.newGame({ playerCount: 2, recordLog: false }, dealSeed);
            let rState = Engine.hashSeed('t_' + seedOffset + '_' + i + '_' + swap);
            const profiles = swap === 0
              ? [{ difficulty: diffA }, { difficulty: diffB }]
              : [{ difficulty: diffB }, { difficulty: diffA }];
            while (state.phase !== 'GAME_OVER') {
              const pid = state.pendingAction ? state.pendingAction.playerId : state.turn;
              const m0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
              const choice = chooseMove(state, rState, profiles[pid]);
              const m1 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
              if (m1 - m0 > maxMoveMs) maxMoveMs = m1 - m0;
              rState = choice.rngState;
              state = Engine.applyMove(state, choice.move).state;
            }
            const aIdx = swap === 0 ? 0 : 1;
            const bIdx = swap === 0 ? 1 : 0;
            if (state.winner === aIdx) {
              winsA++;
              totalCoinsA += state.settlement.totalWon;
            } else if (state.winner === bIdx) {
              winsB++;
              totalCoinsA -= state.settlement.totalWon;
            } else {
              nagari++;
            }
          }
        }
        const decided = Math.max(1, winsA + winsB);
        return {
          matchup: diffA + ' vs ' + diffB + ' (2P)',
          games: pairs * 2,
          winsA,
          winsB,
          nagari,
          winRateA: Number(((winsA / decided) * 100).toFixed(1)),
          winRateB: Number(((winsB / decided) * 100).toFixed(1)),
          netCoinsA: totalCoinsA
        };
      }

      function runSeries3P(count, seedOffset) {
        const wins = [0, 0, 0]; // [hard, normal, easy]
        let nagari = 0;
        const baseDiffs = ['hard', 'normal', 'easy'];
        for (let i = 0; i < count; i++) {
          const rot = i % 3;
          const seatDiffs = [baseDiffs[rot], baseDiffs[(rot + 1) % 3], baseDiffs[(rot + 2) % 3]];
          const profiles = seatDiffs.map(d => ({ difficulty: d }));
          let state = Engine.newGame({ playerCount: 3, recordLog: false }, seedOffset + i);
          let rState = Engine.hashSeed('t3_' + seedOffset + '_' + i);
          while (state.phase !== 'GAME_OVER') {
            const pid = state.pendingAction ? state.pendingAction.playerId : state.turn;
            const m0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
            const choice = chooseMove(state, rState, profiles[pid]);
            const m1 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
            if (m1 - m0 > maxMoveMs) maxMoveMs = m1 - m0;
            rState = choice.rngState;
            state = Engine.applyMove(state, choice.move).state;
          }
          if (state.winner != null) {
            const winDiff = seatDiffs[state.winner];
            if (winDiff === 'hard') wins[0]++;
            else if (winDiff === 'normal') wins[1]++;
            else wins[2]++;
          } else {
            nagari++;
          }
        }
        const decided = Math.max(1, wins[0] + wins[1] + wins[2]);
        return {
          matchup: 'hard vs normal vs easy (3P)',
          games: count,
          winsHard: wins[0],
          winsNormal: wins[1],
          winsEasy: wins[2],
          nagari,
          winRateHard: Number(((wins[0] / decided) * 100).toFixed(1)),
          winRateNormal: Number(((wins[1] / decided) * 100).toFixed(1)),
          winRateEasy: Number(((wins[2] / decided) * 100).toFixed(1))
        };
      }

      const m1 = runSeries2P('hard', 'easy', n, 100000);
      const m2 = runSeries2P('hard', 'normal', n, 200000);
      const m3 = runSeries2P('normal', 'easy', n, 300000);
      const m4 = runSeries3P(n, 400000);

      const t1 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
      const totalGames = n * 4;
      const totalElapsedMs = Number((t1 - t0).toFixed(1));
      const avgGameMs = Number((totalElapsedMs / totalGames).toFixed(3));

      return {
        totalGames,
        totalElapsedMs,
        avgGameMs,
        maxMoveMs: Number(maxMoveMs.toFixed(3)),
        series2P: [m1, m2, m3],
        series3P: m4
      };
    }

    return {
      CHARACTERS,
      LEGACY_IDS,
      getCharacter,
      getDialogue,
      buildObservation,
      chooseMove,
      playAIMatch,
      playRandomGame,
      runTournament
    };
  })();

    /* ---------------- month motifs ---------------- */
    function m1(card) {
      const bright = card.category === 'bright';
      let s = '';
      if (bright) s += sunDisc(27, 23, 11, true);
      s += '<path d="M7 92 C10 76 16 68 14 54 C13 46 18 40 25 37" stroke="#3a2a1b" stroke-width="4.4" fill="none" stroke-linecap="round"/>' +
        '<path d="M24 38 C32 29 42 27 53 28" stroke="#3a2a1b" stroke-width="3.2" fill="none" stroke-linecap="round"/>' +
        '<path d="M15 56 C21 50 27 49 34 52" stroke="#3a2a1b" stroke-width="2.4" fill="none" stroke-linecap="round"/>' +
        fan(25, 37, 10, -110, 8, 96, '#1f6b3c', 1.5) +
        fan(40, 28, 10, -78, 8, 96, '#1f6b3c', 1.5) +
        fan(53, 28, 9, -40, 8, 92, '#1f6b3c', 1.4) +
        fan(33, 52, 8, -135, 7, 84, '#2b7a45', 1.3) +
        '<path d="M6 92 Q14 86 24 88 Q36 84 46 88" stroke="#1f6b3c" stroke-width="3" fill="none" stroke-linecap="round"/>';
      if (bright) s += crane();

    }

    function m2(card) {
      let s = '<path d="M5 90 C14 74 19 60 32 48 C41 40 50 32 60 27" stroke="#4a3020" stroke-width="3.8" fill="none" stroke-linecap="round"/>' +
        '<path d="M30 50 C26 44 24 38 25 32" stroke="#4a3020" stroke-width="2.4" fill="none" stroke-linecap="round"/>' +
        '<path d="M44 36 C48 32 52 30 58 30" stroke="#4a3020" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
      const pts = [[25, 32, 5.6, -15], [34, 44, 5, 10], [43, 34, 5.8, 25], [52, 29, 5, -10], [48, 45, 4.6, 0], [30, 58, 4.4, 20]];
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        s += blossom(p[0], p[1], p[2], '#f7b3c4', '#c85472', p[3]) + stamens(p[0], p[1], p[2]);
      }
      if (card.category === 'animal') s += warbler(37, 73);
      return s;
    }

    function m3(card) {
      const bright = card.category === 'bright';
      let s = '';
      if (bright) {
        s += '<path d="M4 92 L4 58 Q11 62 18 58 Q25 62 32 58 Q39 62 46 58 Q53 62 60 58 L60 92 Z" fill="#b8202a"/>' +
          '<rect x="4" y="72" width="56" height="5.4" fill="#fdf9ef"/>' +
          '<rect x="4" y="77.4" width="56" height="5" fill="#241c14"/>' +
          '<path d="M4 58 Q11 62 18 58 Q25 62 32 58 Q39 62 46 58 Q53 62 60 58" stroke="#f0c25a" stroke-width="2" fill="none"/>' +
          '<circle cx="12" cy="64" r="2" fill="#f0c25a"/><circle cx="32" cy="64" r="2" fill="#f0c25a"/><circle cx="52" cy="64" r="2" fill="#f0c25a"/>';
        const bl = [[16, 26, 6], [33, 18, 6.6], [48, 27, 5.6], [24, 40, 5.4], [42, 44, 5]];
        for (let i = 0; i < bl.length; i++) {
          s += blossom(bl[i][0], bl[i][1], bl[i][2], '#f6a8bd', '#cf6b8a', i * 25) + stamens(bl[i][0], bl[i][1], bl[i][2]);
        }
        s += '<path d="M4 34 C16 26 30 22 52 20" stroke="#5c3a21" stroke-width="2.4" fill="none"/>';
      } else {
        s += '<path d="M4 44 C18 34 34 26 60 20" stroke="#5c3a21" stroke-width="3" fill="none" stroke-linecap="round"/>' +
          '<path d="M20 37 C22 30 24 26 27 22" stroke="#5c3a21" stroke-width="2" fill="none" stroke-linecap="round"/>';
        const bl = [[14, 42, 6], [26, 32, 6.6], [38, 26, 6], [50, 21, 5.4], [33, 44, 5.6], [46, 38, 5]];
        for (let i = 0; i < bl.length; i++) {
          s += blossom(bl[i][0], bl[i][1], bl[i][2], '#f6a8bd', '#cf6b8a', i * 30) + stamens(bl[i][0], bl[i][1], bl[i][2]);
        }
        s += fan(30, 60, 8, -100, 7, 90, '#2f6b3d', 1.3);
      }
      return s;
    }

    function m4(card) {
      let s = '<path d="M2 22 C14 12 30 10 44 16 C52 20 58 24 62 21" stroke="#2f2a24" stroke-width="3.6" fill="none" stroke-linecap="round"/>';
      const cl = [[10, 24, 15], [21, 23, 20], [33, 23, 13], [45, 20, 17], [56, 22, 10]];
      for (let i = 0; i < cl.length; i++) s += wisteria(cl[i][0], cl[i][1], cl[i][2]);
      if (card.category === 'animal') {
        s += '<path d="M47 12 A6.4 6.4 0 1 0 55.6 20.6 A5 5 0 1 1 47 12 Z" fill="#e9c766"/>' + cuckoo(33, 68);
      } else {
        s += '<path d="M4 78 Q16 70 28 78 Q40 86 56 76" stroke="#2f6b3d" stroke-width="2.6" fill="none"/>';
      }
      return s;
    }

    function m5(card) {
      let s = '<path d="M10 90 C12 66 15 44 12 20" stroke="#2f6b3d" stroke-width="3" fill="none" stroke-linecap="round"/>' +
        '<path d="M20 90 C21 68 22 48 20 24" stroke="#3d7f4c" stroke-width="3" fill="none" stroke-linecap="round"/>' +

    function m6(card) {
      let s = '<ellipse cx="17" cy="78" rx="10" ry="5.4" fill="#2f6b3d" stroke="#1c4530" stroke-width="0.6" transform="rotate(-28 17 78)"/>' +

      if (card.category === 'animal') s += '<g transform="translate(32 30) scale(1.08)">' + butterfly(0, 0) + '</g>';
      return s;
    }

    function m7(card) {
      let s = '<path d="M6 88 C16 62 24 48 34 40 M24 90 C40 66 48 52 58 44" stroke="#8a5a2b" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
      const cl = [[14, 66], [22, 54], [30, 44], [38, 52], [48, 46], [54, 58], [36, 70], [46, 66]];
      for (let i = 0; i < cl.length; i++) s += cloverFlower(cl[i][0], cl[i][1]);
      s += '<ellipse cx="11" cy="80" rx="5.4" ry="3" fill="#2f6b3d" transform="rotate(-32 11 80)"/>' +
        '<ellipse cx="45" cy="78" rx="5.4" ry="3" fill="#2f6b3d" transform="rotate(22 45 78)"/>';
      if (card.category === 'animal') s += boar(30, 76);
      return s;
    }

    function m8(card) {
      const bright = card.category === 'bright';
      const animal = card.category === 'animal';
      let s = '';
      if (bright) {
        s += '<rect x="3" y="3" width="58" height="90" rx="3" fill="#bf2f2c"/>' +
          '<circle cx="32" cy="33" r="17" fill="#f7ecd2" stroke="#e3cf9f" stroke-width="0.8"/>' +
          '<circle cx="26" cy="29" r="3.4" fill="#eadcbb" opacity="0.85"/><circle cx="37" cy="39" r="2.6" fill="#eadcbb" opacity="0.7"/>' +
          '<circle cx="34" cy="26" r="2" fill="#eadcbb" opacity="0.6"/>' + mountain('#2a1c1c', true);
      } else if (animal) {
        s += '<rect x="3" y="3" width="58" height="90" rx="3" fill="#f6e2bd"/>' +
          goose(16, 24, 1) + goose(30, 16, 1.15) + goose(44, 25, 0.95) + goose(54, 36, 0.8) + goose(22, 36, 0.8) +
          mountain('#2a1c1c', false);
      } else {
        s += '<rect x="3" y="3" width="58" height="90" rx="3" fill="#f6ecd6"/>' + mountain('#2a1c1c', false);
      }
      return s;
    }

    function m9(card) {
      const guk = card.isGukjin;
      const cy = guk ? 30 : 56;
      let s = '';
      if (guk) {
        s += '<path d="M32 46 C25 44 22 38 23 34 C29 37 32 41 32 46 Z" fill="#2f6b3d"/>' +
          '<path d="M32 46 C39 44 42 38 41 34 C35 37 32 41 32 46 Z" fill="#3d7f4c"/>';
      } else {
        s += '<path d="M20 88 C22 76 26 70 32 68 C38 70 42 76 44 88" stroke="#2f6b3d" stroke-width="3" fill="none" stroke-linecap="round"/>';
      }
      s += petalsRing(32, cy, 11, 3.3, 7, 12, '#d9a227', '#a5761a', 0) +
        petalsRing(32, cy, 7, 2.7, 5.4, 10, '#eec44f', '#b5891f', 15) +
        '<circle cx="32" cy="' + cy + '" r="3.5" fill="#f8e6a6" stroke="#c79a2e" stroke-width="0.6"/>';
      if (guk) s += cup();
      return s;
    }

    function m10(card) {
      let s = '<path d="M4 30 C14 40 22 50 30 58" stroke="#6b4520" stroke-width="3" fill="none" stroke-linecap="round"/>' +
        '<path d="M30 58 C40 52 50 50 60 52" stroke="#6b4520" stroke-width="2.6" fill="none" stroke-linecap="round"/>' +
        maple(16, 26, 1.15, -20, '#c1272d') + maple(37, 44, 1, 15, '#d2521f') +
        maple(52, 30, 0.85, -30, '#c1272d') + maple(25, 52, 0.7, 40, '#d2521f') +
        maple(57, 60, 0.72, 10, '#b22222');
      if (card.category === 'animal') s += deer(30, 76);
      return s;
    }

    function m11(card) {
      const bright = card.category === 'bright';
      let s = '';
      if (bright) {
        s += '<rect x="3" y="3" width="58" height="90" rx="3" fill="#fbf3dd"/>' +
          paulowniaLeaf(12, 26, 1.1, -25) + paulowniaLeaf(52, 22, 1, 25) +
          '<circle cx="9" cy="14" r="3.4" fill="#7b4da6"/><circle cx="14" cy="9" r="2.6" fill="#8d5bb8"/>' +
          '<circle cx="55" cy="10" r="3.2" fill="#7b4da6"/><circle cx="50" cy="14" r="2.4" fill="#8d5bb8"/>' +
          '<path d="M3 92 Q14 82 26 88 Q38 80 49 88 Q56 84 61 88 L61 92 Z" fill="#2f6b47"/>' +
          phoenix(32, 56);
      } else if (card.subType === 'double') {
        s += paulowniaLeaf(32, 26, 1.2, 0) +
          '<circle cx="18" cy="18" r="3.6" fill="#7b4da6"/><circle cx="46" cy="18" r="3.6" fill="#7b4da6"/><circle cx="32" cy="14" r="3" fill="#8d5bb8"/>';
      } else {
        s += paulowniaLeaf(36, 34, 1.15, 10) +
          '<circle cx="22" cy="22" r="3.4" fill="#7b4da6"/><circle cx="44" cy="18" r="2.8" fill="#8d5bb8"/>';
      }
      return s;
    }

    function m12(card) {
      let s = '';
      for (let i = 0; i < 18; i++) {
        const x = 6 + (i * 13) % 54;
        const y = 6 + (i * 29) % 84;
        s += '<line x1="' + x + '" y1="' + y + '" x2="' + (x - 3.4).toFixed(1) + '" y2="' + (y + 7).toFixed(1) +
          '" stroke="#7a93a8" stroke-width="1" stroke-linecap="round" opacity="0.6"/>';
      }
      if (card.category === 'bright') {
        s += umbrellaman() +
          G(17, 87,
            '<ellipse cx="0" cy="0" rx="4" ry="3" fill="#5f9a48" stroke="#2b4a1e" stroke-width="0.5"/>' +
            '<circle cx="-2.4" cy="-1.6" r="1.1" fill="#f6f2e4"/><circle cx="-2.4" cy="-1.6" r="0.5" fill="#141a10"/>' +
            '<circle cx="1.4" cy="-1.8" r="1.1" fill="#f6f2e4"/><circle cx="1.4" cy="-1.8" r="0.5" fill="#141a10"/>' +
            '<path d="M2.6 2 L6 4.6 M-2.4 2.4 L-5 4.8" stroke="#2b4a1e" stroke-width="0.8" stroke-linecap="round"/>');
      } else if (card.category === 'animal') s += swallow(34, 52);
      else s += '<path d="M6 82 Q18 76 28 84 Q40 90 54 80" stroke="#2f6b3d" stroke-width="2.6" fill="none"/>';
      return s;
    }

    function motif(card) {
      switch (card.month) {
        case 1: return m1(card);
        case 2: return m2(card);
        case 3: return m3(card);
        case 4: return m4(card);
        case 5: return m5(card);
        case 6: return m6(card);
        case 7: return m7(card);
        case 8: return m8(card);
        case 9: return m9(card);
        case 10: return m10(card);
        case 11: return m11(card);
        case 12: return m12(card);
        default: return '';
      }
    }

    /* ---------------- overlays ---------------- */
    function ribbon(card) {
      if (card.category !== 'ribbon') return '';
      let fill = '#4a5570', accent = '#2e3648', label = '띠';
      if (card.subType === 'hong') { fill = '#c1272d'; accent = '#7d141c'; label = '홍'; }
      else if (card.subType === 'cheong') { fill = '#2a5cae'; accent = '#1a3a72'; label = '청'; }
      else if (card.subType === 'cho') { fill = '#6d3f9e'; accent = '#452470'; label = '초'; }
      return '<g transform="rotate(-12 32 52)">' +
        '<rect x="-6" y="38" width="76" height="19.5" fill="' + fill + '" stroke="' + accent + '" stroke-width="0.9"/>' +
        '<rect x="-6" y="40.5" width="76" height="1.8" fill="#ffffff" opacity="0.32"/>' +
        '<rect x="-6" y="53.6" width="76" height="1.5" fill="#000000" opacity="0.2"/>' +
        '<text x="26" y="52" text-anchor="middle" font-size="9.2" font-weight="900" fill="#ffffff" opacity="0.95">' + label + '</text>' +
        bandAccent(card) +
        '</g>';
    }

    function bandAccent(card) {
      switch (card.month) {
        case 1: return fan(50, 50, 6, -100, 6, 80, '#f7f2e4', 1.1);
        case 2: return blossom(50, 47, 5.4, '#f7b3c4', '#c85472', 10) + stamens(50, 47, 4);
        case 3: return blossom(50, 47, 5.6, '#f6a8bd', '#cf6b8a', 20) + stamens(50, 47, 4.2);
        case 4: return wisteria(50, 40, 10);
        case 5: return iris(50, 52);
        case 6: return '<circle cx="50" cy="47" r="4.4" fill="#f6d06a"/><circle cx="50" cy="47" r="2.2" fill="#c8304a"/>';
        case 7: return cloverFlower(50, 47);
        case 9: return '<circle cx="50" cy="47" r="4.6" fill="#f1d05c"/><circle cx="50" cy="47" r="2.2" fill="#b8860b"/>';
        case 10: return maple(50, 46, 0.62, 0, '#f3d08a');
        case 12: return '<path d="M44 44 L52 44 L48 52 Z" fill="#f7f2e4" opacity="0.9"/>';
        default: return '';
      }
    }

    function piMarks(card) {
      if (card.category !== 'junk') return '';
      if (card.subType === 'double' || (card.piValue || 1) >= 2) {
        return piGlyph(21, 32, 1.12, -14) + piGlyph(42, 58, 1.12, 12);
      }
      return piGlyph(45, 68, 1.02, 8);
    }

    function monthTab(month) {
      if (!(month >= 1)) return '';
      const two = month >= 10;
      return '<rect x="4.4" y="4.4" width="14.2" height="10.4" rx="1.6" fill="#fdf9ef" stroke="#b8a37e" stroke-width="0.6"/>' +
        '<text x="11.5" y="12.1" text-anchor="middle" font-size="' + (two ? 7.1 : 8.2) +
        '" font-weight="900" fill="#7d1a15" font-family="Georgia, Times New Roman, serif">' + month + '</text>';
    }

    function badge(card) {
      if (card.category === 'bright') {
        const lbl = card.subType === 'bi' ? '비光' : '光';
        return '<rect x="40" y="4.4" width="19.6" height="11" rx="1.6" fill="#b8202a" stroke="#f0c25a" stroke-width="0.8"/>' +
          '<text x="49.8" y="12.6" text-anchor="middle" font-size="' + (card.subType === 'bi' ? 6.8 : 7.8) +
          '" font-weight="900" fill="#ffe9a8">' + lbl + '</text>';
      }
      if (card.isGukjin) {
        return '<rect x="38.4" y="4.4" width="21.2" height="11" rx="1.6" fill="#1f6b3d" stroke="#f0c25a" stroke-width="0.8"/>' +
          '<text x="49" y="12.6" text-anchor="middle" font-size="7.2" font-weight="900" fill="#ffe9a8">국진</text>';
      }
      if (card.category === 'animal') {
        return '<rect x="46.6" y="4.4" width="13" height="10.4" rx="1.4" fill="#fdf9ef" stroke="#7fa98f" stroke-width="0.5"/>' +
          '<text x="53.1" y="12.1" text-anchor="middle" font-size="7.2" font-weight="900" fill="#2b6b4a">열</text>';
      }
      if (card.category === 'ribbon') {
        return '<rect x="46.6" y="4.4" width="13" height="10.4" rx="1.4" fill="#fdf9ef" stroke="#c08f88" stroke-width="0.5"/>' +
          '<text x="53.1" y="12.1" text-anchor="middle" font-size="7.2" font-weight="900" fill="#8e2c28">띠</text>';
      }
      if ((card.piValue || 0) >= 2) {
        return '<rect x="36.4" y="78.4" width="23.2" height="11.6" rx="1.6" fill="#cf4a32" stroke="#fbf3dd" stroke-width="0.8"/>' +
          '<text x="48" y="87.1" text-anchor="middle" font-size="7.8" font-weight="900" fill="#fff8ec">×' + card.piValue + '</text>';
      }
      return '';
    }

    function getActiveTheme() {
      try {
        return Store.getCosmetics().cardTheme || 'photo';
      } catch (_) {
        return 'classic';
      }
    }

    function getSvg(card, forceTheme) {
      if (!card) return getBackSvg(forceTheme);
      const theme = forceTheme || getActiveTheme();
      const key = theme + ':' + (card.isEmptyBomb ? 'pass' : card.id);
      if (cache[key]) return cache[key];

      const t = THEMES[theme] || THEMES.classic;
      let svg;

      if (card.isEmptyBomb) {
        svg = '<svg viewBox="0 0 64 96" xmlns="http://www.w3.org/2000/svg">' +
          '<rect x="1.5" y="1.5" width="61" height="93" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4 3"/>' +
          '<text x="32" y="46" text-anchor="middle" font-size="11" font-weight="800" fill="#fbbf24">폭탄</text>' +
          '<text x="32" y="60" text-anchor="middle" font-size="10" font-weight="700" fill="#cbd5e1">패스</text>' +
          '</svg>';
      } else if (card.isBonus) {
        svg = '<svg viewBox="0 0 64 96" xmlns="http://www.w3.org/2000/svg">' +
          '<rect x="1" y="1" width="62" height="94" rx="4" fill="' + t.face + '" stroke="' + t.edge + '" stroke-width="1"/>' +
          '<rect x="5" y="5" width="54" height="86" rx="2" fill="none" stroke="#e0b64a" stroke-width="1"/>' +
          '<circle cx="32" cy="40" r="17" fill="#e0b64a"/><circle cx="32" cy="40" r="13" fill="#c99a2e"/>' +
          '<text x="32" y="47" text-anchor="middle" font-size="19" font-weight="900" fill="#fff8ec">★</text>' +
          '<text x="32" y="74" text-anchor="middle" font-size="9" font-weight="900" fill="#7d141c">보너스 패</text>' +
          '<text x="32" y="85" text-anchor="middle" font-size="10.5" font-weight="900" fill="#b8202a">×' + card.piValue + '</text>' +
          '</svg>';
      } else {
        const bright = card.category === 'bright';
        // 실사(원본) 패 모드: 카드 이미지를 전체에 채우고, 그 아래에 벡터 패를 깔아
        // 이미지 로딩 실패 시에도 패가 보이도록 한다.
        const photo = (theme === 'photo');
        const vbH = photo ? 105 : 96;
        const gOpen = photo ? '<g transform="scale(1 1.09375)">' : '<g>';
        // 벡터 그림은 실사 이미지의 대체재(아래 레이어)로 깔고,
        // 월 숫자·광/열/띠/국진 배지는 이미지 위(위 레이어)에 올린다.
        const art = grain(t, card.month) + motif(card) + ribbon(card) + piMarks(card) +
          '<rect x="3" y="3" width="58" height="90" rx="2.4" fill="none" stroke="' + t.edge + '" stroke-width="0.9"/>' +
          '<rect x="1" y="1" width="62" height="94" rx="4" fill="none" stroke="' + (bright ? t.brightFrame : t.frame) +
          '" stroke-width="' + (bright ? 2 : 1.1) + '" stroke-opacity="' + (bright ? 0.9 : 0.38) + '"/>';
        const overlay = monthTab(card.month) + badge(card);
        svg = '<svg viewBox="0 0 64 ' + vbH + '" xmlns="http://www.w3.org/2000/svg">' +
          '<rect x="0" y="0" width="64" height="' + vbH + '" fill="' + t.face + '"/>' +
          gOpen + art + '</g>' +
          (photo
            ? '<image href="./cards/' + card.id + '.svg" x="0" y="0" width="64" height="105" preserveAspectRatio="none"/>'
            : '') +
          gOpen + overlay + '</g>' +
          '</svg>';
      }
      cache[key] = svg;
      return svg;
    }

    function getBackSvg(forceTheme) {
      const theme = forceTheme || getActiveTheme();
      const key = '__back:' + theme;
      if (cache[key]) return cache[key];
      const pal = theme === 'jade'
        ? { bg: '#1f6b58', line: '#bfe6d6', deep: '#0f3f34', seal: '#f0e6c8' }
        : theme === 'royal'
        ? { bg: '#1b1714', line: '#d9b45c', deep: '#0d0b09', seal: '#f3dfa8' }
        : { bg: '#a8241f', line: '#f0d3a2', deep: '#6d1410', seal: '#f7e7c6' };

      let arcs = '';
      for (let row = 0; row < 7; row++) {
        for (let col = 0; col < 6; col++) {
          const x = 2 + col * 12 + (row % 2) * 6;
          const y = 4 + row * 13;
          arcs += '<path d="M' + x + ' ' + (y + 5) + ' a6 6 0 0 1 12 0" fill="none" stroke="' + pal.line +
            '" stroke-width="0.55" stroke-opacity="0.3"/>';
        }
      }

      cache[key] = '<svg viewBox="0 0 64 96" xmlns="http://www.w3.org/2000/svg">' +
        '<rect x="0" y="0" width="64" height="96" rx="4" fill="' + pal.bg + '"/>' +
        arcs +
        '<rect x="3" y="3" width="58" height="90" rx="2.4" fill="none" stroke="' + pal.line + '" stroke-width="1" stroke-opacity="0.75"/>' +
        '<rect x="6.5" y="6.5" width="51" height="83" rx="1.6" fill="none" stroke="' + pal.line + '" stroke-width="0.55" stroke-opacity="0.5"/>' +
        '<circle cx="32" cy="48" r="12" fill="' + pal.bg + '" stroke="' + pal.seal + '" stroke-width="1.1"/>' +
        '<circle cx="32" cy="48" r="7.5" fill="none" stroke="' + pal.seal + '" stroke-width="0.7" stroke-opacity="0.8"/>' +
        '<path d="M32 40 L39 48 L32 56 L25 48 Z" fill="' + pal.seal + '" fill-opacity="0.85"/>' +
        '</svg>';
      return cache[key];
    }

    return { getSvg, getBackSvg };
  })();

  const FX = (() => {
    let audioCtx = null;
    let bgmTimer = null;
    let bgmStep = 0;

    function ensureAudio() {
      const Ctx = typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext);
      if (!Ctx) return null;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      return audioCtx;
    }

    function vibrate(pattern) {
      try {
        if (!Store.getSettings().vibrateEnabled) return;
        if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') {
          navigator.vibrate(pattern);
        }
      } catch (_) {}
    }

    function playSfx(kind) {
      try {
        if (!Store.getSettings().soundEnabled) return;
        const ctx = ensureAudio();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (kind === 'snap') {
          // Crisp hwatu "탁!" impact: filtered noise burst + short wood thud
          const bufLen = Math.floor(ctx.sampleRate * 0.045);
          const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < bufLen; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufLen * 0.25));
          }
          const src = ctx.createBufferSource();
          src.buffer = buf;
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1400, now);
          const nGain = ctx.createGain();
          nGain.gain.setValueAtTime(0.28, now);
          nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
          src.connect(filter); filter.connect(nGain); nGain.connect(ctx.destination);
          src.start(now);

          const osc = ctx.createOscillator();
          const oGain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(210, now);
          osc.frequency.exponentialRampToValueAtTime(62, now + 0.055);
          oGain.gain.setValueAtTime(0.22, now);
          oGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.connect(oGain); oGain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.06);
          return;
        }

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (kind === 'flip') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(340, now);
          osc.frequency.exponentialRampToValueAtTime(520, now + 0.05);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.start(now); osc.stop(now + 0.06);
        } else if (kind === 'special' || kind === 'cutin') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(587, now + 0.06);
          osc.frequency.setValueAtTime(880, now + 0.12);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now); osc.stop(now + 0.25);
        } else if (kind === 'win') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523, now);
          osc.frequency.setValueAtTime(659, now + 0.09);
          osc.frequency.setValueAtTime(784, now + 0.18);
          osc.frequency.setValueAtTime(1046, now + 0.27);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.start(now); osc.stop(now + 0.45);
        } else if (kind === 'lose') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(330, now);
          osc.frequency.exponentialRampToValueAtTime(180, now + 0.28);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now); osc.stop(now + 0.3);
        }
      } catch (_) {}
    }

    function syncBgm() {
      const enabled = Store.getSettings().bgmEnabled;
      if (!enabled) {
        if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
        return;
      }
      if (bgmTimer) return;
      const scale = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 440.0, 392.0];
      bgmTimer = setInterval(() => {
        try {
          if (!Store.getSettings().bgmEnabled) return;
          const ctx = ensureAudio();
          if (!ctx || ctx.state !== 'running') return;
          const now = ctx.currentTime;
          const freq = scale[bgmStep % scale.length];
          bgmStep++;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.032, now + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.52);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.55);
        } catch (_) {}
      }, 620);
    }

    function showImpact(x, y) {
      const layer = document.getElementById('fxLayer');
      if (!layer) return;
      const ring = document.createElement('div');
      ring.className = 'fx-impact';
      ring.style.left = x + 'px';
      ring.style.top = y + 'px';
      layer.appendChild(ring);
      setTimeout(() => { if (ring.parentNode) ring.parentNode.removeChild(ring); }, 300);
    }

    function triggerTableShake(withFlash) {
      const shell = document.getElementById('appShell');
      if (shell) {
        shell.classList.remove('fx-shake');
        void shell.offsetWidth;
        shell.classList.add('fx-shake');
        setTimeout(() => shell.classList.remove('fx-shake'), 350);
      }
      if (withFlash) {
        const layer = document.getElementById('fxLayer');
        if (layer) {
          const fl = document.createElement('div');
          fl.className = 'fx-flash';
          layer.appendChild(fl);
          setTimeout(() => { if (fl.parentNode) fl.parentNode.removeChild(fl); }, 360);
        }
      }
    }

    function showBanner(text, subText, isBigCutin) {
      const layer = document.getElementById('fxLayer');
      if (!layer) return;
      const el = document.createElement('div');
      el.className = 'fx-banner' + (isBigCutin ? ' cutin' : '');
      el.innerHTML = text + (subText ? '<span class="sub">' + subText + '</span>' : '');
      layer.appendChild(el);
      if (isBigCutin) {
        triggerTableShake(true);
        vibrate([25, 30, 45]);
      }
      setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, isBigCutin ? 1280 : 980);
    }

    function flyCard(card, fromRect, toRect, durationMs, opts) {
      return new Promise((resolve) => {
        const layer = document.getElementById('fxLayer');
        if (!layer || !fromRect || !toRect) { resolve(); return; }
        const o = opts || {};
        const el = document.createElement('div');
        el.className = 'hw-card fx-flying';
        el.style.left = fromRect.left + 'px';
        el.style.top = fromRect.top + 'px';
        el.style.width = Math.max(28, fromRect.width) + 'px';
        el.style.height = Math.max(42, fromRect.height) + 'px';
        el.innerHTML = o.flipFromBack ? CardArt.getBackSvg() : CardArt.getSvg(card);
        layer.appendChild(el);

        const dx = (toRect.left + toRect.width / 2) - (fromRect.left + fromRect.width / 2);
        const dy = (toRect.top + toRect.height / 2) - (fromRect.top + fromRect.height / 2);
        const dur = durationMs || 260;
        const tilt = o.tiltDeg != null ? o.tiltDeg : (dx > 0 ? 6 : -6);

        el.style.transition = 'transform ' + dur + 'ms cubic-bezier(0.18, 0.84, 0.26, 1)';
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            if (o.flipFromBack) {
              el.style.transform = 'translate3d(' + (dx * 0.45) + 'px, ' + (dy * 0.45) + 'px, 0) rotateY(90deg) scale(1.12)';
              setTimeout(() => {
                el.innerHTML = CardArt.getSvg(card);
                el.style.transform = 'translate3d(' + dx + 'px, ' + dy + 'px, 0) rotateY(0deg) rotateZ(' + tilt + 'deg) scale(1.03)';
              }, Math.round(dur * 0.45));
            } else {
              el.style.transform = 'translate3d(' + dx + 'px, ' + dy + 'px, 0) rotateZ(' + tilt + 'deg) scale(1.06)';
            }
          });
        });

        setTimeout(() => {
          if (o.impact) {
            showImpact(toRect.left + toRect.width / 2, toRect.top + toRect.height / 2);
            vibrate(18);
          }
          if (el.parentNode) el.parentNode.removeChild(el);
          resolve();
        }, dur + 22);
      });
    }

    function animateMultCounter(el, targetMult) {
      if (!el || targetMult <= 1) return;
      const steps = [];
      let cur = 1;
      while (cur < targetMult) {
        steps.push(cur);
        cur *= 2;
      }
      steps.push(targetMult);
      let idx = 0;
      el.textContent = '×1';
      const iv = setInterval(() => {
        idx++;
        if (idx >= steps.length) {
          clearInterval(iv);
          return;
        }
        el.textContent = '×' + steps[idx];
        playSfx('flip');
      }, 170);
    }

    function describeEvents(events) {
      return (events || []).map(e => e.type).join(', ');
    }
    return {
      playSfx,
      vibrate,
      syncBgm,
      showImpact,
      triggerTableShake,
      showBanner,
      flyCard,
      animateMultCounter,
      describeEvents
    };
  })();

  /* =========================================================================
   * 5. Tests (runEngineTests) - >= 40 deterministic + 1,000 sim tests
   * ========================================================================= */
  function runEngineTests() {
    const results = [];
    function assert(cond, msg) {
      if (!cond) throw new Error(msg || 'Assertion failed');
    }
    function assertEq(actual, expected, label) {
      if (actual !== expected) {
        throw new Error((label ? label + ': ' : '') + 'expected ' + expected + ', got ' + actual);
      }
    }
    function test(id, name, fn) {
      try {
        fn();
        results.push({ id, name, pass: true, error: null });
      } catch (err) {
        results.push({ id, name, pass: false, error: err && err.message ? err.message : String(err) });
      }
    }

    // --- A. 카드 구성 / 딜 / 선 정하기 / 순수성 ---
    test('T01', '48장 기본 카드 구성 무결성', () => {
      assertEq(Engine.CARDS_48.length, 48, '총 카드 수');
      const byMonth = Object.create(null);
      let bright = 0, animal = 0, ribbon = 0, junk = 0;
      for (const c of Engine.CARDS_48) {
        byMonth[c.month] = (byMonth[c.month] || 0) + 1;
        if (c.category === 'bright') bright++;
        else if (c.category === 'animal') animal++;
        else if (c.category === 'ribbon') ribbon++;
        else if (c.category === 'junk') junk++;
      }
      for (let m = 1; m <= 12; m++) assertEq(byMonth[m], 4, m + '월 장수');
      assertEq(bright, 5, '광');
      assertEq(animal, 9, '열끗');
      assertEq(ribbon, 10, '띠');
      assertEq(junk, 24, '피');
    });

    test('T02', '2인 맞고 초기 딜 및 보너스패 2장(쌍피) 확정', () => {
      const s = Engine.newGame({ playerCount: 2 }, 101);
      assertEq(s.config.bonusCardCount, 2, '맞고 보너스패 수');
      assertEq(s.players[0].hand.length, 10, 'P1 손패');
      assertEq(s.players[1].hand.length, 10, 'P2 손패');
      assertEq(Engine.countPhysicalCards(s), 50, '총 50장 보존');
      assertEq(Engine.BONUS_POOL['bonus-1'].piValue, 2, '보너스1 쌍피');
      assertEq(Engine.BONUS_POOL['bonus-2'].piValue, 2, '보너스2 쌍피');
    });

    test('T03', '3인 고스톱 초기 딜 — 더미 21장 및 보너스패 0장 확정', () => {
      const s = Engine.newGame({ playerCount: 3 }, 202);
      assertEq(s.config.bonusCardCount, 0, '고스톱 보너스패 수');
      assertEq(s.players[0].hand.length, 7, 'P1 손패');
      assertEq(s.players[1].hand.length, 7, 'P2 손패');
      assertEq(s.players[2].hand.length, 7, 'P3 손패');
      assertEq(s.floor.length, 6, '바닥패');
      assertEq(s.deck.length, 21, '3인 더미 21장');
      assertEq(Engine.countPhysicalCards(s), 48, '총 48장 보존');
    });

    test('T04', '시드 기반 결정론 검증', () => {
      const a = AI.playRandomGame({ playerCount: 2 }, 7777);
      const b = AI.playRandomGame({ playerCount: 2 }, 7777);
      assertEq(a.state.winner, b.state.winner, '승자 동일');
      assertEq(a.state.winReason, b.state.winReason, '승리 사유 동일');
      assertEq(a.state.log.join('|'), b.state.log.join('|'), '로그 100% 동일');
    });

    test('T05', '밤일낮장 높은 월 우선 선 정하기 검증', () => {
      const seen = new Set();
      for (let seed = 1; seed <= 30; seed++) {
        const s = Engine.newGame({ playerCount: 2, firstTurnMethod: 'highest_month' }, seed);
        seen.add(s.firstPlayer);
      }

      const t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
      for (let i = 1; i <= 500; i++) {
        const g2 = AI.playRandomGame({ playerCount: 2, recordLog: false }, 10000 + i);
        assertEq(g2.state.phase, 'GAME_OVER', '2인 판 종료 #' + i);

      const t1 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
      const elapsedMs = Math.round(t1 - t0);
      assert(elapsedMs < 2000, '1,000판 실행 시간 2000ms 미만 초과: ' + elapsedMs + 'ms');
      // Attach timing info to last test name cleanly via log
      results._simElapsedMs = elapsedMs;
    });

    const passed = results.filter(r => r.pass).length;
    const failed = results.length - passed;
    return {
      total: results.length,
      passed,
      failed,
      simElapsedMs: results._simElapsedMs || 0,
      results
    };
  }

  /* =========================================================================
   * 5b. AI Tests (runAITests) — Separate from Engine 48 tests
   * ========================================================================= */
  function runAITests() {
    const results = [];
    function assert(cond, msg) {
      if (!cond) throw new Error(msg || 'Assertion failed');
    }
    function assertEq(actual, expected, label) {
      if (actual !== expected) {
        throw new Error((label ? label + ': ' : '') + 'expected ' + expected + ', got ' + actual);
      }
    }
    function test(id, name, fn) {
      try {
        fn();
        results.push({ id, name, pass: true, error: null });
      } catch (err) {
        results.push({ id, name, pass: false, error: err && err.message ? err.message : String(err) });
      }
    }

    test('AI01', '부정행위 방지(Anti-Cheat): 상대 손패·더미 순서 변경 시에도 동일 수 선택', () => {
      const s1 = Engine.createCustomState({
        config: { playerCount: 2 },
        players: [
          { hand: ['01-junk-1', '05-animal', '08-bright', '10-junk-1'] },
          { hand: ['02-animal', '03-bright', '04-ribbon', '06-junk-1'] }
        ],
        floor: ['01-ribbon', '07-animal'],
        deck: ['09-animal', '11-bright', '12-double']
      });
      const s2 = Engine.createCustomState({
        config: { playerCount: 2 },
        players: [
          { hand: ['01-junk-1', '05-animal', '08-bright', '10-junk-1'] },
          { hand: ['11-double', '12-bright', '03-ribbon', '07-junk-1'] } // 상대 손패 완전 교체(장수 동일)
        ],
        floor: ['01-ribbon', '07-animal'],
        deck: ['02-junk-1', '04-animal', '06-ribbon'] // 더미 순서/내용 완전 교체(장수 동일)
      });
      const m1 = AI.chooseMove(s1, 123, { difficulty: 'hard' }).move;
      const m2 = AI.chooseMove(s2, 123, { difficulty: 'hard' }).move;
      assertEq(m1.type, m2.type, '이동 타입 동일');
      assertEq(m1.cardId, m2.cardId, '선택 카드 동일');
    });

    test('AI02', '오리지널 캐릭터 5명 & 8개 상황별 대사(각 3개 이상) 완결성 검증', () => {

        assert(ch.id && ch.name && ch.style && ch.difficulty, '캐릭터 메타데이터');
        diffs.add(ch.difficulty);
        for (const sit of situations) {
          const arr = ch.lines[sit];
          assert(Array.isArray(arr) && arr.length >= 3, ch.name + ' ' + sit + ' 대사 3개 이상');
          for (const line of arr) {
            assert(typeof line === 'string' && line.trim().length > 0, '빈 대사 없음');
          }
        }
        const dlg = AI.getDialogue(ch.id, 'start', 7);
        assert(dlg.text.length > 0, '대사 헬퍼 정상');

    test('AI05', '피박/광박 회피: 피박 위기 시 쌍피 우선 확보', () => {

    test('AI06', '카드 카운팅 & 위험 회피: 죽은 패(미확인 0장) vs 위험한 광 버리기', () => {

    test('AI07', '고/스톱 판단: 상대 1고(고박 기회) 시 어려움 AI 즉시 스톱', () => {

    test('AI08', '폭탄 / 3장 뻑 먹기 최우선 선택 검증', () => {
      const s = Engine.createCustomState({

    test('AI09', 'AI 한 수 계산 속도 검증 (< 50ms)', () => {
      const s = Engine.newGame({ playerCount: 2 }, 4242);
      let maxMs = 0;
      let cur = s;
      let r = 99;
      for (let i = 0; i < 40 && cur.phase !== 'GAME_OVER'; i++) {
        const t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
        const c = AI.chooseMove(cur, r, { difficulty: 'hard' });
        const t1 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
        if (t1 - t0 > maxMs) maxMs = t1 - t0;
        r = c.rngState;
        cur = Engine.applyMove(cur, c.move).state;
      }
      assert(maxMs < 50, '최대 한 수 계산 시간 50ms 미만 (측정: ' + maxMs.toFixed(3) + 'ms)');
    });

    test('AI10', 'AI 1,000판 토너먼트: 어려움이 보통/쉬움을 확실히 이김 & 50ms 이내', () => {

    });

    const passed = results.filter(r => r.pass).length;
    const failed = results.length - passed;
    return {

      results
    };

  /* =========================================================================
   * 5c. Meta/Store Tests (runStoreTests) — Schema v2, Migration, Missions, 24 Achievements
   * ========================================================================= */
  function runStoreTests() {
    const results = [];
    function assert(cond, msg) { if (!cond) throw new Error(msg || 'Assertion failed'); }
    function assertEq(a, b, lbl) { if (a !== b) throw new Error((lbl ? lbl + ': ' : '') + 'expected ' + b + ', got ' + a); }
    function test(id, name, fn) {
      try { fn(); results.push({ id, name, pass: true, error: null }); }
      catch (e) { results.push({ id, name, pass: false, error: e && e.message ? e.message : String(e) }); }
    }

    test('ST01', '업적 20개 이상(24개) 및 커리어 5단계/테마 4종 정의 확인', () => {
      assert(Store.ACHIEVEMENTS.length >= 20, '업적 20개 이상');
      assertEq(Store.CAREER_STAGES.length, 5, '커리어 5단계');
      assertEq(Store.CARD_THEMES.length, 4, '화투 테마 4종');
      assertEq(Store.TABLE_THEMES.length, 3, '바닥 테마 3종');
    });

    test('ST02', '일일 미션 3개 생성 및 자정 날짜 변경 시 갱신 확인', () => {
      const d1 = new Date(2026, 10, 20);
      const d2 = new Date(2026, 10, 21);
      const m1 = Store.getDailyMissions(d1);
      assertEq(m1.tasks.length, 3, '일일 미션 3개');
      if (typeof localStorage !== 'undefined') {
        const m2 = Store.getDailyMissions(d2);
        assert(m2.date !== m1.date, '다음 날 미션 갱신');
      }
    });

    test('ST03', '스키마 버전 및 마이그레이션 함수 검증', () => {
      const ver = Store.migrate();
      assertEq(ver, Store.SCHEMA_VERSION, '스키마 버전 3');
      const st = Store.getStats();
      assert(st.combos && typeof st.combos.godori === 'number', '족보 통계 필드 존재');
    });

    test('ST04', 'RULES.md 규칙 옵션 5가지 조합 저장·반영 및 복원 검증', () => {
      const prevRules = Store.getRuleOptions();
      const combos = [
        { bonusCardCount: '0', winScoreTarget2P: 5, firstTurnMethod: 'p0_fixed', pibakThreshold2P: 6, allowDebt: true },
        { bonusCardCount: '2', bonusCardType: 'double_and_triple', gukjinRule: 'always_animal', firstPpeokBonus: true, twoPpeokBonus: true },
        { winScoreTarget3P: 5, pibakThreshold3P: 4, multiGoGobakRule: 'cancel_solo', loserShakeApplies: true },
        { nagariMultiplier: true, nagariMaxStack: 2, meongttaEnabled: 'zero_opponent', chongtongWin: false },
        { firstTurnMethod: 'lowest_month', alwaysChooseTwoCards: true, jaPpeokSteal: 1, goScoreAdd: false }
      ];
      try {
        for (let i = 0; i < combos.length; i++) {
          Store.saveRuleOptions(Object.assign({}, Store.DEFAULT_RULE_OPTIONS, combos[i]));
          const pCount = i === 2 ? 3 : 2;
          const cfg = Store.buildEngineRuleConfig(pCount);
          const gs = Engine.newGame(Object.assign({}, cfg, { playerCount: pCount, recordLog: false }), 700 + i);
          assert(gs.players.length === pCount, '옵션 조합 ' + (i + 1) + ' 인원 수 일치');
          if (i === 0) assertEq(gs.firstPlayer, 0, 'p0_fixed 선 적용');
          if (i === 0) assertEq(gs.config.bonusCardCount, 0, '보너스 0장 적용');
        }
      } finally {
        Store.saveRuleOptions(prevRules);
      }
    });

    test('ST05', '연속 50판(2인/3인 혼합) 속도·메모리·패 보존 및 3인 정산 무결성', () => {
      const t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
      let settled3P = 0;
      for (let i = 0; i < 50; i++) {
        const is3P = (i % 2 === 1);
        const res = AI.playAIMatch(
          { playerCount: is3P ? 3 : 2, recordLog: false },
          9000 + i,
          is3P
            ? [{ characterId: 'agwi' }, { characterId: 'jjakkwi' }, { characterId: 'gwangryeol' }]
            : [{ characterId: 'agwi' }, { characterId: 'jungmadam' }]
        );
        const st = res.state;
        assert(st.phase === 'GAME_OVER', '판 ' + i + ' 종료');
        assert(st.settlement != null, '판 ' + i + ' 정산 존재');
        const expectedCards = is3P ? 48 : 50;
        assertEq(Engine.countPhysicalCards(st), expectedCards, '판 ' + i + ' 총 장수 보존');
        if (is3P && !st.settlement.isNagari) {
          settled3P++;
          assertEq(st.settlement.payments.length, 2, '3인 승리 시 패자 2명 정산');
        }
      }
      const elapsed = ((typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now()) - t0;
      assert(elapsed < 4000, '연속 50판 완료 시간 < 4초 (측정: ' + elapsed.toFixed(1) + 'ms)');
      assert(settled3P >= 5, '3인 정산 표본 확보 (' + settled3P + '판)');
    });

    test('ST06', '전통 화투 SVG 52종 무결성 및 팝업 분기(총통·바닥선택·고스톱) 검증', () => {

      for (const c of allCards) {

      assertEq(Engine.legalMoves(sChong).length, 2, '총통 팝업 2가지 선택');
      // 2) CHOOSE_FLOOR

      assertEq(rFloor.state.phase, 'CHOOSE_FLOOR', '바닥 2장 가치 차등 시 CHOOSE_FLOOR 팝업 진입');
      // 3) GO_STOP_DECISION (5광=15점, 손패 남음)
      const sGo = Engine.createCustomState({
        config: { playerCount: 2 },
        players: [
          { hand: ['02-junk-1', '06-junk-1'], captured: { bright: ['01-bright', '03-bright', '08-bright', '11-bright', '12-bright'] } },
          { hand: ['04-junk-1', '07-junk-1'] }
        ],
        floor: ['02-junk-2'],
        deck: ['05-junk-1', '07-junk-2']
      });
      const rGo = Engine.applyMove(sGo, { type: 'PLAY_CARD', playerId: 0, cardId: '02-junk-1' });
      assertEq(rGo.state.phase, 'GO_STOP_DECISION', '목표 점수 달성 시 GO_STOP_DECISION 팝업 진입');
    });

    test('ST07', '실사 테마에서 월 숫자·광/열/띠/국진 배지가 패 이미지 위에 그려짐', () => {

    test('ST08', '전통 벡터 테마는 이미지 없이 월 숫자·배지를 그대로 포함', () => {

    test('ST09', '국진이 열끗/쌍피 중 어느 쪽으로 계산됐는지 UI용으로 판별', () => {

    const passed = results.filter(r => r.pass).length;
