  /* =========================================================================
   * 6. UI (Lobby + Career + Mobile Portrait Table + Modals + ?test=1 View)
   * ========================================================================= */
  const UI = (() => {
    let lobbyMode = 2;
    let lobbyStageId = 0;
    let lobbyOppId = 'gwangryeol';
    let lobbyOppId2 = 'jungmadam';

    let match = null;
    let selectedCardId = null;
    let isBusy = false;
    let aiTimer = null;
    let lastGlobalSpeechAt = 0;
    const speechTimers = Object.create(null);

    function animDur() {
      return Store.getSettings().fastAnim ? 120 : 280;
    }
    function aiThinkDelay() {
      return Store.getSettings().fastAnim ? 300 : 650;
    }

    function applyCosmeticsToShell() {
      const shell = document.getElementById('appShell');
      if (shell) shell.dataset.table = Store.getCosmetics().tableTheme || 'felt_green';
    }

    // --- Modal Helpers ---
    function showModal(html) {
      const ov = document.getElementById('modalOverlay');
      const box = document.getElementById('modalBox');
      box.innerHTML = html;
      ov.classList.remove('hidden');
      return box;
    }
    function closeModal() {
      const ov = document.getElementById('modalOverlay');
      ov.classList.add('hidden');
      document.getElementById('modalBox').innerHTML = '';
    }

    // --- Speech Bubble (1.75s display, >= 3000ms cooldown) ---
    function triggerSpeech(playerId, situation) {
      if (!match || playerId === 0) return;
      const now = Date.now();
      if (now - lastGlobalSpeechAt < 3000) return;

      const oppIdx = playerId - 1;
      const charId = match.oppCharIds[oppIdx];
      if (!charId) return;

      const cardEl = document.getElementById('oppCard_' + playerId);
      if (!cardEl) return;

      lastGlobalSpeechAt = now;
      const dlg = AI.getDialogue(charId, situation, now + playerId);
      const old = cardEl.querySelector('.speech-bubble');
      if (old) old.remove();

      const bubble = document.createElement('div');
      bubble.className = 'speech-bubble';
      bubble.textContent = dlg.text;
      cardEl.appendChild(bubble);

      if (speechTimers[playerId]) clearTimeout(speechTimers[playerId]);
      speechTimers[playerId] = setTimeout(() => {
        if (bubble.parentNode) bubble.parentNode.removeChild(bubble);
      }, 1750);
    }

    // --- Match Persistence ("gostop.activeMatch") ---
    function saveActiveMatch() {
      if (!match) return;
      Store.set('activeMatch', match);
    }
    function clearActiveMatch() {
      match = null;
      Store.remove('activeMatch');
    }

    // --- Lobby Rendering ---
    function renderLobby() {
      applyCosmeticsToShell();
      document.getElementById('lobbyView').classList.remove('hidden');
      document.getElementById('gameView').classList.add('hidden');
      document.getElementById('testView').classList.add('hidden');
      closeModal();

      const wallet = Store.getWallet();
      Store.updateCareerUnlocks(wallet);
      const career = Store.getCareer();
      lobbyStageId = Math.min(career.selectedStage || 0, career.unlockedStage);

      document.getElementById('lobbyCoins').textContent = wallet.toLocaleString() + '원';

      // Attendance & Bankruptcy Relief
      const attBtn = document.getElementById('attendanceBtn');
      const canAtt = Store.canClaimAttendance();
      const attInfo = Store.get('attendance', { streak: 0 });
      attBtn.disabled = !canAtt;
      attBtn.textContent = canAtt ? ('출석 보상 (' + (attInfo.streak + 1) + '일차)') : ('출석 완료 (' + attInfo.streak + '연속)');

      const relBtn = document.getElementById('reliefBtn');
      const canRel = Store.canClaimRelief();
      relBtn.disabled = !canRel;
      relBtn.textContent = canRel ? '파산 구제 (+3만원)' : (wallet < 5000 ? '오늘 구제 완료' : '파산 구제 (5천↓)');

      // Continue Button
      const saved = Store.get('activeMatch', null);
      const contBtn = document.getElementById('continueBtn');
      if (saved && saved.gameState && saved.gameState.players) {
        contBtn.disabled = false;
        const pCount = saved.gameState.config.playerCount;
        const rNum = saved.roundNumber || 1;
        contBtn.textContent = '이어하기 (' + (pCount === 2 ? '2인 맞고' : '3인 고스톱') + ' · ' + rNum + '판)';
      } else {
        contBtn.disabled = true;
        contBtn.textContent = '이어하기 (진행 중인 판 없음)';
      }

      // Mode
      for (const b of document.querySelectorAll('#modeSeg .seg-btn')) {
        b.classList.toggle('active', Number(b.dataset.mode) === lobbyMode);
      }

      // Career Stages
      const careerList = document.getElementById('careerList');
      careerList.innerHTML = '';
      for (const stg of Store.CAREER_STAGES) {
        const unlocked = stg.id <= career.unlockedStage;
        const canEnter = unlocked && wallet >= stg.minCoins;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'char-opt' + (stg.id === lobbyStageId ? ' active' : '');
        btn.disabled = !canEnter;
        const stageChars = stg.chars.map(id => AI.getCharacter(id).name).join(' · ');
        btn.innerHTML =
          '<div class="char-av">' + (unlocked ? (stg.id + 1) + '단' : '🔒') + '</div>' +
          '<div class="char-info">' +
            '<div class="char-name">' + stg.name + ' <span class="diff-tag diff-' + (stg.id >= 3 ? 'hard' : (stg.id >= 1 ? 'normal' : 'easy')) + '">점당 ' + stg.stake.toLocaleString() + '원</span></div>' +
            '<div class="char-meta">' + stg.desc + ' · 등장: ' + stageChars + '</div>' +
          '</div>';
        btn.onclick = () => {
          lobbyStageId = stg.id;
          Store.selectCareerStage(stg.id);
          if (!stg.chars.includes(lobbyOppId)) {
            lobbyOppId = stg.chars[0];
            Store.set('lobbyOppId', lobbyOppId);
          }
          if (lobbyOppId2 === lobbyOppId) {
            lobbyOppId2 = (AI.CHARACTERS.find(c => c.id !== lobbyOppId) || AI.CHARACTERS[0]).id;
            Store.set('lobbyOppId2', lobbyOppId2);
          }
          renderLobby();
        };
        careerList.appendChild(btn);
      }

      // Characters — 3인에서는 상대 2명을 각각 직접 선택한다.
      const activeStage = Store.CAREER_STAGES[lobbyStageId] || Store.CAREER_STAGES[0];
      const charList = document.getElementById('charList');
      charList.innerHTML = '';
      const oppSlots = lobbyMode === 3 ? [1, 2] : [1];
      for (const slot of oppSlots) {
        if (lobbyMode === 3) {
          const title = document.createElement('div');
          title.className = 'opp-slot-title';
          const curCh = AI.getCharacter(slot === 1 ? lobbyOppId : lobbyOppId2);
          title.innerHTML = '상대 ' + slot + ' <span class="slot-chip">' + curCh.name + '</span>';
          charList.appendChild(title);
        }
        const currentId = slot === 1 ? lobbyOppId : lobbyOppId2;
        for (const ch of AI.CHARACTERS) {
          const isStageMember = activeStage.chars.includes(ch.id);
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'char-opt' + (ch.id === currentId ? ' active' : '');
          btn.dataset.oppSlot = String(slot);
          btn.dataset.charId = ch.id;
          const diffLabel = ch.difficulty === 'easy' ? '쉬움' : (ch.difficulty === 'normal' ? '보통' : '어려움');
          btn.innerHTML =
            '<div class="char-av">' + ch.avatar + '</div>' +
            '<div class="char-info">' +
              '<div class="char-name"><span class="char-name-txt">' + ch.name + '</span> <span class="diff-tag diff-' + ch.difficulty + '">' + diffLabel + '</span>' + (isStageMember ? ' <span style="font-size:10px;color:var(--ok);">★무대</span>' : '') + '</div>' +
              '<div class="char-meta">' + ch.title + ' · ' + ch.style + '</div>' +
            '</div>';
          btn.addEventListener('click', () => {
            if (slot === 1) {
              const prev = lobbyOppId;
              lobbyOppId = ch.id;
              // 3인에서 같은 캐릭터가 양쪽에 겹치면 서로 자리를 바꾼다.
              if (lobbyMode === 3 && lobbyOppId2 === lobbyOppId) {
                lobbyOppId2 = prev;
                Store.set('lobbyOppId2', lobbyOppId2);
              }
              Store.set('lobbyOppId', lobbyOppId);
            } else {
              const prev = lobbyOppId2;
              lobbyOppId2 = ch.id;
              if (lobbyOppId2 === lobbyOppId) {
                lobbyOppId = prev;
                Store.set('lobbyOppId', lobbyOppId);
              }
              Store.set('lobbyOppId2', lobbyOppId2);
            }
            renderLobby();
          });
          charList.appendChild(btn);
        }
      }
    }

    // --- Captured Detail Modal (내 패/상대 패 공용) ---
    function showCapturedModal(playerId) {
      if (!match) return;
      const st = match.gameState;
      const p = st.players[playerId];
      if (!p) return;
      const isMe = playerId === 0;
      const ch = isMe ? { avatar: '🙂', name: '나' } : AI.getCharacter(match.oppCharIds[playerId - 1]);
      const sc = Engine.scoreOf(st, playerId);
      const gukjinSide = Engine.gukjinSideOf(st, playerId);
      const animalCards = gukjinSide === 'double'
        ? p.captured.animal.filter(c => !c.isGukjin)
        : p.captured.animal;
      const junkCards = gukjinSide === 'double'
        ? p.captured.junk.concat(p.captured.animal.filter(c => c.isGukjin))
        : p.captured.junk;
      const sections = [
        { label: '광 (' + p.captured.bright.length + '장)', cards: p.captured.bright },
        { label: '열끗 (' + sc.animalCount + '장)' + (gukjinSide === 'animal' ? ' · 국진 포함' : ''), cards: animalCards },
        { label: '띠 (' + p.captured.ribbon.length + '장)', cards: p.captured.ribbon },
        { label: '피 (' + sc.piCount + '피)' + (gukjinSide === 'double' ? ' · 국진 쌍피 포함' : ''), cards: junkCards }
      ];
      let html = '<h3>' + ch.avatar + ' ' + ch.name + ' 먹은 패 (' + sc.totalScore + '점)</h3>';
      if (gukjinSide) {
        html += '<div class="gukjin-summary">국진은 <b>' +
          (gukjinSide === 'double' ? '쌍피(2피)' : '열끗') + '</b>으로 계산됩니다.</div>';
      }
      for (const sec of sections) {
        html += '<div class="list-item-box"><div>' + sec.label + '</div><div class="opp-detail-cards">';
        if (sec.cards.length === 0) {
          html += '<span style="color:var(--muted);font-size:11px;">없음</span>';
        } else {
          for (const c of sec.cards) {
            html += '<div class="hw-card">' + CardArt.getSvg(c) + '</div>';
          }
        }
        html += '</div></div>';
      }
      html += '<div class="modal-btns single sticky"><button id="btnCloseCap" class="primary" type="button">닫기</button></div>';
      const box = showModal(html);
      box.querySelector('#btnCloseCap').onclick = closeModal;
    }

    // --- Table Rendering ---
    function renderTable() {
      if (!match) return;
      applyCosmeticsToShell();
      const st = match.gameState;
      const settings = Store.getSettings();
      const target = st.config.playerCount === 2 ? st.config.winScoreTarget2P : st.config.winScoreTarget3P;

      document.getElementById('roundPill').textContent = match.roundNumber + '판 · ' + st.config.unitPointValue.toLocaleString() + '원';
      document.getElementById('targetPill').textContent = target + '점 나기';
      const nagPill = document.getElementById('nagariPill');
      if (st.nagariStack > 0 && st.config.nagariMultiplier) {
        const nagMult = Math.min(Math.pow(2, st.nagariStack), st.config.nagariMaxStack);
        nagPill.textContent = '나가리 ×' + nagMult;
        nagPill.classList.remove('hidden');
      } else {
        nagPill.classList.add('hidden');
      }

      // 1. Opponents — show ACTUAL mini hwatu cards they captured!
      const oppRow = document.getElementById('opponentsRow');
      oppRow.className = 'opponents-row' + (st.players.length === 3 ? ' two-opps' : '');
      const existingBubbles = {};
      for (let i = 1; i < st.players.length; i++) {
        const oldCard = document.getElementById('oppCard_' + i);
        const b = oldCard && oldCard.querySelector('.speech-bubble');
        if (b) existingBubbles[i] = b;
      }
      oppRow.innerHTML = '';
      for (let i = 1; i < st.players.length; i++) {
        const p = st.players[i];
        const ch = AI.getCharacter(match.oppCharIds[i - 1]);
        const sc = Engine.scoreOf(st, i);
        const gukjinSide = Engine.gukjinSideOf(st, i);
        const oppEl = document.createElement('div');
        oppEl.id = 'oppCard_' + i;
        oppEl.className = 'opp-card' + (st.turn === i && st.phase !== 'GAME_OVER' ? ' active-turn' : '');

        // Ordered high-value first so brights/animals/ribbons/doubles are always clearly visible
        const allCap = []
          .concat(p.captured.bright)
          .concat(p.captured.animal)
          .concat(p.captured.ribbon)
          .concat(p.captured.junk.filter(c => c.piValue >= 2))
          .concat(p.captured.junk.filter(c => c.piValue === 1));

        let cardsHtml = '';
        // 한 줄 고정: 먹은 패가 늘어도 상대 칸 높이가 커져 테이블을 밀어내지 않는다.
        const showLimit = st.players.length === 3 ? 5 : 12;
        for (const c of allCap.slice(0, showLimit)) {
          cardsHtml += '<div class="hw-card opp-mini">' + CardArt.getSvg(c) + '</div>';
        }
        if (allCap.length === 0) {
          cardsHtml = '<span class="opp-cap-empty">아직 먹은 패 없음</span>';
        }
        // 먹은 패가 없을 때는 0 숫자 대신 안내 문구가 온전히 보이게 한다.
        const countsHtml = allCap.length > 0
          ? '<div class="opp-cap-counts">광' + p.captured.bright.length + ' 열' + sc.animalCount + ' 띠' + p.captured.ribbon.length + ' 피' + sc.piCount + '</div>'
          : '';

        const gukjinTxt = gukjinSide
          ? ' · <span class="opp-gukjin">국진 ' + (gukjinSide === 'double' ? '쌍피' : '열끗') + '</span>'
          : '';

        oppEl.innerHTML =
          '<div class="opp-head">' +
            '<div class="opp-av">' + ch.avatar + '</div>' +
            '<div class="opp-meta">' +
              '<div class="opp-name-row"><span class="opp-name-txt">' + ch.name + (p.goCount ? ' (' + p.goCount + '고)' : '') + '</span><span class="opp-coins">' + p.coins.toLocaleString() + '원</span></div>' +
              '<div class="opp-sub"><span>패 ' + p.hand.length + '장</span><span>' + sc.totalScore + '점' + gukjinTxt + (p.shakeMonths.length + p.bombMonths.length > 0 ? ' · 흔/폭' : '') + '</span></div>' +
            '</div>' +
          '</div>' +
          '<div class="opp-cap-strip" data-opp-cap="' + i + '" title="탭하여 전체 보기">' +
            '<div class="opp-cap-cards">' + cardsHtml + '</div>' +
            countsHtml +
          '</div>';

        oppEl.querySelector('[data-opp-cap]').addEventListener('click', () => showCapturedModal(i));
        if (existingBubbles[i]) oppEl.appendChild(existingBubbles[i]);
        oppRow.appendChild(oppEl);
      }

      // 2. Floor grouped by month
      const me = st.players[0];
      const isHumanPlay = !isBusy && st.phase === 'PLAY_HAND' && st.turn === 0;
      const handMonths = new Set(me.hand.filter(c => c.month >= 1).map(c => c.month));
      const selectedCardObj = selectedCardId ? me.hand.find(c => c.id === selectedCardId) : null;

      const floorZone = document.getElementById('floorZone');
      floorZone.innerHTML = '';
      floorZone.classList.toggle('drop-ready', !!selectedCardId && st.turn === 0 && st.phase === 'PLAY_HAND');

      const groups = new Map();
      for (const c of st.floor) {
        if (!groups.has(c.month)) groups.set(c.month, []);
        groups.get(c.month).push(c);
      }
      const sortedMonths = Array.from(groups.keys()).sort((a, b) => a - b);
      for (const m of sortedMonths) {
        const cards = groups.get(m);
        const isSelectedTarget = isHumanPlay && settings.highlightMatches && selectedCardObj && selectedCardObj.month === m;
        const isHandMatch = isHumanPlay && settings.highlightMatches && handMonths.has(m);
        const grp = document.createElement('div');
        grp.className = 'floor-group' +
          (cards.length >= 3 ? ' ppeok-glow' : '') +
          (isSelectedTarget ? ' floor-match-target' : (isHandMatch ? ' floor-match-hint' : ''));
        grp.dataset.month = String(m);
        if (isSelectedTarget) {
          grp.title = '탭하여 내기';
          grp.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!isBusy && match && match.gameState.turn === 0 && match.gameState.phase === 'PLAY_HAND' && selectedCardObj) {
              const sourceEl = document.querySelector('#myHandRow [data-card-id="' + selectedCardObj.id + '"]');
              selectedCardId = null;
              handleHumanCardPlay(selectedCardObj, sourceEl);
            }
          });
        } else if (isHandMatch) {
          grp.title = '탭하여 맞는 내 패 선택';
          grp.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isBusy || !match || match.gameState.turn !== 0 || match.gameState.phase !== 'PLAY_HAND') return;
            const matchCard = me.hand.find(c => c.month === m && !c.isEmptyBomb);
            if (matchCard) {
              selectedCardId = matchCard.id;
              renderTable();
            }
          });
        }
        for (const c of cards) {
          const cardEl = document.createElement('div');
          cardEl.className = 'hw-card';
          cardEl.dataset.cardId = c.id;
          cardEl.innerHTML = CardArt.getSvg(c);
          grp.appendChild(cardEl);
        }
        floorZone.appendChild(grp);
      }

      // 3. Deck Stack
      const deckStack = document.getElementById('deckStack');
      deckStack.innerHTML = '';
      if (st.deck.length > 0) {
        const backEl = document.createElement('div');
        backEl.className = 'hw-card';
        backEl.innerHTML = CardArt.getBackSvg();
        deckStack.appendChild(backEl);
      }
      document.getElementById('deckCountBadge').textContent = String(st.deck.length);

      // 4. My Captured Grid
      const mySc = Engine.scoreOf(st, 0);
      const myGukjinSide = Engine.gukjinSideOf(st, 0);
      const myGukjinTxt = myGukjinSide ? ' · 국진 ' + (myGukjinSide === 'double' ? '쌍피' : '열끗') : '';
      const myScoreTxt = '내 점수: ' + mySc.totalScore + '점' + (me.goCount ? ' (' + me.goCount + '고)' : '') + (me.shakeMonths.length + me.bombMonths.length > 0 ? ' · ×' + Math.pow(2, me.shakeMonths.length + me.bombMonths.length) : '') + myGukjinTxt;
      const myScoreBadge = document.getElementById('myScoreBadge');
      myScoreBadge.textContent = myScoreTxt;
      myScoreBadge.title = myGukjinSide ? '국진 ' + (myGukjinSide === 'double' ? '쌍피' : '열끗') : '';

      const hint = document.getElementById('turnHint');
      if (st.phase === 'GAME_OVER') {
        hint.textContent = '판 종료';
        hint.className = 'turn-hint';
      } else if (st.turn === 0) {
        hint.textContent = selectedCardId ? '한 번 더 탭 또는 강조된 바닥 패 탭' : '내 턴: 패를 탭하세요';
        hint.className = 'turn-hint your-turn';
      } else {
        const curCh = AI.getCharacter(match.oppCharIds[st.turn - 1]);
        hint.textContent = curCh.name + ' 생각 중...';
        hint.className = 'turn-hint';
      }

      const capGrid = document.getElementById('myCapturedGrid');
      capGrid.innerHTML = '';
      const capCats = [
        { key: 'bright', label: '광', count: me.captured.bright.length, cards: me.captured.bright },
        { key: 'animal', label: '열끗' + (myGukjinSide === 'animal' ? '<span class="gukjin-tag">국진</span>' : ''), count: mySc.animalCount, cards: mySc.gukjinAsDouble ? me.captured.animal.filter(c => !c.isGukjin) : me.captured.animal },
        { key: 'ribbon', label: '띠', count: me.captured.ribbon.length, cards: me.captured.ribbon },
        { key: 'junk', label: '피' + (myGukjinSide === 'double' ? '<span class="gukjin-tag">국진</span>' : ''), count: mySc.piCount, cards: mySc.gukjinAsDouble ? me.captured.junk.concat(me.captured.animal.filter(c => c.isGukjin)) : me.captured.junk }
      ];
      for (const cat of capCats) {
        const col = document.createElement('div');
        col.className = 'cap-col';
        col.id = 'myCap_' + cat.key;
        col.dataset.capPlayer = '0';
        col.title = '탭하여 내가 먹은 패 전체 보기';
        col.innerHTML = '<div class="cap-col-head"><span>' + cat.label + '</span><span>' + cat.count + '</span></div>';
        const strip = document.createElement('div');
        strip.className = 'cap-cards-strip';
        for (const c of cat.cards.slice(-8)) {
          const mc = document.createElement('div');
          mc.className = 'hw-card mini';
          mc.innerHTML = CardArt.getSvg(c);
          strip.appendChild(mc);
        }
        col.appendChild(strip);
        col.addEventListener('click', () => showCapturedModal(0));
        capGrid.appendChild(col);
      }

      // 5. My Hand (10 cards in 1 row)
      const handRow = document.getElementById('myHandRow');
      handRow.innerHTML = '';
      const handSorted = me.hand.slice().sort((a, b) => (a.month === b.month ? a.id.localeCompare(b.id) : a.month - b.month));
      handRow.style.gridTemplateColumns = 'repeat(' + Math.max(handSorted.length, 6) + ', minmax(0, 1fr))';

      const floorMonths = new Set(st.floor.map(c => c.month));
      const handMonthCounts = Object.create(null);
      for (const c of me.hand) {
        if (c.month >= 1) handMonthCounts[c.month] = (handMonthCounts[c.month] || 0) + 1;
      }

      for (const c of handSorted) {
        const slot = document.createElement('div');
        slot.className = 'hand-slot';
        const isMatch = floorMonths.has(c.month);
        const isBombReady = c.month >= 1 && handMonthCounts[c.month] === 3 && isMatch;
        const isShakeReady = c.month >= 1 && handMonthCounts[c.month] === 3 && !isMatch && !me.shakeMonths.includes(c.month);

        if (isBombReady) {
          slot.innerHTML = '<span class="hand-badge">폭탄</span>';
        } else if (isShakeReady) {
          slot.innerHTML = '<span class="hand-badge">흔들기</span>';
        } else if (c.isBonus) {
          slot.innerHTML = '<span class="hand-badge" style="background:#4ade80;">보너스</span>';
        }

        const cardEl = document.createElement('div');
        cardEl.className = 'hw-card hand-card';
        cardEl.dataset.cardId = c.id;
        if (settings.highlightMatches && isMatch && !c.isBonus && !c.isEmptyBomb) {
          cardEl.classList.add('match-glow');
        } else if (settings.highlightMatches && c.isBonus) {
          cardEl.classList.add('bonus-glow');
        }
        if (selectedCardId === c.id) cardEl.classList.add('selected');
        if (!isHumanPlay && st.turn !== 0) cardEl.classList.add('dimmed');
        cardEl.innerHTML = CardArt.getSvg(c);

        slot.appendChild(cardEl);
        attachCardInteraction(slot, cardEl, c);
        handRow.appendChild(slot);
      }
    }

    // --- Pointer Interaction: Tap-to-Select, Tap-Again / Drag-to-Floor to Play ---
    function attachCardInteraction(slotEl, cardEl, card) {
      let startX = 0, startY = 0, dragging = false, moved = false;

      function resetDragVisual() {
        cardEl.style.transition = '';
        cardEl.style.zIndex = '';
        cardEl.style.transform = '';
      }

      slotEl.addEventListener('pointerdown', (ev) => {
        if (isBusy || !match || match.gameState.turn !== 0 || match.gameState.phase !== 'PLAY_HAND') return;
        startX = ev.clientX;
        startY = ev.clientY;
        dragging = true;
        moved = false;
      });

      slotEl.addEventListener('pointermove', (ev) => {
        if (!dragging) return;
        const dx = ev.clientX - startX;
        const dy = ev.clientY - startY;
        if (!moved && Math.hypot(dx, dy) > 18) {
          moved = true;
          try { slotEl.setPointerCapture(ev.pointerId); } catch (_) {}
        }
        if (moved) {
          cardEl.style.transition = 'none';
          cardEl.style.zIndex = '50';
          cardEl.style.transform = 'translate3d(' + dx + 'px, ' + dy + 'px, 0) scale(1.1)';
        }
      });

      slotEl.addEventListener('pointercancel', () => {
        if (!dragging) return;
        dragging = false;
        moved = false;
        resetDragVisual();
      });

      slotEl.addEventListener('pointerup', (ev) => {
        if (!dragging) return;
        dragging = false;
        resetDragVisual();
        try {
          if (slotEl.hasPointerCapture(ev.pointerId)) slotEl.releasePointerCapture(ev.pointerId);
        } catch (_) {}

        if (isBusy || !match || match.gameState.turn !== 0 || match.gameState.phase !== 'PLAY_HAND') return;

        if (moved) {
          const floorRect = document.getElementById('floorZone').getBoundingClientRect();
          if (ev.clientY <= floorRect.bottom + 30 && ev.clientX >= floorRect.left - 24 && ev.clientX <= floorRect.right + 24) {
            selectedCardId = null;
            handleHumanCardPlay(card, cardEl);
            return;
          }
          const handRect = document.getElementById('myHandRow').getBoundingClientRect();
          if (ev.clientY < handRect.top - 10) {
            renderTable();
            return;
          }
        }

        if (selectedCardId === card.id) {
          selectedCardId = null;
          handleHumanCardPlay(card, cardEl);
        } else {
          selectedCardId = card.id;
          FX.playSfx('snap');
          FX.vibrate(10);
          renderTable();
        }
      });
    }

    function handleHumanCardPlay(card, sourceEl) {
      const st = match.gameState;
      const me = st.players[0];
      if (card.isBonus) {
        executeMoveWithFX({ type: 'PLAY_BONUS', playerId: 0, cardId: card.id }, sourceEl);
        return;
      }
      if (card.isEmptyBomb) {
        executeMoveWithFX({ type: 'PLAY_PASS', playerId: 0, cardId: card.id }, sourceEl);
        return;
      }

      const sameHand = me.hand.filter(c => c.month === card.month);
      const sameFloor = st.floor.filter(c => c.month === card.month);

      if (sameHand.length === 3 && sameFloor.length === 1) {
        const box = showModal(
          '<h3>폭탄 가능! (' + card.month + '월)</h3>' +
          '<div class="modal-desc">같은 월 3장을 한 번에 내어 4장을 모두 먹고 <b>×2 배수</b> + 피 1장을 뺏습니다.</div>' +
          '<div class="modal-btns">' +
            '<button id="btnDoBomb" class="primary" type="button">폭탄! (×2)</button>' +
            '<button id="btnSingleCard" type="button">1장만 내기</button>' +
          '</div>'
        );
        box.querySelector('#btnDoBomb').onclick = () => {
          closeModal();
          executeMoveWithFX({ type: 'PLAY_BOMB', playerId: 0, month: card.month }, sourceEl);
        };
        box.querySelector('#btnSingleCard').onclick = () => {
          closeModal();
          executeMoveWithFX({ type: 'PLAY_CARD', playerId: 0, cardId: card.id, shake: false }, sourceEl);
        };
        return;
      }

      if (sameHand.length === 3 && sameFloor.length === 0 && !me.shakeMonths.includes(card.month)) {
        const box = showModal(
          '<h3>흔들기 가능! (' + card.month + '월)</h3>' +
          '<div class="modal-desc">같은 월 3장을 공개하고 <b>흔들기 (×2 배수)</b>를 선언할까요?</div>' +
          '<div class="modal-btns">' +
            '<button id="btnDoShake" class="primary" type="button">흔들기! (×2)</button>' +
            '<button id="btnNoShake" type="button">그냥 내기</button>' +
          '</div>'
        );
        box.querySelector('#btnDoShake').onclick = () => {
          closeModal();
          executeMoveWithFX({ type: 'PLAY_CARD', playerId: 0, cardId: card.id, shake: true }, sourceEl);
        };
        box.querySelector('#btnNoShake').onclick = () => {
          closeModal();
          executeMoveWithFX({ type: 'PLAY_CARD', playerId: 0, cardId: card.id, shake: false }, sourceEl);
        };
        return;
      }

      executeMoveWithFX({ type: 'PLAY_CARD', playerId: 0, cardId: card.id, shake: false }, sourceEl);
    }

    // --- Move Execution + Realistic Hwatu Motion + Cut-ins + Persistence ---
    async function executeMoveWithFX(move, optionalSourceEl) {
      if (!match || isBusy) return;
      isBusy = true;
      FX.syncBgm();

      try {
        const prevState = match.gameState;
        const pid = move.playerId != null ? move.playerId : prevState.turn;
        const dur = animDur();

        const floorRect = document.getElementById('floorZone').getBoundingClientRect();
        const deckRect = document.getElementById('deckStack').getBoundingClientRect();
        const midFloor = { left: floorRect.left + floorRect.width / 2 - 21, top: floorRect.top + floorRect.height / 2 - 31, width: 42, height: 63 };

        let fromRect = optionalSourceEl ? optionalSourceEl.getBoundingClientRect() : null;
        if (!fromRect) {
          if (pid === 0) {
            const el = document.querySelector('#myHandRow [data-card-id="' + move.cardId + '"]');
            fromRect = el ? el.getBoundingClientRect() : document.getElementById('myHandRow').getBoundingClientRect();
          } else {
            const oppEl = document.getElementById('oppCard_' + pid);
            fromRect = oppEl ? oppEl.getBoundingClientRect() : floorRect;
          }
        }

        const res = Engine.applyMove(prevState, move);
        const nextState = res.state;
        const events = res.events || [];

        // Track round metrics for human missions/stats
        if (pid === 0 && match.roundMetrics) {
          for (const ev of events) {
            if (ev.type === 'jjok') match.roundMetrics.jjok += 1;
            else if (ev.type === 'ttadak') match.roundMetrics.ttadak += 1;
            else if (ev.type === 'sweep') match.roundMetrics.sweep += 1;
            else if (ev.type === 'ppeok') match.roundMetrics.ppeok += 1;
          }
        }

        match.gameState = nextState;
        saveActiveMatch();

        // 1. Hand card arc + snap onto floor
        if (move.type === 'PLAY_CARD' || move.type === 'PLAY_BOMB') {
          const playedCard = move.type === 'PLAY_CARD'
            ? prevState.players[pid].hand.find(c => c.id === move.cardId)
            : prevState.players[pid].hand.find(c => c.month === move.month);
          const targetGroup = playedCard ? document.querySelector('.floor-group[data-month="' + playedCard.month + '"]') : null;
          const toRect = targetGroup ? targetGroup.getBoundingClientRect() : midFloor;
          FX.playSfx('snap');
          await FX.flyCard(playedCard, fromRect, toRect, dur, { impact: true, flipFromBack: pid !== 0 });

          // 2. Deck 3D flip onto floor
          const flipEvent = events.find(e => e.source === 'flip' || e.source === 'jjok' || e.source === 'ttadak' || e.type === 'ppeok');
          if (prevState.deck.length > nextState.deck.length && prevState.deck[0]) {
            const flippedVisual = (flipEvent && flipEvent.cards && flipEvent.cards[0]) || prevState.deck.find(c => !c.isBonus) || prevState.deck[0];
            FX.playSfx('flip');
            await FX.flyCard(flippedVisual, deckRect, midFloor, Math.round(dur * 0.9), { flipFromBack: true, impact: true });
          }
        } else if (move.type === 'PLAY_BONUS') {
          FX.playSfx('special');
          const capRect = pid === 0 ? document.getElementById('myCap_junk').getBoundingClientRect() : fromRect;
          await FX.flyCard(prevState.players[pid].hand.find(c => c.id === move.cardId), fromRect, capRect, dur, { impact: true });
        }

        // 3. Fly all captured cards into winner's pile
        const matchEvents = events.filter(e => e.type === 'match' && e.cards && e.cards.length > 0);
        if (matchEvents.length > 0) {
          const flyTasks = [];
          for (const me of matchEvents) {
            const sample = me.cards[me.cards.length - 1];
            let destRect = null;
            if (pid === 0) {
              const pileId = sample.category === 'bright' ? 'myCap_bright' : (sample.category === 'animal' ? 'myCap_animal' : (sample.category === 'ribbon' ? 'myCap_ribbon' : 'myCap_junk'));
              const el = document.getElementById(pileId);
              if (el) destRect = el.getBoundingClientRect();
            } else {
              const oppEl = document.getElementById('oppCard_' + pid);
              if (oppEl) destRect = oppEl.getBoundingClientRect();
            }
            if (destRect) {
              flyTasks.push(FX.flyCard(sample, midFloor, destRect, Math.round(dur * 0.8), { tiltDeg: 0 }));
            }
          }
          if (flyTasks.length > 0) await Promise.all(flyTasks);
        }

        // 4. Cut-ins, Shake, Flash, SFX & Speech
        for (const ev of events) {
          if (ev.type === 'jjok') { FX.showBanner('쪽!', '피 1장 뺏기', true); FX.playSfx('cutin'); }
          else if (ev.type === 'ttadak') { FX.showBanner('따닥!', '4장 쓸고 피 1장!', true); FX.playSfx('cutin'); }
          else if (ev.type === 'ppeok') {
            FX.showBanner('뻑!', '바닥에 3장 쌓임', false); FX.playSfx('special');
            if (pid !== 0) triggerSpeech(pid, 'ppeok');
          }
          else if (ev.type === 'sweep') { FX.showBanner('싹쓸이!', '바닥 청소 피 1장', true); FX.playSfx('cutin'); }
          else if (ev.type === 'bomb') { FX.showBanner('폭탄!', '배수 ×2 & 피 1장', true); FX.playSfx('cutin'); }
          else if (ev.type === 'shake') { FX.showBanner('흔들기!', '승리 시 배수 ×2', true); FX.playSfx('cutin'); }
          else if (ev.type === 'go') {
            const isMega = ev.goCount >= 3;
            FX.showBanner(ev.goCount + '고!', isMega ? ('쓰리고 이상! ×' + Math.pow(2, ev.goCount - 2) + '배') : '추가 점수 도전!', isMega);
            FX.playSfx(isMega ? 'cutin' : 'special');
            if (pid !== 0) triggerSpeech(pid, 'go');
          }
          else if (ev.type === 'stop') {
            FX.showBanner('스톱!', '승부 확정', true); FX.playSfx('win');
            if (pid !== 0) triggerSpeech(pid, 'stop');
          }
          else if (ev.type === 'chongtong') {
            FX.showBanner(pid === 0 ? '플레이어 총통 승리!' : '상대방 총통 승리!', '시작 4장 즉시 승리', true); FX.playSfx(pid === 0 ? 'win' : 'lose');
          }
          else if (ev.type === 'three_ppeok') {
            FX.showBanner(pid === 0 ? '플레이어 삼연뻑 승리!' : '상대방 삼연뻑 승리!', '3뻑 즉시 승리', true); FX.playSfx(pid === 0 ? 'win' : 'lose');
          }
          else if (ev.type === 'match' && ev.isJaPpeok) {
            FX.showBanner('자뻑!', '피 2장 뺏기!', true); FX.playSfx('cutin');
          }
        }
        if (pid !== 0 && matchEvents.length > 0 && !events.some(e => e.type === 'ppeok' || e.type === 'go' || e.type === 'stop')) {
          triggerSpeech(pid, 'capture');
        }
      } finally {
        isBusy = false;
      }

      renderTable();
      processPostMoveState();
    }

    function processPostMoveState() {
      if (!match) return;
      const st = match.gameState;

      if (st.phase === 'GAME_OVER') {
        handleGameOver();
        return;
      }

      const activePid = st.pendingAction ? st.pendingAction.playerId : st.turn;
      if (activePid === 0) {
        if (st.phase === 'CHONGTONG_CHOICE') showChongtongModal();
        else if (st.phase === 'CHOOSE_FLOOR') showFloorChoiceModal();
        else if (st.phase === 'GO_STOP_DECISION') showGoStopModal();
        return;
      }

      if (aiTimer) clearTimeout(aiTimer);
      aiTimer = setTimeout(() => {
        aiTimer = null;
        if (!match || match.gameState.phase === 'GAME_OVER') return;
        const curPid = match.gameState.pendingAction ? match.gameState.pendingAction.playerId : match.gameState.turn;
        if (curPid === 0) return;
        const charId = match.oppCharIds[curPid - 1];
        const diffOpt = Store.getSettings().difficulty || 'auto';
        const aiOpts = diffOpt === 'auto' ? { characterId: charId } : { characterId: charId, difficulty: diffOpt };
        const choice = AI.chooseMove(match.gameState, match.aiRngState, aiOpts);
        match.aiRngState = choice.rngState;
        executeMoveWithFX(choice.move);
      }, aiThinkDelay());
    }

    // --- Human Interactive Modals ---
    function showChongtongModal() {

      const months = st.pendingAction.months.join(', ');

        '<h3>총통! (' + months + '월 4장)</h3>' +
        '<div class="modal-desc">시작 손패에 같은 월 4장이 있습니다!<br>즉시 승리(' + fixedScore + '점, 배수 없음)하거나 계속 진행할 수 있습니다.</div>' +
        '<div class="modal-btns">' +
          '<button id="btnWinChong" class="primary" type="button">총통 승리</button>' +
          '<button id="btnDeclineChong" type="button">계속 진행</button>' +
        '</div>'
      );
      box.querySelector('#btnWinChong').onclick = () => { closeModal(); executeMoveWithFX({ type: 'DECLARE_CHONGTONG', playerId: 0 }); };
      box.querySelector('#btnDeclineChong').onclick = () => { closeModal(); executeMoveWithFX({ type: 'DECLINE_CHONGTONG', playerId: 0 }); };
    }

    function showFloorChoiceModal() {
      const pa = match.gameState.pendingAction;
      const box = showModal(
        '<h3>바닥 패 선택</h3>' +
        '<div class="modal-desc">바닥에 같은 월이 2장 있습니다. 가져올 패를 선택하세요.</div>' +
        '<div class="modal-cards" id="floorChoiceCards"></div>'
      );
      const wrap = box.querySelector('#floorChoiceCards');
      for (const opt of pa.options) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'modal-card-btn';
        btn.innerHTML = '<div class="hw-card">' + CardArt.getSvg(opt) + '</div><span style="font-size:12px;">' + opt.name + '</span>';
        btn.onclick = () => {
          closeModal();
          executeMoveWithFX({ type: 'CHOOSE_FLOOR', playerId: 0, cardId: opt.id });
        };
        wrap.appendChild(btn);
      }
    }

    function showGoStopModal() {
      const st = match.gameState;
      const sc = Engine.scoreOf(st, 0);
      const nextGo = st.players[0].goCount + 1;
      const goDesc = nextGo >= 3 ? ('+' + nextGo + '점 &amp; ×' + Math.pow(2, nextGo - 2) + '배') : ('+' + nextGo + '점');
      const box = showModal(
        '<h3>고 / 스톱 선택</h3>' +

    // --- Game Over & Settlement Modal ---
    function handleGameOver() {
      const st = match.gameState;
      const s = st.settlement;
      if (!s) return;

      if (!match.settledApplied) {
        match.settledApplied = true;
        if (!s.isNagari) {
          FX.playSfx(s.winner === 0 ? 'win' : 'lose');
          const nextCoins = st.players.map(p => p.coins);
          for (const p of s.payments) {
            nextCoins[p.from] = Math.max(0, nextCoins[p.from] - p.paid);
            nextCoins[p.to] += p.paid;
          }
          match.matchCoins = nextCoins;
          Store.setWallet(nextCoins[0]);

          const hasBak = s.payments.some(p => p.isPibak || p.isGwangbak);
          const totalMult = s.multipliers.commonMult * (hasBak ? 2 : 1);
          if (totalMult >= 4 || s.totalWon >= st.config.unitPointValue * 40) {
            FX.showBanner(s.winner === 0 ? '🎉 플레이어 대박 승리!' : '상대방 대박 승리!', s.totalWon.toLocaleString() + '원!', true);
          } else if (hasBak) {
            const bakText = s.payments.some(p => p.isPibak) && s.payments.some(p => p.isGwangbak) ? '피박·광박!' : (s.payments.some(p => p.isPibak) ? '피박!' : '광박!');
            FX.showBanner(bakText, '배수 ×2 적용', true);
          }
        }
        Store.recordRoundOutcome(st, match.oppCharIds[0], match.roundMetrics || {});
        saveActiveMatch();
      }

      if (s.isNagari) {
        const nextMult = Math.min(Math.pow(2, s.nextNagariStack), st.config.nagariMaxStack);
        const box = showModal(
          '<h3>나가리 (무승부)</h3>' +
          '<div class="modal-desc">승자 없이 판이 종료되었습니다.<br>다음 판 배수: <b>×' + nextMult + '</b> (누적 ' + s.nextNagariStack + '회)</div>' +
          '<div class="modal-btns">' +
            '<button id="btnNextRound" class="primary" type="button">다음 판</button>' +
            '<button id="btnBackLobby" type="button">로비로</button>' +
          '</div>'
        );
        box.querySelector('#btnNextRound').onclick = () => { closeModal(); startNextRound(); };
        box.querySelector('#btnBackLobby').onclick = () => { clearActiveMatch(); renderLobby(); };
        return;
      }

      const isHumanWin = s.winner === 0;
      const winName = isHumanWin ? '나 (P1)' : AI.getCharacter(match.oppCharIds[s.winner - 1]).name;
      const sc = s.score;
      const m = s.multipliers;

      let rowsHtml = '';
      if (s.winReason === 'chongtong' || s.winReason === 'three_ppeok') {
        rowsHtml += '<tr><td>특수 승리 (' + (s.winReason === 'chongtong' ? '총통' : '삼연뻑') + ')</td><td class="r">' + sc.totalScore + '점 (×1)</td></tr>';
      } else {
        if (sc.brightScore) rowsHtml += '<tr><td>광 (' + sc.brightCount + '장)</td><td class="r">' + sc.brightScore + '점</td></tr>';
        if (sc.animalScore) rowsHtml += '<tr><td>열끗 (' + sc.animalCount + '장' + (sc.godoriScore ? ', 고도리' : '') + ')</td><td class="r">' + sc.animalScore + '점</td></tr>';
        if (sc.ribbonScore) rowsHtml += '<tr><td>띠 (' + sc.ribbonCount + '장)</td><td class="r">' + sc.ribbonScore + '점</td></tr>';
        if (sc.piScore) rowsHtml += '<tr><td>피 (' + sc.piCount + '피)</td><td class="r">' + sc.piScore + '점</td></tr>';
        if (sc.goAddScore) rowsHtml += '<tr><td>고 가산점</td><td class="r">+' + sc.goAddScore + '점</td></tr>';
        rowsHtml += '<tr><td><b>총 점수 × 공통배수</b></td><td class="r"><b>' + sc.totalScore + '점 <span id="multCounterVal">×' + m.commonMult + '</span></b></td></tr>';
      }

      let payHtml = '';
      let maxPayMult = m.commonMult;
      for (const p of s.payments) {
        const fromName = p.from === 0 ? '나' : AI.getCharacter(match.oppCharIds[p.from - 1]).name;
        const tags = [];
        let pMult = m.commonMult;
        if (p.isPibak) { tags.push('피박'); pMult *= 2; }
        if (p.isGwangbak) { tags.push('광박'); pMult *= 2; }
        if (p.isGobak) { tags.push(p.isGobakSoloPayer ? '고박(독박)' : '고박'); if (st.config.playerCount === 2) pMult *= 2; }
        if (pMult > maxPayMult) maxPayMult = pMult;
        payHtml += '<tr><td>' + fromName + (tags.length ? ' [' + tags.join(',') + ']' : '') + '</td><td class="r">' + p.paid.toLocaleString() + '원</td></tr>';
      }

      const oppQuote = AI.getDialogue(match.oppCharIds[0], isHumanWin ? (s.payments.some(p => p.from === 1 && p.isPibak) ? 'pibak' : 'lose') : 'win', Date.now()).text;
      const oppCh = AI.getCharacter(match.oppCharIds[0]);

      const box = showModal(
        '<h3>' + (isHumanWin ? '🎉 플레이어 승리!' : '상대방 승리! (' + winName + ')') + '</h3>' +
        '<div class="modal-desc" style="font-size:12px;color:var(--muted);">' + oppCh.avatar + ' ' + oppCh.name + ': "' + oppQuote + '"</div>' +
        '<table class="settle-table">' + rowsHtml + payHtml + '</table>' +
        '<div class="modal-desc" style="margin-top:8px;">' + (isHumanWin ? '플레이어 획득 금액' : '상대방(' + winName + ') 획득 금액') + ': <b style="color:' + (isHumanWin ? 'var(--ok)' : 'var(--err)') + ';font-size:16px;">' + s.totalWon.toLocaleString() + '원</b></div>' +
        '<div class="modal-btns">' +
          '<button id="btnNextRound" class="primary" type="button">다음 판 이어하기</button>' +
          '<button id="btnBackLobby" type="button">로비로</button>' +
        '</div>'
      );
      const multEl = box.querySelector('#multCounterVal');
      if (multEl && m.commonMult > 1) FX.animateMultCounter(multEl, m.commonMult);

      box.querySelector('#btnNextRound').onclick = () => { closeModal(); startNextRound(); };
      box.querySelector('#btnBackLobby').onclick = () => { clearActiveMatch(); renderLobby(); };
    }

    // --- Match Lifecycle ---
    function startNewMatch() {
      const stage = Store.CAREER_STAGES[lobbyStageId] || Store.CAREER_STAGES[0];
      const humanCoins = Math.max(Store.getWallet(), 0);
      if (humanCoins < stage.minCoins) {
        showModal('<h3>입장 불가</h3><div class="modal-desc">' + stage.name + ' 입장에는 최소 ' + stage.minCoins.toLocaleString() + '원이 필요합니다.</div><div class="modal-btns single"><button id="okLock" class="primary" type="button">확인</button></div>');
        document.getElementById('okLock').onclick = closeModal;
        return;
      }

      const settings = Store.getSettings();
      const playerCount = lobbyMode;
      const stake = Number(settings.defaultStake) > 0 ? Number(settings.defaultStake) : stage.stake;
      const oppIds = [lobbyOppId];
      if (playerCount === 3) {
        let secondId = lobbyOppId2;
        if (!secondId || secondId === lobbyOppId) {
          secondId = (AI.CHARACTERS.find(c => c.id !== lobbyOppId) || AI.CHARACTERS[0]).id;
          lobbyOppId2 = secondId;
          Store.set('lobbyOppId2', secondId);
        }
        oppIds.push(secondId);
      }
      const aiBank = Math.max(100000, stake * 150);
      const initialCoins = playerCount === 2 ? [humanCoins, aiBank] : [humanCoins, aiBank, aiBank];
      const seed = Date.now() % 1000000000;
      const ruleCfg = Store.buildEngineRuleConfig(playerCount);
      const gameState = Engine.newGame(Object.assign({}, ruleCfg, {
        playerCount,
        unitPointValue: stake,
        initialCoins,
        recordLog: true
      }), seed);

      match = {
        gameState,
        oppCharIds: oppIds,
        aiRngState: Engine.hashSeed(seed + '_ui_ai'),
        roundNumber: 1,
        nagariStack: 0,
        matchCoins: initialCoins.slice(),
        settledApplied: false,
        roundMetrics: { jjok: 0, ttadak: 0, sweep: 0, ppeok: 0 }
      };
      isBusy = false;
      selectedCardId = null;
      saveActiveMatch();
      FX.syncBgm();
      enterGameView();
      setTimeout(() => triggerSpeech(1, 'start'), 250);
    }

    function startNextRound() {
      if (!match) return;
      isBusy = false;
      const prev = match.gameState;
      const s = prev.settlement;
      const nextNagariStack = s ? s.nextNagariStack : 0;
      const forcedFirst = s && !s.isNagari && s.winner != null ? s.winner : prev.firstPlayer;
      const roundNumber = match.roundNumber + 1;
      const seed = (Date.now() + roundNumber * 97) % 1000000000;

      const coins = match.matchCoins.slice();
      for (let i = 1; i < coins.length; i++) {
        if (coins[i] < prev.config.unitPointValue * 10) coins[i] = Math.max(100000, prev.config.unitPointValue * 150);
      }

      const ruleCfg = Store.buildEngineRuleConfig(prev.config.playerCount);
      const gameState = Engine.newGame(Object.assign({}, ruleCfg, {
        playerCount: prev.config.playerCount,
        unitPointValue: prev.config.unitPointValue,
        initialCoins: coins,
        previousNagariCount: nextNagariStack,
        forcedFirstPlayer: forcedFirst,
        roundNumber,
        recordLog: true
      }), seed);

      match.gameState = gameState;
      match.roundNumber = roundNumber;
      match.nagariStack = nextNagariStack;
      match.settledApplied = false;
      match.roundMetrics = { jjok: 0, ttadak: 0, sweep: 0, ppeok: 0 };
      selectedCardId = null;
      saveActiveMatch();
      renderTable();
      processPostMoveState();
    }

    function enterGameView() {
      document.getElementById('lobbyView').classList.add('hidden');
      document.getElementById('testView').classList.add('hidden');
      document.getElementById('gameView').classList.remove('hidden');
      renderTable();
      processPostMoveState();
    }

    const DIALOGUE_SITUATIONS = Object.freeze([
      { key: 'start', label: '판 시작' },
      { key: 'capture', label: '패를 먹었을 때' },
      { key: 'ppeok', label: '뻑이 났을 때' },

    function escHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
        c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '"' ? '&quot;' : '&#39;'
      ));
    }

    function openDialogueEditor() {
      const custom = Store.getCustomLines();
      let html = '<h3>캐릭터 대사 편집</h3>' +
        '<div class="dlg-note">한 줄에 대사 하나씩 입력하세요. 비워 둔 칸은 기본 대사를 그대로 씁니다. 입력한 대사는 이 브라우저에만 저장되고, 진행 중인 판부터 바로 적용됩니다.</div>' +
        '<div class="dlg-tabs">';
      AI.CHARACTERS.forEach((ch, i) => {
        html += '<button type="button" class="dlg-tab' + (i === 0 ? ' active' : '') + '" data-dlg-tab="' + ch.id + '">' +
          ch.avatar + ' ' + escHtml(ch.name) + '</button>';
      });
      html += '</div>';

      AI.CHARACTERS.forEach((ch, i) => {
        html += '<div class="dlg-pane' + (i === 0 ? ' active' : '') + '" data-dlg-pane="' + ch.id + '">';
        for (const sit of DIALOGUE_SITUATIONS) {
          const cur = (custom[ch.id] && custom[ch.id][sit.key]) || [];
          const def = (ch.lines && ch.lines[sit.key]) || [];
          html += '<div class="dlg-field">' +
            '<label>' + sit.label + '</label>' +
            '<textarea data-dlg-char="' + ch.id + '" data-dlg-sit="' + sit.key + '" ' +
            'placeholder="' + escHtml(def.join('\n')) + '">' + escHtml(cur.join('\n')) + '</textarea>' +
            '</div>';
        }
        html += '</div>';
      });

      html += '<div class="modal-btns">' +
        '<button id="btnDlgReset" class="small danger" type="button">전체 기본값으로</button>' +
        '<button id="btnDlgSave" class="primary" type="button">저장</button>' +
        '</div>' +
        '<div class="modal-btns single"><button id="btnDlgClose" class="small" type="button">닫기</button></div>';

      const box = showModal(html);

      for (const tab of box.querySelectorAll('[data-dlg-tab]')) {
        tab.onclick = () => {
          for (const t of box.querySelectorAll('[data-dlg-tab]')) t.classList.toggle('active', t === tab);
          for (const p of box.querySelectorAll('[data-dlg-pane]')) {
            p.classList.toggle('active', p.getAttribute('data-dlg-pane') === tab.getAttribute('data-dlg-tab'));
          }
        };
      }

      box.querySelector('#btnDlgSave').onclick = () => {
        const data = {};
        for (const ta of box.querySelectorAll('textarea[data-dlg-char]')) {
          const cid = ta.getAttribute('data-dlg-char');
          const sit = ta.getAttribute('data-dlg-sit');
          const arr = ta.value.split('\n').map(t => t.trim()).filter(t => t.length > 0);
          if (!arr.length) continue;
          if (!data[cid]) data[cid] = {};
          data[cid][sit] = arr;
        }
        Store.saveCustomLines(data);
        FX.playSfx('snap');
        closeModal();
      };

      box.querySelector('#btnDlgReset').onclick = () => {
        Store.saveCustomLines({});
        openDialogueEditor();
      };

      box.querySelector('#btnDlgClose').onclick = () => openSettingsModal();
    }

    function openStatsModal() {
      const st = Store.getStats();
      const cb = st.combos;
      const rate = st.totalGames > 0 ? ((st.wins / st.totalGames) * 100).toFixed(1) : '0.0';
      let charRows = '';
      for (const ch of AI.CHARACTERS) {

    // --- ?test=1 View ---
    function renderTestView(engReport, aiReport, stReport) {
      const summary = document.getElementById('testSummaryText');
      const list = document.getElementById('testList');
      const tourOut = document.getElementById('tourOutput');

      const total = engReport.total + aiReport.total + stReport.total;
      const passed = engReport.passed + aiReport.passed + stReport.passed;
      const failed = engReport.failed + aiReport.failed + stReport.failed;
      summary.className = failed === 0 ? 'ok-text' : 'err-text';
      summary.textContent = passed + ' / ' + total + ' 통과 (엔진 ' + engReport.passed + '/' + engReport.total + ', AI ' + aiReport.passed + '/' + aiReport.total + ', 메타 ' + stReport.passed + '/' + stReport.total + ')';

      list.innerHTML = '';
      for (const item of engReport.results.concat(aiReport.results).concat(stReport.results)) {
        const div = document.createElement('div');
        div.className = 'test-item' + (item.pass ? '' : ' fail');
        const left = document.createElement('span');
        left.textContent = item.id + '. ' + item.name + (item.error ? ' — ' + item.error : '');
        const right = document.createElement('span');
        right.className = 'test-status ' + (item.pass ? 'ok-text' : 'err-text');
        right.textContent = item.pass ? 'PASS' : 'FAIL';
        div.appendChild(left);
        div.appendChild(right);
        list.appendChild(div);
      }

      if (aiReport.tournament) {
        const t = aiReport.tournament;
        const lines = [
          'AI 1,000판 토너먼트: 총 ' + t.totalElapsedMs + 'ms (평균 ' + t.avgGameMs + 'ms/판, 최대 수 ' + t.maxMoveMs + 'ms)'
        ];
        for (const s of t.series2P) {
          lines.push(s.matchup + ': ' + s.winRateA + '% vs ' + s.winRateB + '% (' + s.winsA + '승 ' + s.winsB + '패)');
        }
        const s3 = t.series3P;
        lines.push(s3.matchup + ': 어려움 ' + s3.winRateHard + '% / 보통 ' + s3.winRateNormal + '% / 쉬움 ' + s3.winRateEasy + '%');
        tourOut.classList.remove('hidden');
        tourOut.textContent = lines.join('\n');
      }
      console.log('[GoStop Tests] ' + passed + '/' + total + ' PASSED');
    }

      const eng = runEngineTests();
      const ai = runAITests();
      const st = runStoreTests();
      renderTestView(eng, ai, st);
    }

    function installTouchIcon() {
      try {
        const link = document.getElementById('appleTouchIcon');
        if (!link || typeof document === 'undefined' || typeof Image === 'undefined') return;
        const svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='36' fill='#0d3b26'/><rect x='34' y='20' width='124' height='152' rx='14' fill='#fbf6ec' stroke='#d97706' stroke-width='6'/><circle cx='120' cy='58' r='22' fill='#dc2626'/><text x='96' y='138' text-anchor='middle' font-size='44' font-weight='900' fill='#18181b'>맞고</text></svg>";
        const img = new Image();
        img.onload = () => {
          try {
            const c = document.createElement('canvas');
            c.width = 192;
            c.height = 192;
            const ctx = c.getContext('2d');
            if (ctx) {
              ctx.drawImage(img, 0, 0, 192, 192);
              link.href = c.toDataURL('image/png');
            }
          } catch (_) {}
        };
        img.src = 'data:image/svg+xml,' + encodeURIComponent(svg);
      } catch (_) {}
    }

    function init() {
      if (typeof document === 'undefined') return;
      Store.migrate();
      installTouchIcon();

      const savedMode = Store.get('lobbyMode', null);
      lobbyMode = (savedMode != null ? Number(savedMode) : Store.getSettings().defaultMode) === 3 ? 3 : 2;
      lobbyStageId = Store.getCareer().selectedStage || 0;
      lobbyOppId = Store.get('lobbyOppId', 'gwangryeol');
      if (AI.LEGACY_IDS[lobbyOppId]) {
        lobbyOppId = AI.LEGACY_IDS[lobbyOppId];
        Store.set('lobbyOppId', lobbyOppId);
      }
      lobbyOppId2 = Store.get('lobbyOppId2', 'jungmadam');
      if (AI.LEGACY_IDS[lobbyOppId2]) {
        lobbyOppId2 = AI.LEGACY_IDS[lobbyOppId2];
      }
      if (!AI.CHARACTERS.some(c => c.id === lobbyOppId2) || lobbyOppId2 === lobbyOppId) {
        lobbyOppId2 = (AI.CHARACTERS.find(c => c.id !== lobbyOppId) || AI.CHARACTERS[0]).id;
      }
      Store.set('lobbyOppId2', lobbyOppId2);

      document.getElementById('modeSeg').addEventListener('click', (e) => {
        const b = e.target.closest('[data-mode]');
        if (!b) return;
        lobbyMode = Number(b.dataset.mode);
        Store.set('lobbyMode', lobbyMode);
        renderLobby();
      });
      document.getElementById('attendanceBtn').addEventListener('click', () => {
        const res = Store.claimAttendance();
        if (res.ok) {
          FX.playSfx('win');
          showModal('<h3>출석 보상 수령!</h3><div class="modal-desc">' + res.streak + '일 연속 출석 보너스!<br><b style="color:var(--accent);">+' + res.reward.toLocaleString() + '원</b> 지급되었습니다.</div><div class="modal-btns single"><button id="okAtt" class="primary" type="button">확인</button></div>');
          document.getElementById('okAtt').onclick = () => { closeModal(); renderLobby(); };
        }
      });
      document.getElementById('reliefBtn').addEventListener('click', () => {
        const res = Store.claimRelief();
        if (res.ok) {
          FX.playSfx('win');
          showModal('<h3>파산 구제 지원!</h3><div class="modal-desc">하루 1회 구제 머니 <b style="color:var(--accent);">+' + res.reward.toLocaleString() + '원</b>이 지급되었습니다.</div><div class="modal-btns single"><button id="okRel" class="primary" type="button">확인</button></div>');
          document.getElementById('okRel').onclick = () => { closeModal(); renderLobby(); };
        }
      });
      document.getElementById('startNewBtn').addEventListener('click', startNewMatch);
      document.getElementById('continueBtn').addEventListener('click', () => {
        const saved = Store.get('activeMatch', null);
        if (!saved) return;
        isBusy = false;
        match = saved;
        if (!match.roundMetrics) match.roundMetrics = { jjok: 0, ttadak: 0, sweep: 0, ppeok: 0 };
        selectedCardId = null;
        enterGameView();
      });
      document.getElementById('openMissionsBtn').addEventListener('click', openMissionsModal);
      document.getElementById('openCosmeticsBtn').addEventListener('click', openCosmeticsModal);
      document.getElementById('openSettingsBtn').addEventListener('click', openSettingsModal);
      document.getElementById('tableSettingsBtn').addEventListener('click', openSettingsModal);
      document.getElementById('openStatsBtn').addEventListener('click', openStatsModal);
      document.getElementById('exitLobbyBtn').addEventListener('click', () => {
        if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; }
        isBusy = false;
        saveActiveMatch();
        renderLobby();
      });
      document.getElementById('floorZone').addEventListener('click', () => {
        if (!match || !selectedCardId || isBusy) return;
        if (match.gameState.turn !== 0 || match.gameState.phase !== 'PLAY_HAND') return;
        const card = match.gameState.players[0].hand.find(c => c.id === selectedCardId);
        if (!card) return;
        const sourceEl = document.querySelector('#myHandRow [data-card-id="' + card.id + '"]');
        selectedCardId = null;
        handleHumanCardPlay(card, sourceEl);
      });
      document.getElementById('rerunTestsBtn').addEventListener('click', openTestView);
      document.getElementById('goLobbyFromTestBtn').addEventListener('click', renderLobby);

      const params = new URLSearchParams(location.search || '');
      if (params.get('test') === '1') {
        openTestView();
      } else {
        renderLobby();
      }

      if (
        typeof navigator !== 'undefined' &&
        'serviceWorker' in navigator &&
        (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    }

    return { init, renderLobby, renderTable, openTestView };
  })();

  if (typeof window !== 'undefined') {
    window.Engine = Engine;
    window.AI = AI;
    window.Store = Store;
    window.CardArt = CardArt;
    window.FX = FX;
    window.runEngineTests = runEngineTests;
    window.runAITests = runAITests;
    window.runStoreTests = runStoreTests;
    window.addEventListener('DOMContentLoaded', UI.init);
  }
  </script>
</body>
</html>
