      { id: 'a_gwangbak_10', name: '광박 장인', desc: '상대에게 광박 10회 씌우기', reward: 20000, target: 10, getVal: (s) => s.combos.gwangbakGiven },
      { id: 'a_shake_bomb_10', name: '폭풍 승부사', desc: '흔들기/폭탄 승리 10회', reward: 18000, target: 10, getVal: (s) => s.combos.shake + s.combos.bomb },
      { id: 'a_high_roller', name: '큰손 입성', desc: '커리어 큰손 판 해금', reward: 50000, target: 4, getVal: (s, c) => c.unlockedStage }
    ]);

    function get(key, fallback = null) {
      try {
        if (typeof localStorage === 'undefined') return fallback;
        const raw = localStorage.getItem(PREFIX + key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch (_) {
        return fallback;
      }
    }
    function set(key, value) {
      try {
        if (typeof localStorage === 'undefined') return false;
        localStorage.setItem(PREFIX + key, JSON.stringify(value));
        return true;
      } catch (_) {
        return false;
      }
    }
    function remove(key) {
      try {
        if (typeof localStorage === 'undefined') return;
        localStorage.removeItem(PREFIX + key);
      } catch (_) {}
    }

    function getTodayDateStr(dateObj) {
      const d = dateObj || new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }

    function getYesterdayDateStr(dateObj) {
      const d = dateObj ? new Date(dateObj.getTime()) : new Date();
      d.setDate(d.getDate() - 1);
      return getTodayDateStr(d);
    }

    const DEFAULT_SETTINGS = Object.freeze({
      highlightMatches: true,
      fastAnim: false,
      soundEnabled: true,
      vibrateEnabled: true,
      bgmEnabled: false,
      defaultMode: 2,
      defaultStake: 0,
      difficulty: 'auto'
    });

    const DEFAULT_RULE_OPTIONS = Object.freeze({
      bonusCardCount: 'auto',
      bonusCardType: 'double_only',
      gukjinRule: 'auto_best',
      winScoreTarget2P: 7,
      winScoreTarget3P: 3,
      firstTurnMethod: 'highest_month',
      pibakThreshold2P: 7,
      pibakThreshold3P: 5,
      meongttaEnabled: true,
      nagariMultiplier: true,
      nagariMaxStack: 4,
      chongtongWin: true,
      firstPpeokBonus: false,
      twoPpeokBonus: false,
      threePpeokWin: true,
      jaPpeokSteal: 2,
      goScoreAdd: true,
      multiGoGobakRule: 'last_go_solo',
      loserShakeApplies: false,
      allowDebt: false,
      redealOnFloorChongtong: true,
      alwaysChooseTwoCards: false
    });

    function defaultStats() {
      return {
        totalGames: 0,
        wins: 0,
        losses: 0,
        nagari: 0,
        bestScore: 0,
        maxWonAmount: 0,
        maxGo: 0,
        winStreak: 0,
        bestWinStreak: 0,
        byCharacter: {},
        combos: {
          fiveBright: 0,
          fourBright: 0,
          threeBright: 0,
          biThreeBright: 0,
          godori: 0,
          hongdan: 0,
          cheongdan: 0,
          chodan: 0,
          shake: 0,
          bomb: 0,
          jjok: 0,
          ttadak: 0,
          sweep: 0,
          ppeok: 0,
          pibakGiven: 0,
          gwangbakGiven: 0
        }
      };
    }

    function migrate() {
      const ver = Number(get('schemaVersion', 1)) || 1;
      // Ensure defaults & merge safely from v1 -> v2
      const settings = Object.assign({}, DEFAULT_SETTINGS, get('settings', {}) || {});
      set('settings', settings);
      const ruleOpts = Object.assign({}, DEFAULT_RULE_OPTIONS, get('ruleOptions', {}) || {});
      set('ruleOptions', ruleOpts);

      if (get('wallet', null) === null) set('wallet', { coins: 100000 });

      const curStats = get('stats', {}) || {};
      const base = defaultStats();
      const mergedStats = Object.assign({}, base, curStats, {
        combos: Object.assign({}, base.combos, curStats.combos || {})
      });
      set('stats', mergedStats);

      if (!get('career', null)) {
        set('career', { unlockedStage: 0, selectedStage: 0 });
      }
      if (!get('cosmetics', null)) {
        set('cosmetics', {
          cardTheme: 'photo',
          tableTheme: 'felt_green',
          unlockedCards: ['photo', 'classic'],
          unlockedTables: ['felt_green']
        });
      }
      if (!get('attendance', null)) set('attendance', { lastDate: null, streak: 0 });
      if (!get('relief', null)) set('relief', { lastDate: null });
      if (!get('achievements', null)) set('achievements', { claimed: {} });

      if (ver < 3) {
        // v3: 실사 화투패(위키미디어 공용) 테마 추가 → 기존 기본값 사용자는 자동 전환
        const cos = get('cosmetics', null);
        if (cos && typeof cos === 'object') {
          if (!Array.isArray(cos.unlockedCards)) cos.unlockedCards = ['classic'];
          if (cos.unlockedCards.indexOf('photo') < 0) cos.unlockedCards.push('photo');
          if (!cos.cardTheme || cos.cardTheme === 'classic') cos.cardTheme = 'photo';
          set('cosmetics', cos);
        }
      }

      if (ver < SCHEMA_VERSION) {
        set('schemaVersion', SCHEMA_VERSION);
      } else if (get('schemaVersion', null) === null) {
        set('schemaVersion', SCHEMA_VERSION);
      }
      return SCHEMA_VERSION;
    }

    function resetAllData() {
      try {
        if (typeof localStorage !== 'undefined') {
          const toDelete = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.indexOf(PREFIX) === 0) toDelete.push(k);
          }
          for (const k of toDelete) localStorage.removeItem(k);
        }
      } catch (_) {}
      migrate();
    }

    function getSettings() {
      return Object.assign({}, DEFAULT_SETTINGS, get('settings', {}) || {});
    }
    function saveSettings(s) {
      return set('settings', Object.assign({}, DEFAULT_SETTINGS, s));
    }
    function getRuleOptions() {
      return Object.assign({}, DEFAULT_RULE_OPTIONS, get('ruleOptions', {}) || {});
    }
    function saveRuleOptions(opts) {
      return set('ruleOptions', Object.assign({}, DEFAULT_RULE_OPTIONS, opts));
    }
    function buildEngineRuleConfig(playerCount) {
      const o = getRuleOptions();
      const out = Object.assign({}, o);
      if (out.bonusCardCount === 'auto' || out.bonusCardCount == null) {
        out.bonusCardCount = playerCount === 3 ? 0 : 2;
      } else {
        out.bonusCardCount = Number(out.bonusCardCount);
      }
      if (out.nagariMaxStack === 'Infinity' || Number(out.nagariMaxStack) >= 99) {
        out.nagariMaxStack = Infinity;
      } else {
        out.nagariMaxStack = Number(out.nagariMaxStack);
      }
      return out;
    }
    function getWallet() {
      const w = get('wallet', null);
      return w && typeof w.coins === 'number' ? w.coins : 100000;
    }
    function setWallet(coins) {
      const val = Math.max(0, Math.round(coins));
      set('wallet', { coins: val });
      updateCareerUnlocks(val);
      return val;
    }
    function getCareer() {
      return Object.assign({ unlockedStage: 0, selectedStage: 0 }, get('career', {}) || {});
    }
    function updateCareerUnlocks(coins) {
      const c = getCareer();
      let changed = false;
      for (const st of CAREER_STAGES) {
        if (coins >= st.minCoins && st.id > c.unlockedStage) {
          c.unlockedStage = st.id;
          changed = true;
        }
      }
      if (changed) set('career', c);
      return c;
    }
    function selectCareerStage(stageId) {
      const c = getCareer();
      c.selectedStage = stageId;
      set('career', c);
      return c;
    }

    function getCosmetics() {
      return Object.assign({
        cardTheme: 'photo',
        tableTheme: 'felt_green',
        unlockedCards: ['photo', 'classic'],
        unlockedTables: ['felt_green']
      }, get('cosmetics', {}) || {});
    }
    function saveCosmetics(cos) {
      return set('cosmetics', cos);
    }

    // 캐릭터 대사 직접 편집 (사용자 입력)
    function getCustomLines() {
      const v = get('customLines', null);
      return v && typeof v === 'object' ? v : {};
    }
    function saveCustomLines(lines) {
      const out = {};
      if (lines && typeof lines === 'object') {
        for (const cid of Object.keys(lines)) {
          const bySit = lines[cid];
          if (!bySit || typeof bySit !== 'object') continue;
          const cleaned = {};
          for (const sit of Object.keys(bySit)) {
            const arr = bySit[sit];
            if (!Array.isArray(arr)) continue;
            const lines2 = arr.map(t => String(t).trim()).filter(t => t.length > 0);
            if (lines2.length) cleaned[sit] = lines2;
          }
          if (Object.keys(cleaned).length) out[cid] = cleaned;
        }
      }
      set('customLines', out);
      return out;
    }

    function getStats() {
      const cur = get('stats', {}) || {};
      const base = defaultStats();
      return Object.assign({}, base, cur, {
        combos: Object.assign({}, base.combos, cur.combos || {})
      });
    }

    // --- Daily Attendance & Bankruptcy Relief ---
    function canClaimAttendance(dateObj) {
      const today = getTodayDateStr(dateObj);
      const att = get('attendance', { lastDate: null, streak: 0 });
      return att.lastDate !== today;
    }
    function claimAttendance(dateObj) {
      const today = getTodayDateStr(dateObj);
      const yesterday = getYesterdayDateStr(dateObj);
      const att = get('attendance', { lastDate: null, streak: 0 });
      if (att.lastDate === today) return { ok: false, reason: 'already_claimed', streak: att.streak, reward: 0 };
      const nextStreak = att.lastDate === yesterday ? att.streak + 1 : 1;
      const reward = Math.min(50000, 10000 + (nextStreak - 1) * 5000);
      set('attendance', { lastDate: today, streak: nextStreak });
      const newCoins = setWallet(getWallet() + reward);
      return { ok: true, streak: nextStreak, reward, coins: newCoins };
    }

    function canClaimRelief(dateObj) {
      const today = getTodayDateStr(dateObj);
      const rel = get('relief', { lastDate: null });
      return rel.lastDate !== today && getWallet() < 5000;
    }
    function claimRelief(dateObj) {
      const today = getTodayDateStr(dateObj);
      const rel = get('relief', { lastDate: null });
      if (rel.lastDate === today) return { ok: false, reason: 'already_claimed', reward: 0 };
      if (getWallet() >= 5000) return { ok: false, reason: 'enough_coins', reward: 0 };
      const reward = 30000;
      set('relief', { lastDate: today });
      const newCoins = setWallet(getWallet() + reward);
      return { ok: true, reward, coins: newCoins };
    }

    // --- Daily Missions (3/day, midnight reset via local YYYY-MM-DD) ---
    function getDailyMissions(dateObj) {
      const today = getTodayDateStr(dateObj);
      const saved = get('dailyMissions', null);
      if (saved && saved.date === today && Array.isArray(saved.tasks)) {
        return saved;
      }
      // Deterministic pick 3 missions for today
      let seed = 0;
      for (let i = 0; i < today.length; i++) seed = (seed * 31 + today.charCodeAt(i)) >>> 0;
      const pool = MISSION_POOL.slice();
      for (let i = pool.length - 1; i > 0; i--) {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        const j = seed % (i + 1);
        const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
      }
      const tasks = pool.slice(0, 3).map(m => ({
        id: m.id,
        title: m.title,
        target: m.target,
        reward: m.reward,
        metric: m.metric,
        progress: 0,
        claimed: false
      }));
      const fresh = { date: today, tasks };
      set('dailyMissions', fresh);
      return fresh;
    }

    function updateDailyMissions(deltaMetrics, dateObj) {
      const dm = getDailyMissions(dateObj);
      for (const t of dm.tasks) {
        const inc = deltaMetrics[t.metric] || 0;
        if (inc > 0) {
          t.progress = Math.min(t.target, t.progress + inc);
        }
      }
      set('dailyMissions', dm);
      return dm;
    }

    function claimMission(missionId, dateObj) {
      const dm = getDailyMissions(dateObj);
      const t = dm.tasks.find(x => x.id === missionId);
      if (!t || t.claimed || t.progress < t.target) return { ok: false, reward: 0 };
      t.claimed = true;
      set('dailyMissions', dm);
      const coins = setWallet(getWallet() + t.reward);
      return { ok: true, reward: t.reward, coins };
    }

    // --- Achievements (24) ---
    function getAchievementsProgress() {
      const st = getStats();
      const car = getCareer();
      const saved = get('achievements', { claimed: {} });
      return ACHIEVEMENTS.map(a => {
        const cur = Math.min(a.target, a.getVal(st, car) || 0);
        return {
          id: a.id,
          name: a.name,
          desc: a.desc,
          reward: a.reward,
          cur,
          target: a.target,
          unlocked: cur >= a.target,
          claimed: !!(saved.claimed && saved.claimed[a.id])
        };
      });
    }

    function claimAchievement(achId) {
      const list = getAchievementsProgress();
      const item = list.find(a => a.id === achId);
      if (!item || !item.unlocked || item.claimed) return { ok: false, reward: 0 };
      const saved = get('achievements', { claimed: {} });
      saved.claimed[achId] = true;
      set('achievements', saved);
      const coins = setWallet(getWallet() + item.reward);
      return { ok: true, reward: item.reward, coins };
    }

    function getUnlockedAchievementCount() {
      return getAchievementsProgress().filter(a => a.unlocked).length;
    }

    function recordRoundOutcome(gameState, oppCharId, roundMetrics) {
      const st = getStats();
      const s = gameState.settlement;
      const human = gameState.players[0];
      const m = roundMetrics || {};
      st.totalGames += 1;
      if (!st.byCharacter[oppCharId]) st.byCharacter[oppCharId] = { wins: 0, losses: 0, nagari: 0 };

      let isWin = false;
      let sc = null;
      if (s && !s.isNagari && s.winner === 0) {
        isWin = true;
        sc = s.score;
        st.wins += 1;
        st.winStreak += 1;
        if (st.winStreak > st.bestWinStreak) st.bestWinStreak = st.winStreak;
        if (sc.totalScore > st.bestScore) st.bestScore = sc.totalScore;
        if (s.totalWon > st.maxWonAmount) st.maxWonAmount = s.totalWon;
        if (human.goCount > st.maxGo) st.maxGo = human.goCount;
        st.byCharacter[oppCharId].wins += 1;

        if (sc.brightCount === 5) st.combos.fiveBright += 1;
        else if (sc.brightCount === 4) st.combos.fourBright += 1;
        else if (sc.brightCount === 3) {
          if (human.captured.bright.some(c => c.subType === 'bi')) st.combos.biThreeBright += 1;
          else st.combos.threeBright += 1;
        }
        if (sc.godoriScore > 0) st.combos.godori += 1;
        if (sc.hongScore > 0) st.combos.hongdan += 1;
        if (sc.cheongScore > 0) st.combos.cheongdan += 1;
        if (sc.choScore > 0) st.combos.chodan += 1;
        if (human.shakeMonths.length > 0) st.combos.shake += human.shakeMonths.length;
        if (human.bombMonths.length > 0) st.combos.bomb += human.bombMonths.length;
        for (const p of s.payments) {
          if (p.isPibak) st.combos.pibakGiven += 1;
          if (p.isGwangbak) st.combos.gwangbakGiven += 1;
        }
      } else if (!s || s.isNagari) {
        st.nagari += 1;
        st.byCharacter[oppCharId].nagari += 1;
      } else {
        st.losses += 1;
        st.winStreak = 0;
        st.byCharacter[oppCharId].losses += 1;
      }

      st.combos.jjok += m.jjok || 0;
      st.combos.ttadak += m.ttadak || 0;
      st.combos.sweep += m.sweep || 0;
      st.combos.ppeok += m.ppeok || 0;
      set('stats', st);

      const bakGiven = isWin && s.payments.some(p => p.isPibak || p.isGwangbak) ? 1 : 0;
      const shakeBombWin = isWin && (human.shakeMonths.length + human.bombMonths.length > 0) ? 1 : 0;
      const pi15Win = isWin && sc && sc.piCount >= 15 ? 1 : 0;
      const goWin = isWin && human.goCount >= 1 ? 1 : 0;

      updateDailyMissions({
        gamesToday: 1,
        winsToday: isWin ? 1 : 0,
        shakeBombWinsToday: shakeBombWin,
        pi15WinsToday: pi15Win,
        goWinsToday: goWin,
        jjokTtadakToday: (m.jjok || 0) + (m.ttadak || 0),
        sweepsToday: m.sweep || 0,
        bakGivenToday: bakGiven
      });

      return st;
    }

    function recordGameStats(winnerId, humanScore, humanGoCount, oppCharId) {
      const st = getStats();
      st.totalGames += 1;
      if (!st.byCharacter[oppCharId]) st.byCharacter[oppCharId] = { wins: 0, losses: 0, nagari: 0 };
      if (winnerId === 0) {
        st.wins += 1;
        st.winStreak += 1;
        if (st.winStreak > st.bestWinStreak) st.bestWinStreak = st.winStreak;
        if (humanScore > st.bestScore) st.bestScore = humanScore;
        if (humanGoCount > st.maxGo) st.maxGo = humanGoCount;
        st.byCharacter[oppCharId].wins += 1;
      } else if (winnerId === null) {
        st.nagari += 1;
        st.byCharacter[oppCharId].nagari += 1;
      } else {
        st.losses += 1;
        st.winStreak = 0;
        st.byCharacter[oppCharId].losses += 1;
      }
      set('stats', st);
      return st;
    }

    migrate();

    return {
      PREFIX,
      SCHEMA_VERSION,
      CAREER_STAGES,
      CARD_THEMES,
      TABLE_THEMES,
      MISSION_POOL,
      ACHIEVEMENTS,
      DEFAULT_SETTINGS,
      DEFAULT_RULE_OPTIONS,
      get,
      set,
      remove,
      migrate,
      resetAllData,
      getTodayDateStr,
      getSettings,
      saveSettings,
      getRuleOptions,
      saveRuleOptions,
      buildEngineRuleConfig,
      getWallet,
      setWallet,
      getCareer,
      updateCareerUnlocks,
      selectCareerStage,
      getCosmetics,
      saveCosmetics,
      getCustomLines,
      saveCustomLines,
      getStats,
      canClaimAttendance,
      claimAttendance,
      canClaimRelief,
      claimRelief,
      getDailyMissions,
      updateDailyMissions,
      claimMission,
      getAchievementsProgress,
      claimAchievement,
      getUnlockedAchievementCount,
      recordRoundOutcome,
      recordGameStats
    };
  })();

  /* =========================================================================
   * 2. Engine (Pure rules engine - ZERO DOM / Window / Storage access)
   * ========================================================================= */
  const Engine = (() => {
    // --- Seeded PRNG (Pure stateless Mulberry32) ---
    function hashSeed(seed) {
      if (typeof seed === 'number' && Number.isFinite(seed)) {
        return (seed >>> 0) || 1;
      }
      const str = String(seed == null ? 'gostop' : seed);
      let h = 2166136261 >>> 0;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return (h >>> 0) || 1;
    }

    function nextRand(rngState) {
      let t = (rngState + 0x6D2B79F5) >>> 0;
      const nextState = t;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      const value = ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      return { value, rngState: nextState };
    }

    function shuffleWithRng(items, rngState) {
      const arr = items.slice();
      let rState = rngState;
      for (let i = arr.length - 1; i > 0; i--) {
        const res = nextRand(rState);
        rState = res.rngState;
        const j = Math.floor(res.value * (i + 1));
        const tmp = arr[i];
        arr[i] = arr[j];
        arr[j] = tmp;
      }
      return { items: arr, rngState: rState };
    }

    // --- 48 Base Cards + Bonus Cards ---
    function mkCard(id, month, name, category, subType, piValue, isGukjin = false, isBonus = false) {
      return Object.freeze({
        id,
        month,
        name,
        category,   // 'bright' | 'animal' | 'ribbon' | 'junk' | 'bonus'
        subType,    // 'normal'|'bi'|'godori'|'gukjin'|'hong'|'cho'|'cheong'|'plain_ribbon'|'double'|'triple'
        piValue,
        isGukjin,
        isBonus,
        isEmptyBomb: false
      });
    }

    const CARDS_48 = Object.freeze([
      // 1월 (송학)
      mkCard('01-bright', 1, '1월 솔과 두루미', 'bright', 'normal', 0),
      mkCard('01-ribbon', 1, '1월 솔 홍단', 'ribbon', 'hong', 0),
      mkCard('01-junk-1', 1, '1월 솔 피1', 'junk', 'normal', 1),
      mkCard('01-junk-2', 1, '1월 솔 피2', 'junk', 'normal', 1),
      // 2월 (매조)
      mkCard('02-animal', 2, '2월 매화와 꾀꼬리', 'animal', 'godori', 0),
      mkCard('02-ribbon', 2, '2월 매화 홍단', 'ribbon', 'hong', 0),
      mkCard('02-junk-1', 2, '2월 매화 피1', 'junk', 'normal', 1),
      mkCard('02-junk-2', 2, '2월 매화 피2', 'junk', 'normal', 1),
      // 3월 (벚꽃)
      mkCard('03-bright', 3, '3월 벚꽃과 휘장', 'bright', 'normal', 0),
      mkCard('03-ribbon', 3, '3월 벚꽃 홍단', 'ribbon', 'hong', 0),
      mkCard('03-junk-1', 3, '3월 벚꽃 피1', 'junk', 'normal', 1),
      mkCard('03-junk-2', 3, '3월 벚꽃 피2', 'junk', 'normal', 1),
      // 4월 (흑싸리)
      mkCard('04-animal', 4, '4월 등나무와 두견새', 'animal', 'godori', 0),
      mkCard('04-ribbon', 4, '4월 등나무 초단', 'ribbon', 'cho', 0),
      mkCard('04-junk-1', 4, '4월 등나무 피1', 'junk', 'normal', 1),
      mkCard('04-junk-2', 4, '4월 등나무 피2', 'junk', 'normal', 1),
      // 5월 (난초)
      mkCard('05-animal', 5, '5월 붓꽃과 나무다리', 'animal', 'normal', 0),
      mkCard('05-ribbon', 5, '5월 붓꽃 초단', 'ribbon', 'cho', 0),
      mkCard('05-junk-1', 5, '5월 붓꽃 피1', 'junk', 'normal', 1),
      mkCard('05-junk-2', 5, '5월 붓꽃 피2', 'junk', 'normal', 1),
      // 6월 (모란)
      mkCard('06-animal', 6, '6월 모란과 나비', 'animal', 'normal', 0),
      mkCard('06-ribbon', 6, '6월 모란 청단', 'ribbon', 'cheong', 0),
      mkCard('06-junk-1', 6, '6월 모란 피1', 'junk', 'normal', 1),
      mkCard('06-junk-2', 6, '6월 모란 피2', 'junk', 'normal', 1),
      // 7월 (홍싸리)
      mkCard('07-animal', 7, '7월 싸리와 멧돼지', 'animal', 'normal', 0),
      mkCard('07-ribbon', 7, '7월 싸리 초단', 'ribbon', 'cho', 0),
      mkCard('07-junk-1', 7, '7월 싸리 피1', 'junk', 'normal', 1),
      mkCard('07-junk-2', 7, '7월 싸리 피2', 'junk', 'normal', 1),
      // 8월 (공산)
      mkCard('08-bright', 8, '8월 억새산과 보름달', 'bright', 'normal', 0),
      mkCard('08-animal', 8, '8월 공산과 기러기', 'animal', 'godori', 0),
      mkCard('08-junk-1', 8, '8월 공산 피1', 'junk', 'normal', 1),
      mkCard('08-junk-2', 8, '8월 공산 피2', 'junk', 'normal', 1),
      // 9월 (국화)
      mkCard('09-animal', 9, '9월 국화와 술잔(국진)', 'animal', 'gukjin', 0, true),
      mkCard('09-ribbon', 9, '9월 국화 청단', 'ribbon', 'cheong', 0),
      mkCard('09-junk-1', 9, '9월 국화 피1', 'junk', 'normal', 1),
      mkCard('09-junk-2', 9, '9월 국화 피2', 'junk', 'normal', 1),
      // 10월 (단풍)
      mkCard('10-animal', 10, '10월 단풍과 사슴', 'animal', 'normal', 0),
      mkCard('10-ribbon', 10, '10월 단풍 청단', 'ribbon', 'cheong', 0),
      mkCard('10-junk-1', 10, '10월 단풍 피1', 'junk', 'normal', 1),
      mkCard('10-junk-2', 10, '10월 단풍 피2', 'junk', 'normal', 1),
      // 11월 (오동)
      mkCard('11-bright', 11, '11월 오동과 봉황', 'bright', 'normal', 0),
      mkCard('11-double', 11, '11월 오동 쌍피', 'junk', 'double', 2),
      mkCard('11-junk-1', 11, '11월 오동 피1', 'junk', 'normal', 1),
      mkCard('11-junk-2', 11, '11월 오동 피2', 'junk', 'normal', 1),
      // 12월 (비)
      mkCard('12-bright', 12, '12월 비와 우산 선비', 'bright', 'bi', 0),
      mkCard('12-animal', 12, '12월 비와 제비', 'animal', 'normal', 0),
      mkCard('12-ribbon', 12, '12월 비 띠', 'ribbon', 'plain_ribbon', 0),
      mkCard('12-double', 12, '12월 비 쌍피', 'junk', 'double', 2)
    ]);

    const BONUS_POOL = Object.freeze({
      'bonus-1': mkCard('bonus-1', 0, '보너스 쌍피1', 'bonus', 'double', 2, false, true),
      'bonus-2': mkCard('bonus-2', 0, '보너스 쌍피2', 'bonus', 'double', 2, false, true),
      'bonus-3': mkCard('bonus-3', 0, '보너스 쌍피3', 'bonus', 'double', 2, false, true),
      'bonus-triple': mkCard('bonus-triple', 0, '보너스 쓰리피', 'bonus', 'triple', 3, false, true)
    });

    const CARDS_BY_ID = (() => {
      const map = Object.create(null);
      for (const c of CARDS_48) map[c.id] = c;
      for (const k of Object.keys(BONUS_POOL)) map[k] = BONUS_POOL[k];
      return Object.freeze(map);
    })();

    function resolveCard(ref) {
      if (!ref) return null;
      if (typeof ref === 'string') return CARDS_BY_ID[ref] || null;
      return ref;
    }

    function createEmptyBombCard(uid) {
      return Object.freeze({
        id: 'bomb-pass-' + uid,
        month: -1,
        name: '폭탄 패스',
        category: 'pass',
        subType: 'pass',
        piValue: 0,
        isGukjin: false,
        isBonus: false,
        isEmptyBomb: true
      });
    }

    // --- Config Normalization (RULES.md §10 Defaults) ---
    function normalizeConfig(rawConfig) {
      const c = rawConfig || {};
      const playerCount = c.playerCount === 3 ? 3 : 2;
      const defaultBonusCount = playerCount === 2 ? 2 : 0;
      const bonusCardCount = c.bonusCardCount != null ? c.bonusCardCount : defaultBonusCount;
      const initialCoins = Array.isArray(c.initialCoins)
        ? c.initialCoins.slice(0, playerCount)
        : new Array(playerCount).fill(100000);
      while (initialCoins.length < playerCount) initialCoins.push(100000);

      return Object.freeze({
        playerCount,
        unitPointValue: c.unitPointValue != null ? c.unitPointValue : 100,
        bonusCardCount,
        bonusCardType: c.bonusCardType || 'double_only', // 'double_only' | 'double_and_triple'
        gukjinRule: c.gukjinRule || 'auto_best',         // 'auto_best' | 'choose_once_on_score' | 'always_animal'
        winScoreTarget2P: c.winScoreTarget2P != null ? c.winScoreTarget2P : 7,
        winScoreTarget3P: c.winScoreTarget3P != null ? c.winScoreTarget3P : 3,
        firstTurnMethod: c.firstTurnMethod || 'highest_month', // 'highest_month' | 'lowest_month' | 'p0_fixed'
        pibakThreshold2P: c.pibakThreshold2P != null ? c.pibakThreshold2P : 7,
        pibakThreshold3P: c.pibakThreshold3P != null ? c.pibakThreshold3P : 5,
        meongttaEnabled: c.meongttaEnabled !== undefined ? c.meongttaEnabled : true, // true | false | 'zero_opponent'
        nagariMultiplier: c.nagariMultiplier !== undefined ? c.nagariMultiplier : true,
        nagariMaxStack: c.nagariMaxStack != null ? c.nagariMaxStack : 4, // 2 | 4 | Infinity
        chongtongWin: c.chongtongWin !== undefined ? c.chongtongWin : true,
        firstPpeokBonus: !!c.firstPpeokBonus,
        twoPpeokBonus: !!c.twoPpeokBonus,
        threePpeokWin: c.threePpeokWin !== undefined ? c.threePpeokWin : true,
        jaPpeokSteal: c.jaPpeokSteal != null ? c.jaPpeokSteal : 2,
        goScoreAdd: c.goScoreAdd !== undefined ? c.goScoreAdd : true,
        multiGoGobakRule: c.multiGoGobakRule || 'last_go_solo', // 'last_go_solo' | 'cancel_solo'
        loserShakeApplies: !!c.loserShakeApplies,
        allowDebt: !!c.allowDebt,
        redealOnFloorChongtong: c.redealOnFloorChongtong !== undefined ? c.redealOnFloorChongtong : true,
        alwaysChooseTwoCards: !!c.alwaysChooseTwoCards,
        previousNagariCount: c.previousNagariCount || 0,
        forcedFirstPlayer: c.forcedFirstPlayer != null ? c.forcedFirstPlayer : null,
        initialCoins,
        roundNumber: c.roundNumber || 1,
        recordLog: c.recordLog !== undefined ? c.recordLog : true
      });
    }

    function buildDeckCards(config) {
      const cards = CARDS_48.slice();
      const n = config.bonusCardCount;
      if (n >= 1) cards.push(BONUS_POOL['bonus-1']);
      if (n >= 2) {
        cards.push(config.bonusCardType === 'double_and_triple' ? BONUS_POOL['bonus-triple'] : BONUS_POOL['bonus-2']);
      }
      if (n >= 3) cards.push(BONUS_POOL['bonus-3']);
      return cards;
    }

    // --- Pure Structural State Clone ---
    function clonePlayer(p) {
      return {
        id: p.id,
        name: p.name,
        coins: p.coins,
        hand: p.hand.slice(),
        captured: {
          bright: p.captured.bright.slice(),
          animal: p.captured.animal.slice(),
          ribbon: p.captured.ribbon.slice(),
          junk: p.captured.junk.slice()
        },
        gukjinAsDoublePi: p.gukjinAsDoublePi,
        goCount: p.goCount,
        lastGoScore: p.lastGoScore,
        goOrder: p.goOrder,
        shakeMonths: p.shakeMonths.slice(),
        bombMonths: p.bombMonths.slice(),
        ppeokCount: p.ppeokCount,
        hadTurnCount: p.hadTurnCount,
        chongtongMonths: p.chongtongMonths.slice(),
        declinedChongtong: p.declinedChongtong,
        bonusPoints: p.bonusPoints
      };
    }

    function cloneState(state) {
      return {
        config: state.config,
        seed: state.seed,
        rngState: state.rngState,
        phase: state.phase,
        firstPlayer: state.firstPlayer,
        turn: state.turn,
        turnNumber: state.turnNumber,
        roundNumber: state.roundNumber,
        nagariStack: state.nagariStack,
        bombTokenSeq: state.bombTokenSeq,
        players: state.players.map(clonePlayer),
        floor: state.floor.slice(),
        ppeokMonths: Object.assign({}, state.ppeokMonths),
        deck: state.deck.slice(),
        pendingAction: state.pendingAction
          ? Object.assign({}, state.pendingAction, {
              options: state.pendingAction.options ? state.pendingAction.options.slice() : undefined,
              eventsSoFar: state.pendingAction.eventsSoFar ? state.pendingAction.eventsSoFar.slice() : undefined
            })
          : null,
        goSequence: state.goSequence,
        winner: state.winner,
        winReason: state.winReason,
        settlement: state.settlement,
        log: state.config.recordLog ? state.log.slice() : state.log
      };
    }

    function appendLog(state, msg) {
      if (state.config.recordLog) state.log.push(msg);
    }

    function getChongtongMonths(hand) {
      const counts = Object.create(null);
      for (const c of hand) {
        if (c.month >= 1 && c.month <= 12) {
          counts[c.month] = (counts[c.month] || 0) + 1;
        }
      }
      const res = [];
      for (const m in counts) {
        if (counts[m] === 4) res.push(Number(m));
      }
      return res;
    }

    // --- 밤일낮장 First Player Selection ---
    function pickFirstPlayer(config, rngState) {
      if (config.forcedFirstPlayer != null) {
        return { firstPlayer: config.forcedFirstPlayer % config.playerCount, rngState, drawInfo: null };
      }
      if (config.firstTurnMethod === 'p0_fixed') {
        return { firstPlayer: 0, rngState, drawInfo: null };
      }
      let rState = rngState;
      let candidates = [];
      for (let i = 0; i < config.playerCount; i++) candidates.push(i);
      let drawInfo = [];
      let safety = 0;
      while (candidates.length > 1 && safety < 20) {
        safety++;
        const shuf = shuffleWithRng(CARDS_48, rState);
        rState = shuf.rngState;
        const draws = candidates.map((pid, idx) => ({ pid, card: shuf.items[idx] }));
        drawInfo = draws;
        const targetMonth = config.firstTurnMethod === 'lowest_month'
          ? Math.min(...draws.map(d => d.card.month))
          : Math.max(...draws.map(d => d.card.month));
        candidates = draws.filter(d => d.card.month === targetMonth).map(d => d.pid);
      }
      return { firstPlayer: candidates[0] || 0, rngState: rState, drawInfo };
    }

    // --- Deal & Game Initialization ---
    function newGame(rawConfig, seed) {
      const config = normalizeConfig(rawConfig);
      const effectiveSeed = seed != null ? seed : 1;
      let rState = hashSeed(effectiveSeed);

      const fpRes = pickFirstPlayer(config, rState);
      rState = fpRes.rngState;
      const firstPlayer = fpRes.firstPlayer;

      const baseDeck = buildDeckCards(config);
      let players = [];
      let floor = [];
      let deck = [];
      let log = [];
      let isFloorChongtong = false;

      const maxRedeals = config.redealOnFloorChongtong ? 30 : 1;
      for (let attempt = 0; attempt < maxRedeals; attempt++) {
        const shuf = shuffleWithRng(baseDeck, rState);
        rState = shuf.rngState;
        const pool = shuf.items;
        let idx = 0;

        players = [];
        for (let i = 0; i < config.playerCount; i++) {
          players.push({
            id: i,
            name: 'P' + (i + 1),
            coins: config.initialCoins[i],
            hand: [],
            captured: { bright: [], animal: [], ribbon: [], junk: [] },
            gukjinAsDoublePi: false,
            goCount: 0,
            lastGoScore: 0,
            goOrder: 0,
            shakeMonths: [],
            bombMonths: [],
            ppeokCount: 0,
            hadTurnCount: 0,
            chongtongMonths: [],
            declinedChongtong: false,
            bonusPoints: 0
          });
        }
        floor = [];

        const order = [];
        for (let i = 0; i < config.playerCount; i++) {
          order.push((firstPlayer + i) % config.playerCount);
        }

        if (config.playerCount === 2) {
          for (let k = 0; k < 4; k++) floor.push(pool[idx++]);
          for (const pid of order) for (let k = 0; k < 5; k++) players[pid].hand.push(pool[idx++]);
          for (let k = 0; k < 4; k++) floor.push(pool[idx++]);
          for (const pid of order) for (let k = 0; k < 5; k++) players[pid].hand.push(pool[idx++]);
        } else {
          for (let k = 0; k < 3; k++) floor.push(pool[idx++]);
          for (const pid of order) for (let k = 0; k < 4; k++) players[pid].hand.push(pool[idx++]);
          for (let k = 0; k < 3; k++) floor.push(pool[idx++]);
          for (const pid of order) for (let k = 0; k < 3; k++) players[pid].hand.push(pool[idx++]);
        }
        deck = pool.slice(idx);

        // Edge Case #24: Replace initial bonus cards on floor to firstPlayer's junk
        for (let i = floor.length - 1; i >= 0; i--) {
          if (floor[i].isBonus) {
            const bCard = floor.splice(i, 1)[0];
            players[firstPlayer].captured.junk.push(bCard);
            if (config.recordLog) {
              log.push('초기 바닥 보너스패(' + bCard.name + ') → ' + players[firstPlayer].name + ' 획득');
            }
            while (deck.length > 0) {
              const rep = deck.shift();
              if (rep.isBonus) {
                players[firstPlayer].captured.junk.push(rep);
                if (config.recordLog) {
                  log.push('보충 보너스패(' + rep.name + ') → ' + players[firstPlayer].name + ' 획득');
                }
              } else {
                floor.push(rep);
                break;
              }
            }
          }
        }

        // Check floor 4-of-a-kind (바닥 총통)
        const floorCounts = Object.create(null);
        isFloorChongtong = false;
        for (const c of floor) {
          floorCounts[c.month] = (floorCounts[c.month] || 0) + 1;
          if (floorCounts[c.month] === 4) {
            isFloorChongtong = true;
            break;
          }
        }
        if (isFloorChongtong) {
          if (config.recordLog) log.push('바닥 총통 발생 — 나가리 배수 미적립, 재시작');
          if (!config.redealOnFloorChongtong) break;
          continue;
        }
        break;
      }

      for (const p of players) {
        p.chongtongMonths = getChongtongMonths(p.hand);
      }

      if (config.recordLog && fpRes.drawInfo) {
        log.unshift(
          '선 정하기(밤일낮장): ' +
            fpRes.drawInfo.map(d => 'P' + (d.pid + 1) + '=' + d.card.month + '월').join(', ') +
            ' → 선: P' + (firstPlayer + 1)
        );
      }

      const state = {
        config,
        seed: effectiveSeed,
        rngState: rState,
        phase: 'PLAY_HAND',
        firstPlayer,
        turn: firstPlayer,
        turnNumber: 1,
        roundNumber: config.roundNumber,
        nagariStack: config.previousNagariCount,
        bombTokenSeq: 0,
        players,
        floor,
        ppeokMonths: {},
        deck,
        pendingAction: null,
        goSequence: 0,
        winner: null,
        winReason: null,
        settlement: null,
        log
      };

      if (isFloorChongtong && !config.redealOnFloorChongtong) {
        state.phase = 'GAME_OVER';
        state.winner = null;
        state.winReason = 'floor_chongtong';
        state.settlement = settle(state);
        return state;
      }

      if (config.chongtongWin && players[firstPlayer].chongtongMonths.length > 0) {
        state.phase = 'CHONGTONG_CHOICE';
        state.pendingAction = {
          type: 'CHONGTONG_CHOICE',
          playerId: firstPlayer,
          months: players[firstPlayer].chongtongMonths.slice()
        };
      }

      return state;
    }

    // --- Helper to build arbitrary deterministic scenarios for testing ---
    function createCustomState(opts) {
      const config = normalizeConfig(opts.config || {});
      const players = [];
      for (let i = 0; i < config.playerCount; i++) {
        const src = (opts.players && opts.players[i]) || {};
        const cap = src.captured || {};
        const hand = (src.hand || []).map(resolveCard);
        players.push({
          id: i,
          name: src.name || 'P' + (i + 1),
          coins: src.coins != null ? src.coins : config.initialCoins[i],
          hand,
          captured: {
            bright: (cap.bright || []).map(resolveCard),
            animal: (cap.animal || []).map(resolveCard),
            ribbon: (cap.ribbon || []).map(resolveCard),
            junk: (cap.junk || []).map(resolveCard)
          },
          gukjinAsDoublePi: !!src.gukjinAsDoublePi,
          goCount: src.goCount || 0,
          lastGoScore: src.lastGoScore || 0,
          goOrder: src.goOrder || 0,
          shakeMonths: src.shakeMonths ? src.shakeMonths.slice() : [],
          bombMonths: src.bombMonths ? src.bombMonths.slice() : [],
          ppeokCount: src.ppeokCount || 0,
          hadTurnCount: src.hadTurnCount || 0,
          chongtongMonths: src.chongtongMonths ? src.chongtongMonths.slice() : getChongtongMonths(hand),
          declinedChongtong: !!src.declinedChongtong,
          bonusPoints: src.bonusPoints || 0
        });
      }

      const state = {
        config,
        seed: opts.seed || 1,
        rngState: hashSeed(opts.seed || 1),
        phase: opts.phase || 'PLAY_HAND',
        firstPlayer: opts.firstPlayer || 0,
        turn: opts.turn != null ? opts.turn : (opts.firstPlayer || 0),
        turnNumber: opts.turnNumber || 1,
        roundNumber: opts.roundNumber || 1,
        nagariStack: opts.nagariStack != null ? opts.nagariStack : config.previousNagariCount,
        bombTokenSeq: opts.bombTokenSeq || 0,
        players,
        floor: (opts.floor || []).map(resolveCard),
        ppeokMonths: Object.assign({}, opts.ppeokMonths || {}),
        deck: (opts.deck || []).map(resolveCard),
        pendingAction: opts.pendingAction || null,
        goSequence: opts.goSequence || 0,
        winner: opts.winner !== undefined ? opts.winner : null,
        winReason: opts.winReason || null,
        settlement: null,
        log: opts.log ? opts.log.slice() : []
      };

      if (state.phase === 'PLAY_HAND' && config.chongtongWin) {
        const cur = state.players[state.turn];
        if (cur && cur.hadTurnCount === 0 && cur.chongtongMonths.length > 0 && !cur.declinedChongtong) {
          state.phase = 'CHONGTONG_CHOICE';
          state.pendingAction = {
            type: 'CHONGTONG_CHOICE',
            playerId: cur.id,
            months: cur.chongtongMonths.slice()
          };
        }
      }
      if (state.phase === 'GAME_OVER') {
        state.settlement = settle(state);
      }
      return state;
    }

    // --- Scoring (RULES.md §5 & §1.1.2) ---
    function evalScoreWithGukjinMode(player, config, useGukjinAsDouble) {
      const cap = player.captured;
      const brights = cap.bright;
      const animals = useGukjinAsDouble ? cap.animal.filter(c => !c.isGukjin) : cap.animal;
      const ribbons = cap.ribbon;
      const junks = cap.junk;

      // Bright (max 1 combo)
      let brightScore = 0;
      const brightCount = brights.length;
      const hasBi = brights.some(c => c.subType === 'bi');
      if (brightCount === 5) brightScore = 15;
      else if (brightCount === 4) brightScore = 4;
      else if (brightCount === 3) brightScore = hasBi ? 2 : 3;

      // Animal (Godori + count>=5)
      const godoriCount = animals.filter(c => c.subType === 'godori').length;
      const godoriScore = godoriCount === 3 ? 5 : 0;
      const animalCountScore = animals.length >= 5 ? animals.length - 4 : 0;
      const animalScore = godoriScore + animalCountScore;

      // Ribbon (Hong/Cho/Cheong + count>=5)
      const hongScore = ribbons.filter(c => c.subType === 'hong').length === 3 ? 3 : 0;
      const choScore = ribbons.filter(c => c.subType === 'cho').length === 3 ? 3 : 0;
      const cheongScore = ribbons.filter(c => c.subType === 'cheong').length === 3 ? 3 : 0;
      const ribbonCountScore = ribbons.length >= 5 ? ribbons.length - 4 : 0;
      const ribbonScore = hongScore + choScore + cheongScore + ribbonCountScore;

      // Junk (piSum >= 10)
      let piCount = 0;
      for (const c of junks) piCount += c.piValue;
      if (useGukjinAsDouble) piCount += 2;
      const piScore = piCount >= 10 ? piCount - 9 : 0;

      const bonusPoints = player.bonusPoints || 0;
      const baseScore = brightScore + animalScore + ribbonScore + piScore + bonusPoints;
      const goAddScore = config.goScoreAdd ? player.goCount : 0;
      const totalScore = baseScore + goAddScore;

      return {
        totalScore,
        baseScore,
        goAddScore,
        bonusPoints,
        brightScore,
        animalScore,
        godoriScore,
        animalCountScore,
        ribbonScore,
        hongScore,
        choScore,
        cheongScore,
        ribbonCountScore,
        piScore,
        brightCount,
        animalCount: animals.length,
        ribbonCount: ribbons.length,
        piCount,
        gukjinAsDouble: useGukjinAsDouble
      };
    }

    function scoreOf(state, playerId, overrideGukjinAsDouble = null) {
      const player = state.players[playerId];
      const config = state.config;
      const hasGukjin = player.captured.animal.some(c => c.isGukjin);
      if (!hasGukjin) {
        return evalScoreWithGukjinMode(player, config, false);
      }
      if (overrideGukjinAsDouble !== null) {
        return evalScoreWithGukjinMode(player, config, !!overrideGukjinAsDouble);
      }
      if (config.gukjinRule === 'always_animal') {
        return evalScoreWithGukjinMode(player, config, false);
      }
      if (config.gukjinRule === 'choose_once_on_score') {
        return evalScoreWithGukjinMode(player, config, !!player.gukjinAsDoublePi);
      }
      // Default: 'auto_best' — highest score, tie-break double pi
      const asAnimal = evalScoreWithGukjinMode(player, config, false);
      const asDouble = evalScoreWithGukjinMode(player, config, true);
      return asDouble.baseScore >= asAnimal.baseScore ? asDouble : asAnimal;
    }

    // UI 표시용: 국진이 실제로 열끗/쌍피 중 어느 쪽으로 계산됐는지.
    // 'double' | 'animal' | null
    function gukjinSideOf(state, playerId) {
      const p = state.players[playerId];
      if (!p || !p.captured.animal.some(c => c.isGukjin)) return null;
      return scoreOf(state, playerId).gukjinAsDouble ? 'double' : 'animal';
    }

    function canDeclare(state, playerId) {
      const player = state.players[playerId];
      const config = state.config;
      const scoreInfo = scoreOf(state, playerId);
      const target = config.playerCount === 2 ? config.winScoreTarget2P : config.winScoreTarget3P;
      const scoreIncreased = player.goCount === 0 || scoreInfo.totalScore > player.lastGoScore;
      const isLastCardPending = player.hand.length <= 1;

      const monthCounts = Object.create(null);
      const floorCounts = Object.create(null);
      for (const c of player.hand) {
        if (c.month >= 1) monthCounts[c.month] = (monthCounts[c.month] || 0) + 1;
      }
      for (const c of state.floor) {
        floorCounts[c.month] = (floorCounts[c.month] || 0) + 1;
      }
      const canShakeMonths = [];
      const canBombMonths = [];
      for (const mStr in monthCounts) {
        const m = Number(mStr);
        if (monthCounts[m] === 3) {
          if (floorCounts[m] === 1) canBombMonths.push(m);
          else if (!floorCounts[m] && !player.shakeMonths.includes(m)) canShakeMonths.push(m);
        }
      }

      const canStop = scoreInfo.totalScore >= target && scoreIncreased;
      const canGo = canStop && !isLastCardPending && state.phase === 'GO_STOP_DECISION';
      const canChongtong = config.chongtongWin && player.hadTurnCount === 0 && player.chongtongMonths.length > 0 && !player.declinedChongtong;

      return {
        canChongtong,
        canShakeMonths,
        canBombMonths,
        canStop,
        canGo,
        scoreInfo
      };
    }

    // --- Settlement (RULES.md §6, §7, §8) ---
    function settle(state) {
      const config = state.config;

      // Nagari / Floor Chongtong
      if (state.winner === null || state.winReason === 'nagari' || state.winReason === 'floor_chongtong') {
        const isFloorChongtong = state.winReason === 'floor_chongtong';
        const nextNagariStack = isFloorChongtong
          ? state.nagariStack
          : (config.nagariMultiplier ? state.nagariStack + 1 : state.nagariStack);
        return {
          isNagari: true,
          winReason: state.winReason || 'nagari',
          winner: null,
          score: null,
          multipliers: null,
          payments: [],
          totalWon: 0,
          nextNagariStack
        };
      }

      const winnerId = state.winner;
      const winner = state.players[winnerId];
      const losers = state.players.filter(p => p.id !== winnerId);

      // Special instant wins: Chongtong / Three Ppeok (2P: 7, 3P: 3, mult x1)
      if (state.winReason === 'chongtong' || state.winReason === 'three_ppeok') {
        const fixedScore = config.playerCount === 2 ? 7 : 3;
        const payments = [];
        let totalWon = 0;
        for (const l of losers) {
          const due = fixedScore * config.unitPointValue;
          const paid = config.allowDebt ? due : Math.min(due, Math.max(0, l.coins));
          totalWon += paid;
          payments.push({
            from: l.id,
            to: winnerId,
            due,
            paid,
            rawAmount: due,
            isPibak: false,
            isGwangbak: false,
            isGobak: false,
            isGobakSoloPayer: false,
            isOpponentMeongbak: false
          });
        }
        return {
          isNagari: false,
          winReason: state.winReason,
          winner: winnerId,
          score: { totalScore: fixedScore, baseScore: fixedScore, gukjinAsDouble: false },
          multipliers: { goMult: 1, shakeBombMult: 1, meongttaMult: 1, nagariMult: 1, commonMult: 1 },
          payments,
          totalWon,
          nextNagariStack: 0
        };
      }

      // Normal Win Settlement
      const wScore = scoreOf(state, winnerId);
      const goMult = winner.goCount >= 3 ? Math.pow(2, winner.goCount - 2) : 1;

      let shakeBombCount = winner.shakeMonths.length + winner.bombMonths.length;
      if (config.loserShakeApplies) {
        for (const l of losers) {
          shakeBombCount += l.shakeMonths.length + l.bombMonths.length;
        }
      }
      const shakeBombMult = Math.pow(2, shakeBombCount);

      const meongttaMult = config.meongttaEnabled === true && wScore.animalCount >= 7 ? 2 : 1;

      let nagariMult = 1;
      if (config.nagariMultiplier && state.nagariStack > 0) {
        const rawNagari = Math.pow(2, state.nagariStack);
        nagariMult = config.nagariMaxStack === Infinity ? rawNagari : Math.min(rawNagari, config.nagariMaxStack);
      }

      const commonMult = goMult * shakeBombMult * meongttaMult * nagariMult;
      const pibakThreshold = config.playerCount === 2 ? config.pibakThreshold2P : config.pibakThreshold3P;

      const rawResults = [];
      for (const l of losers) {
        let loserPiCount = 0;
        for (const c of l.captured.junk) loserPiCount += c.piValue;
        const loserHasGukjin = l.captured.animal.some(c => c.isGukjin);
        if (loserHasGukjin && config.gukjinRule !== 'always_animal') {
          if (config.gukjinRule === 'choose_once_on_score') {
            if (l.gukjinAsDoublePi) loserPiCount += 2;
          } else {
            // auto_best for loser: if counting gukjin as 2 pi avoids pibak, apply it
            if (loserPiCount <= pibakThreshold && loserPiCount + 2 > pibakThreshold) {
              loserPiCount += 2;
            }
          }
        }

        const isPibak = wScore.piScore >= 1 && loserPiCount <= pibakThreshold;
        const isGwangbak = wScore.brightScore >= 2 && l.captured.bright.length === 0;
        const isOpponentMeongbak = config.meongttaEnabled === 'zero_opponent' && wScore.animalScore >= 1 && l.captured.animal.length === 0;
        const isGobak = l.goCount >= 1;

        let loserMult = (isPibak ? 2 : 1) * (isGwangbak ? 2 : 1) * (isOpponentMeongbak ? 2 : 1);
        if (config.playerCount === 2 && isGobak) {
          loserMult *= 2;
        }

        const rawAmount = wScore.totalScore * commonMult * loserMult * config.unitPointValue;
        rawResults.push({
          loser: l,
          loserPiCount,
          isPibak,
          isGwangbak,
          isOpponentMeongbak,
          isGobak,
          rawAmount
        });
      }

      // 3P Go-Bak Solo Payer (독박: no extra x2, last go caller pays sum)
      let soloPayerId = null;
      if (config.playerCount === 3) {
        const gobakList = rawResults.filter(r => r.isGobak);
        if (gobakList.length === 1) {
          soloPayerId = gobakList[0].loser.id;
        } else if (gobakList.length >= 2) {
          if (config.multiGoGobakRule === 'last_go_solo') {
            gobakList.sort((a, b) => b.loser.goOrder - a.loser.goOrder);
            soloPayerId = gobakList[0].loser.id;
          }
        }
      }

      const sumAllRaw = rawResults.reduce((acc, r) => acc + r.rawAmount, 0);
      const payments = [];
      let totalWon = 0;

      for (const r of rawResults) {
        let due = r.rawAmount;
        let isGobakSoloPayer = false;
        if (soloPayerId !== null) {
          if (r.loser.id === soloPayerId) {
            due = sumAllRaw;
            isGobakSoloPayer = true;
          } else {
            due = 0;
          }
        }
        const paid = config.allowDebt ? due : Math.min(due, Math.max(0, r.loser.coins));
        totalWon += paid;
        payments.push({
          from: r.loser.id,
          to: winnerId,
          due,
          paid,
          rawAmount: r.rawAmount,
          isPibak: r.isPibak,
          isGwangbak: r.isGwangbak,
          isGobak: r.isGobak,
          isGobakSoloPayer,
          isOpponentMeongbak: r.isOpponentMeongbak
        });
      }

      return {
        isNagari: false,
        winReason: state.winReason || 'stop',
        winner: winnerId,
        score: wScore,
        multipliers: {
          goMult,
          shakeBombMult,
          meongttaMult,
          nagariMult,
          commonMult
        },
        payments,
        totalWon,
        nextNagariStack: 0
      };
    }

    // --- Legal Moves ---
    function legalMoves(state, playerId) {
      if (state.phase === 'GAME_OVER') return [];
      const pid = playerId != null ? playerId : state.turn;
      if (pid !== state.turn && (!state.pendingAction || state.pendingAction.playerId !== pid)) {
        return [];
      }

      if (state.phase === 'CHONGTONG_CHOICE') {
        return [
          { type: 'DECLARE_CHONGTONG', playerId: pid },
          { type: 'DECLINE_CHONGTONG', playerId: pid }
        ];
      }
      if (state.phase === 'GO_STOP_DECISION') {
        return [
          { type: 'DECLARE_STOP', playerId: pid },
          { type: 'DECLARE_GO', playerId: pid }
        ];
      }
      if (state.phase === 'CHOOSE_FLOOR') {
        return state.pendingAction.options.map(c => ({
          type: 'CHOOSE_FLOOR',
          playerId: pid,
          cardId: c.id
        }));
      }

      // PLAY_HAND
      const player = state.players[pid];
      const moves = [];
      const monthCounts = Object.create(null);
      const floorCounts = Object.create(null);
      for (const c of player.hand) {
        if (c.isBonus) {
          moves.push({ type: 'PLAY_BONUS', playerId: pid, cardId: c.id });
        } else if (c.isEmptyBomb) {
          moves.push({ type: 'PLAY_PASS', playerId: pid, cardId: c.id });
        } else {
          monthCounts[c.month] = (monthCounts[c.month] || 0) + 1;
        }
      }
      for (const c of state.floor) {
        floorCounts[c.month] = (floorCounts[c.month] || 0) + 1;
      }

      // Bombs
      for (const mStr in monthCounts) {
        const m = Number(mStr);
        if (monthCounts[m] === 3 && floorCounts[m] === 1) {
          moves.push({ type: 'PLAY_BOMB', playerId: pid, month: m });
        }
      }

      // Play card (with optional shake)
      for (const c of player.hand) {
        if (c.isBonus || c.isEmptyBomb) continue;
        moves.push({ type: 'PLAY_CARD', playerId: pid, cardId: c.id, shake: false });
        if (monthCounts[c.month] === 3 && !floorCounts[c.month] && !player.shakeMonths.includes(c.month)) {
          moves.push({ type: 'PLAY_CARD', playerId: pid, cardId: c.id, shake: true });
        }
      }
      return moves;
    }

    // --- Internal Helpers for Capturing & Turn Advancement ---
    function captureCardsToPlayer(player, cards) {
      for (const c of cards) {
        if (c.category === 'bright') player.captured.bright.push(c);
        else if (c.category === 'animal') player.captured.animal.push(c);
        else if (c.category === 'ribbon') player.captured.ribbon.push(c);
        else player.captured.junk.push(c); // 'junk' or 'bonus'
      }
    }

    function areEquivalentFloorCards(c1, c2) {
      return c1.category === c2.category && c1.subType === c2.subType && c1.piValue === c2.piValue;
    }

    function executePiSteal(state, winnerPlayer, count, events) {
      if (count <= 0) return;
      for (const opp of state.players) {
        if (opp.id === winnerPlayer.id) continue;
        for (let i = 0; i < count; i++) {
          if (opp.captured.junk.length === 0) break;
          // Priority: 1-pi first, then lowest piValue >= 2
          let bestIdx = opp.captured.junk.findIndex(c => c.piValue === 1);
          if (bestIdx === -1) {
            let minVal = Infinity;
            for (let j = 0; j < opp.captured.junk.length; j++) {
              if (opp.captured.junk[j].piValue < minVal) {
                minVal = opp.captured.junk[j].piValue;
                bestIdx = j;
              }
            }
          }
          if (bestIdx !== -1) {
            const stolen = opp.captured.junk.splice(bestIdx, 1)[0];
            winnerPlayer.captured.junk.push(stolen);
            events.push({ type: 'steal_pi', from: opp.id, to: winnerPlayer.id, card: stolen });
            appendLog(state, winnerPlayer.name + ' ← ' + opp.name + ' 피 뺏기(' + stolen.name + ')');
          }
        }
      }
    }

    function removeCardFromFloor(floor, cardId) {
      const idx = floor.findIndex(c => c.id === cardId);
      if (idx !== -1) return floor.splice(idx, 1)[0];
      return null;
    }

    function advanceToNextPlayer(state) {
      const n = state.players.length;
      let nextTurn = -1;
      for (let step = 1; step <= n; step++) {
        const cand = (state.turn + step) % n;
        if (state.players[cand].hand.length > 0) {
          nextTurn = cand;
          break;
        }
      }
      if (nextTurn === -1) {
        // All hands empty -> Nagari
        state.phase = 'GAME_OVER';
        state.winner = null;
        state.winReason = 'nagari';
        state.pendingAction = null;
        state.settlement = settle(state);
        appendLog(state, '모든 패 소진 — 나가리(무승부)');
        return 'nagari';
      }

      state.turn = nextTurn;
      state.turnNumber += 1;
      const nextP = state.players[nextTurn];
      if (state.config.chongtongWin && nextP.hadTurnCount === 0 && nextP.chongtongMonths.length > 0 && !nextP.declinedChongtong) {
        state.phase = 'CHONGTONG_CHOICE';
        state.pendingAction = {
          type: 'CHONGTONG_CHOICE',
          playerId: nextTurn,
          months: nextP.chongtongMonths.slice()
        };
      } else {
        state.phase = 'PLAY_HAND';
        state.pendingAction = null;
      }
      return 'next_turn';
    }

    function finalizeTurnAfterMatches(state, playerId, isLastTurn, stealCount, didCapture, events) {
      const player = state.players[playerId];
      player.hadTurnCount += 1;

      // Three Ppeok Instant Win
      if (state.config.threePpeokWin && player.ppeokCount >= 3) {
        state.phase = 'GAME_OVER';
        state.winner = playerId;
        state.winReason = 'three_ppeok';
        state.pendingAction = null;
        state.settlement = settle(state);
        events.push({ type: 'three_ppeok', playerId });
        events.push({ type: 'game_over', winner: playerId, winReason: 'three_ppeok' });
        appendLog(state, player.name + ' 삼연뻑 즉시 승리!');
        return { state, events };
      }

      // Sweep (싹쓸이)
      let totalSteal = stealCount;
      if (didCapture && state.floor.length === 0 && !isLastTurn) {
        totalSteal += 1;
        events.push({ type: 'sweep', playerId });
        appendLog(state, player.name + ' 싹쓸이(쓸)!');
      }

      if (totalSteal > 0 && !isLastTurn) {
        executePiSteal(state, player, totalSteal, events);
      }

      // Evaluate Score & Win Check
      const scoreInfo = scoreOf(state, playerId);
      const target = state.config.playerCount === 2 ? state.config.winScoreTarget2P : state.config.winScoreTarget3P;
      const scoreIncreased = player.goCount === 0 || scoreInfo.totalScore > player.lastGoScore;
      const canStopNow = scoreInfo.totalScore >= target && scoreIncreased;

      if (isLastTurn) {
        if (canStopNow) {
          state.phase = 'GAME_OVER';
          state.winner = playerId;
          state.winReason = 'auto_stop_last_turn';
          state.pendingAction = null;
          state.settlement = settle(state);
          events.push({ type: 'score_ready', playerId, score: scoreInfo });
          events.push({ type: 'stop', playerId, score: scoreInfo });
          events.push({ type: 'game_over', winner: playerId, winReason: 'auto_stop_last_turn' });
          appendLog(state, player.name + ' 마지막 턴 자동 스톱 (' + scoreInfo.totalScore + '점)');
          return { state, events };
        }
        const res = advanceToNextPlayer(state);
        if (res === 'nagari') {
          events.push({ type: 'nagari' });
          events.push({ type: 'game_over', winner: null, winReason: 'nagari' });
        }
        return { state, events };
      }

      if (canStopNow) {
        state.phase = 'GO_STOP_DECISION';
        state.pendingAction = {
          type: 'GO_STOP_DECISION',
          playerId,
          scoreInfo
        };
        events.push({ type: 'score_ready', playerId, score: scoreInfo });
        return { state, events };
      }

      const res = advanceToNextPlayer(state);
      if (res === 'nagari') {
        events.push({ type: 'nagari' });
        events.push({ type: 'game_over', winner: null, winReason: 'nagari' });
      }
      return { state, events };
    }

    function resolveFlipCardStep(state, playerId, flippedCard, isLastTurn, stealCountSoFar, didCaptureSoFar, eventsSoFar) {
      const player = state.players[playerId];
      let stealCount = stealCountSoFar;
      let didCapture = didCaptureSoFar;

      if (!flippedCard) {
        return finalizeTurnAfterMatches(state, playerId, isLastTurn, stealCount, didCapture, eventsSoFar);
      }

      const fMonth = flippedCard.month;
      const floorFlipSame = state.floor.filter(c => c.month === fMonth);

      if (floorFlipSame.length === 0) {
        state.floor.push(flippedCard);
        return finalizeTurnAfterMatches(state, playerId, isLastTurn, stealCount, didCapture, eventsSoFar);
      }
      if (floorFlipSame.length === 1) {
        removeCardFromFloor(state.floor, floorFlipSame[0].id);
        captureCardsToPlayer(player, [flippedCard, floorFlipSame[0]]);
        didCapture = true;
        eventsSoFar.push({ type: 'match', source: 'flip', playerId, cards: [flippedCard, floorFlipSame[0]] });
        return finalizeTurnAfterMatches(state, playerId, isLastTurn, stealCount, didCapture, eventsSoFar);
      }
      if (floorFlipSame.length === 2) {
        const needChoice = state.config.alwaysChooseTwoCards || !areEquivalentFloorCards(floorFlipSame[0], floorFlipSame[1]);
        if (needChoice) {
          state.phase = 'CHOOSE_FLOOR';
          state.pendingAction = {
            type: 'CHOOSE_FLOOR',
            source: 'flip',
            playerId,
            playedCard: flippedCard,
            options: floorFlipSame.slice(),
            deferredFlipCard: null,
            isLastTurn,
            stealCountSoFar: stealCount,
            didCaptureSoFar: didCapture,
            eventsSoFar
          };
          eventsSoFar.push({ type: 'floor_choice_required', source: 'flip', playerId, options: floorFlipSame.slice() });
          return { state, events: eventsSoFar };
        }
        removeCardFromFloor(state.floor, floorFlipSame[0].id);
        captureCardsToPlayer(player, [flippedCard, floorFlipSame[0]]);
        didCapture = true;
        eventsSoFar.push({ type: 'match', source: 'flip', playerId, cards: [flippedCard, floorFlipSame[0]] });
        return finalizeTurnAfterMatches(state, playerId, isLastTurn, stealCount, didCapture, eventsSoFar);
      }

      // floorFlipSame.length === 3 (eating ppeok via deck flip)
      for (const fc of floorFlipSame) removeCardFromFloor(state.floor, fc.id);
      captureCardsToPlayer(player, floorFlipSame.concat(flippedCard));
      didCapture = true;
      const ppeokOwner = state.ppeokMonths[fMonth];
      delete state.ppeokMonths[fMonth];
      if (!isLastTurn) {
        stealCount += (ppeokOwner === playerId ? state.config.jaPpeokSteal : 1);
      }
      eventsSoFar.push({ type: 'match', source: 'flip', playerId, cards: floorFlipSame.concat(flippedCard), isPpeokEat: true, isJaPpeok: ppeokOwner === playerId });
      appendLog(state, player.name + ' 뒤집기로 ' + fMonth + '월 4장 먹기' + (ppeokOwner === playerId ? '(자뻑!)' : ''));
      return finalizeTurnAfterMatches(state, playerId, isLastTurn, stealCount, didCapture, eventsSoFar);
    }

    // --- Declare Go / Declare Stop ---
    function declareGo(state, playerId) {
      if (state.phase !== 'GO_STOP_DECISION' || !state.pendingAction || state.pendingAction.playerId !== playerId) {
        throw new Error('declareGo called in invalid state/player');
      }
      const next = cloneState(state);
      const player = next.players[playerId];
      const beforeScore = scoreOf(next, playerId);

      player.goCount += 1;
      next.goSequence += 1;
      player.goOrder = next.goSequence;
      player.lastGoScore = beforeScore.totalScore + (next.config.goScoreAdd ? 1 : 0);

      const events = [{ type: 'go', playerId, goCount: player.goCount, scoreAtGo: player.lastGoScore }];
      appendLog(next, player.name + ' ' + player.goCount + '고! (기준 점수 ' + player.lastGoScore + '점)');

      const res = advanceToNextPlayer(next);
      if (res === 'nagari') {
        events.push({ type: 'nagari' });
        events.push({ type: 'game_over', winner: null, winReason: 'nagari' });
      }
      return { state: next, events };
    }

    function declareStop(state, playerId) {
      if (state.phase !== 'GO_STOP_DECISION' || !state.pendingAction || state.pendingAction.playerId !== playerId) {
        throw new Error('declareStop called in invalid state/player');
      }
      const next = cloneState(state);
      next.phase = 'GAME_OVER';
      next.winner = playerId;
      next.winReason = 'stop';
      next.pendingAction = null;
      next.settlement = settle(next);

      const events = [
        { type: 'stop', playerId, score: next.settlement.score },
        { type: 'game_over', winner: playerId, winReason: 'stop' }
      ];
      appendLog(next, next.players[playerId].name + ' 스톱! (' + next.settlement.score.totalScore + '점, 수령 ' + next.settlement.totalWon + '원)');
      return { state: next, events };
    }

    // --- Main Pure Move Reducer ---
    function applyMove(state, move) {
      if (state.phase === 'GAME_OVER') {
        throw new Error('Cannot apply move after GAME_OVER');
      }
      const pid = move.playerId != null ? move.playerId : state.turn;

      if (move.type === 'DECLARE_GO') return declareGo(state, pid);
      if (move.type === 'DECLARE_STOP') return declareStop(state, pid);

      const next = cloneState(state);
      const player = next.players[pid];
      const events = [];

      // 1. CHONGTONG_CHOICE
      if (next.phase === 'CHONGTONG_CHOICE') {
        if (pid !== next.turn) throw new Error('Not player turn for chongtong');
        if (move.type === 'DECLARE_CHONGTONG') {
          next.phase = 'GAME_OVER';
          next.winner = pid;
          next.winReason = 'chongtong';
          next.pendingAction = null;
          next.settlement = settle(next);
          events.push({ type: 'chongtong', playerId: pid, months: player.chongtongMonths.slice() });
          events.push({ type: 'game_over', winner: pid, winReason: 'chongtong' });
          appendLog(next, player.name + ' 총통 즉시 승리!');
          return { state: next, events };
        }
        if (move.type === 'DECLINE_CHONGTONG') {
          player.declinedChongtong = true;
          next.phase = 'PLAY_HAND';
          next.pendingAction = null;
          appendLog(next, player.name + ' 총통 계속 진행 선택');
          return { state: next, events };
        }
        throw new Error('Invalid move in CHONGTONG_CHOICE: ' + move.type);
      }

      // 2. CHOOSE_FLOOR
      if (next.phase === 'CHOOSE_FLOOR') {
        if (move.type !== 'CHOOSE_FLOOR' || !next.pendingAction || next.pendingAction.playerId !== pid) {
          throw new Error('Invalid move in CHOOSE_FLOOR');
        }
        const pa = next.pendingAction;
        const chosen = removeCardFromFloor(next.floor, move.cardId);
        if (!chosen) throw new Error('Chosen floor card not found: ' + move.cardId);

        captureCardsToPlayer(player, [pa.playedCard, chosen]);
        const didCapture = true;
        const evs = pa.eventsSoFar.slice();
        evs.push({ type: 'match', source: pa.source, playerId: pid, cards: [pa.playedCard, chosen] });
        next.pendingAction = null;

        if (pa.source === 'hand') {
          return resolveFlipCardStep(next, pid, pa.deferredFlipCard, pa.isLastTurn, pa.stealCountSoFar, didCapture, evs);
        }
        return finalizeTurnAfterMatches(next, pid, pa.isLastTurn, pa.stealCountSoFar, didCapture, evs);
      }

      // 3. PLAY_HAND
      if (next.phase !== 'PLAY_HAND' || pid !== next.turn) {
        throw new Error('Invalid phase/turn for move: ' + next.phase + ' / ' + move.type);
      }

      // 3a. PLAY_BONUS
      if (move.type === 'PLAY_BONUS') {
        const idx = player.hand.findIndex(c => c.id === move.cardId && c.isBonus);
        if (idx === -1) throw new Error('Bonus card not in hand');
        const bCard = player.hand.splice(idx, 1)[0];
        player.captured.junk.push(bCard);
        let drawn = null;
        if (next.deck.length > 0) {
          drawn = next.deck.shift();
          player.hand.push(drawn);
        }
        events.push({ type: 'bonus_draw', source: 'hand', playerId: pid, bonusCard: bCard, drawnCard: drawn });
        appendLog(next, player.name + ' 보너스패(' + bCard.name + ') 사용 → 1장 보충');
        return { state: next, events };
      }

      // 3b. PLAY_PASS (Empty Bomb token)
      if (move.type === 'PLAY_PASS') {
        const idx = player.hand.findIndex(c => c.id === move.cardId && c.isEmptyBomb);
        if (idx === -1) throw new Error('Empty bomb pass card not in hand');
        player.hand.splice(idx, 1);
        const isLastTurn = player.hand.length === 0;
        appendLog(next, player.name + ' 폭탄 패스(빈 패)');

        let flippedCard = null;
        while (next.deck.length > 0) {
          const top = next.deck.shift();
          if (top.isBonus) {
            player.captured.junk.push(top);
            events.push({ type: 'bonus_draw', source: 'deck', playerId: pid, bonusCard: top });
            appendLog(next, player.name + ' 더미 보너스패(' + top.name + ') 획득');
          } else {
            flippedCard = top;
            break;
          }
        }
        return resolveFlipCardStep(next, pid, flippedCard, isLastTurn, 0, false, events);
      }

      // 3c. PLAY_BOMB
      if (move.type === 'PLAY_BOMB') {
        const m = move.month;
        const handSame = player.hand.filter(c => c.month === m);
        const floorSame = next.floor.filter(c => c.month === m);
        if (handSame.length !== 3 || floorSame.length !== 1) {
          throw new Error('Illegal bomb for month ' + m);
        }
        player.hand = player.hand.filter(c => c.month !== m);
        next.bombTokenSeq += 1;
        player.hand.push(createEmptyBombCard(next.bombTokenSeq));
        next.bombTokenSeq += 1;
        player.hand.push(createEmptyBombCard(next.bombTokenSeq));
        player.bombMonths.push(m);

        removeCardFromFloor(next.floor, floorSame[0].id);
        captureCardsToPlayer(player, handSame.concat(floorSame[0]));
        const isLastTurn = player.hand.length === 0;
        const stealCount = isLastTurn ? 0 : 1;
        events.push({ type: 'bomb', playerId: pid, month: m, cards: handSame.concat(floorSame[0]) });
        appendLog(next, player.name + ' ' + m + '월 폭탄! (빈 패 2장 지급)');

        let flippedCard = null;
        while (next.deck.length > 0) {
          const top = next.deck.shift();
          if (top.isBonus) {
            player.captured.junk.push(top);
            events.push({ type: 'bonus_draw', source: 'deck', playerId: pid, bonusCard: top });
            appendLog(next, player.name + ' 더미 보너스패(' + top.name + ') 획득');
          } else {
            flippedCard = top;
            break;
          }
        }
        return resolveFlipCardStep(next, pid, flippedCard, isLastTurn, stealCount, true, events);
      }

      // 3d. PLAY_CARD
      if (move.type === 'PLAY_CARD') {
        const idx = player.hand.findIndex(c => c.id === move.cardId && !c.isBonus && !c.isEmptyBomb);
        if (idx === -1) throw new Error('Card not in hand: ' + move.cardId);
        const playedCard = player.hand[idx];
        const m = playedCard.month;

        if (move.shake) {
          const sameInHand = player.hand.filter(c => c.month === m);
          const sameOnFloor = next.floor.filter(c => c.month === m);
          if (sameInHand.length !== 3 || sameOnFloor.length !== 0 || player.shakeMonths.includes(m)) {
            throw new Error('Illegal shake for month ' + m);
          }
          player.shakeMonths.push(m);
          events.push({ type: 'shake', playerId: pid, month: m });
          appendLog(next, player.name + ' ' + m + '월 흔들기 선언!');
        }

        player.hand.splice(idx, 1);
        const isLastTurn = player.hand.length === 0;
        const floorSame = next.floor.filter(c => c.month === m);

        // Pop from deck (consuming any bonus cards first)
        let flippedCard = null;
        while (next.deck.length > 0) {
          const top = next.deck.shift();
          if (top.isBonus) {
            player.captured.junk.push(top);
            events.push({ type: 'bonus_draw', source: 'deck', playerId: pid, bonusCard: top });
            appendLog(next, player.name + ' 더미 보너스패(' + top.name + ') 획득');
          } else {
            flippedCard = top;
            break;
          }
        }

        // Case 1: Same month flipped from deck (M === F) -> Jjok / Ppeok / Ttadak
        if (flippedCard && flippedCard.month === m) {
          if (floorSame.length === 0) {
            // 쪽
            captureCardsToPlayer(player, [playedCard, flippedCard]);
            const stealCount = isLastTurn ? 0 : 1;
            events.push({ type: 'match', source: 'jjok', playerId: pid, cards: [playedCard, flippedCard] });
            events.push({ type: 'jjok', playerId: pid, month: m });
            appendLog(next, player.name + ' ' + m + '월 쪽!');
            return finalizeTurnAfterMatches(next, pid, isLastTurn, stealCount, true, events);
          }
          if (floorSame.length === 1) {
            // 뻑 (설사) - leave all 3 on floor
            next.floor.push(playedCard, flippedCard);
            next.ppeokMonths[m] = pid;
            if (!isLastTurn) {
              player.ppeokCount += 1;
              if (next.config.firstPpeokBonus && player.hadTurnCount === 0) {
                player.bonusPoints += 3;
              }
              if (next.config.twoPpeokBonus && player.ppeokCount === 2) {
                player.bonusPoints += 5;
              }
            }
            events.push({ type: 'ppeok', playerId: pid, month: m, ppeokCount: player.ppeokCount });
            appendLog(next, player.name + ' ' + m + '월 뻑! (누적 ' + player.ppeokCount + '회)');
            return finalizeTurnAfterMatches(next, pid, isLastTurn, 0, false, events);
          }
          if (floorSame.length === 2) {
            // 따닥 - capture all 4 without floor choice
            for (const fc of floorSame) removeCardFromFloor(next.floor, fc.id);
            captureCardsToPlayer(player, floorSame.concat([playedCard, flippedCard]));
            const stealCount = isLastTurn ? 0 : 1;
            events.push({ type: 'match', source: 'ttadak', playerId: pid, cards: floorSame.concat([playedCard, flippedCard]) });
            events.push({ type: 'ttadak', playerId: pid, month: m });
            appendLog(next, player.name + ' ' + m + '월 따닥!');
            return finalizeTurnAfterMatches(next, pid, isLastTurn, stealCount, true, events);
          }
        }

        // Case 2: Different month (or no flipped card)
        let stealCount = 0;
        let didCapture = false;

        if (floorSame.length === 0) {
          next.floor.push(playedCard);
        } else if (floorSame.length === 1) {
          removeCardFromFloor(next.floor, floorSame[0].id);
          captureCardsToPlayer(player, [playedCard, floorSame[0]]);
          didCapture = true;
          events.push({ type: 'match', source: 'hand', playerId: pid, cards: [playedCard, floorSame[0]] });
        } else if (floorSame.length === 2) {
          const needChoice = next.config.alwaysChooseTwoCards || !areEquivalentFloorCards(floorSame[0], floorSame[1]);
          if (needChoice) {
            next.phase = 'CHOOSE_FLOOR';
            next.pendingAction = {
              type: 'CHOOSE_FLOOR',
              source: 'hand',
              playerId: pid,
              playedCard,
              options: floorSame.slice(),
              deferredFlipCard: flippedCard,
              isLastTurn,
              stealCountSoFar: 0,
              didCaptureSoFar: false,
              eventsSoFar: events
            };
            events.push({ type: 'floor_choice_required', source: 'hand', playerId: pid, options: floorSame.slice() });
            return { state: next, events };
          }
          removeCardFromFloor(next.floor, floorSame[0].id);
          captureCardsToPlayer(player, [playedCard, floorSame[0]]);
          didCapture = true;
          events.push({ type: 'match', source: 'hand', playerId: pid, cards: [playedCard, floorSame[0]] });
        } else if (floorSame.length === 3) {
          for (const fc of floorSame) removeCardFromFloor(next.floor, fc.id);
          captureCardsToPlayer(player, floorSame.concat(playedCard));
          didCapture = true;
          const ppeokOwner = next.ppeokMonths[m];
          delete next.ppeokMonths[m];
          if (!isLastTurn) {
            stealCount += (ppeokOwner === pid ? next.config.jaPpeokSteal : 1);
          }
          events.push({ type: 'match', source: 'hand', playerId: pid, cards: floorSame.concat(playedCard), isPpeokEat: true, isJaPpeok: ppeokOwner === pid });
          appendLog(next, player.name + ' ' + m + '월 4장 먹기' + (ppeokOwner === pid ? '(자뻑!)' : ''));
        }

        return resolveFlipCardStep(next, pid, flippedCard, isLastTurn, stealCount, didCapture, events);
      }

      throw new Error('Unknown move type: ' + move.type);
    }

    function countPhysicalCards(state) {
      let count = 0;
      for (const p of state.players) {
        for (const c of p.hand) if (!c.isEmptyBomb) count++;
        count += p.captured.bright.length;
        count += p.captured.animal.length;
        count += p.captured.ribbon.length;
        count += p.captured.junk.length;
      }
      count += state.floor.length;
      count += state.deck.length;
      if (state.pendingAction) {
        if (state.pendingAction.playedCard && !state.pendingAction.playedCard.isEmptyBomb) count++;
        if (state.pendingAction.deferredFlipCard && !state.pendingAction.deferredFlipCard.isEmptyBomb) count++;
      }
      return count;
    }

    return {
      CARDS_48,
      BONUS_POOL,
      CARDS_BY_ID,
      hashSeed,
      nextRand,
      normalizeConfig,
      newGame,
      createCustomState,
      legalMoves,
      applyMove,
      scoreOf,
      gukjinSideOf,
      canDeclare,
      declareGo,
      declareStop,
      settle,
      countPhysicalCards
    };
  })();
